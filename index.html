<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B2016">
<title>59-Second College Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --turf:#0B2016;
  --field:#12321F;
  --panel:#18402A;
  --panel-hi:#205035;
  --line:#2C5A3D;
  --chalk:#F0EDE1;
  --amber:#FFB627;
  --amber-deep:#C8830B;
  --brick:#C4432A;
  --dim:#84A08D;
  --dim-2:#5C7A66;
  --win:#57C77A;
  --disp:'Anton','Haettenschweiler','Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* iOS Safari resizes the viewport as its toolbars collapse and expand,
   which makes everything shift. Pinning the document so it can never
   scroll keeps the toolbars in one state and the layout still. */
html{height:100%;height:100dvh}
html,body{
  margin:0;padding:0;width:100%;height:100%;height:100dvh;
  position:fixed;inset:0;overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation;
}
body{
  background:var(--turf);
  color:var(--chalk);
  font-family:var(--body);
  font-size:15.5px;line-height:1.5;
  text-size-adjust:100%;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
/* faint yard-line texture */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(90deg,transparent 0 63px,rgba(240,237,225,.035) 63px 64px);
}
#app{
  position:absolute;inset:0;z-index:1;
  display:flex;flex-direction:column;
  height:100%;height:100dvh;
}

/* ---------- header ---------- */
header{
  flex:0 0 auto;padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:linear-gradient(180deg,#0A1C13,#0B2016);
  border-bottom:1px solid var(--line);
}
.hdr-row{display:flex;align-items:center;gap:12px}
.hdr-team{
  font-family:var(--disp);font-size:23px;letter-spacing:.02em;
  text-transform:uppercase;line-height:1;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hdr-money{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
  white-space:nowrap;cursor:pointer;background:rgba(255,182,39,.10);
  border:1px solid rgba(255,182,39,.34);border-radius:8px;
  padding:7px 11px;min-height:48px;justify-content:center;
  touch-action:manipulation;-webkit-appearance:none;
}
.hdr-money .lbl{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber-deep);line-height:1;
}
.hdr-money .amt{
  font-family:var(--mono);font-size:21px;font-weight:600;color:var(--amber);line-height:1;
  font-variant-numeric:tabular-nums;
}
.hdr-money .amt::after{content:'\203A';font-size:14px;color:var(--amber-deep);margin-left:6px}
.hdr-money:active{background:rgba(255,182,39,.2)}
.hdr-sub{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px 11px;margin-top:6px;
  font-family:var(--mono);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);
}
.hdr-sub b{color:var(--chalk);font-weight:500}
.hchip{
  display:inline-flex;align-items:center;gap:3px;
  border:1px solid var(--line);border-radius:4px;
  padding:3px 7px;font-size:10.5px;letter-spacing:.06em;line-height:1.3;
}
.hchip i{font-style:normal;opacity:.55}
.hchip.roster{color:var(--chalk);border-color:var(--line);background:rgba(240,237,225,.05)}
.hdr-score{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:7px;padding-top:6px;border-top:1px solid rgba(44,90,61,.55);
}
.hdr-score .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim-2)}
#hScore{
  font-family:var(--mono);font-size:16px;font-weight:600;color:var(--chalk);
  font-variant-numeric:tabular-nums;transition:color .25s,text-shadow .25s;
}
#hScore.tick{color:var(--amber);text-shadow:0 0 12px rgba(255,182,39,.5)}

/* ---------- scroll body ---------- */
main{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;overflow-anchor:none;
  padding:14px 14px 24px;
}

/* ---------- tab bar ---------- */
nav{
  flex:0 0 auto;display:flex;
  background:#081810;border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
nav button{
  flex:1;background:none;border:0;color:var(--dim-2);
  padding:15px 2px 14px;cursor:pointer;min-height:56px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;transition:color .15s;
  border-top:2px solid transparent;margin-top:-1px;
  touch-action:manipulation;-webkit-appearance:none;
}
nav button.on{color:var(--amber);border-top-color:var(--amber)}
nav button.gear{
  flex:0 0 54px;display:flex;align-items:center;justify-content:center;
  padding:15px 0 14px;
}
nav button.gear svg{display:block}

/* ---------- generic blocks ---------- */
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim-2);margin:0 0 8px;
}
.card{
  background:var(--field);border:1px solid var(--line);
  border-radius:3px;padding:13px;margin-bottom:12px;
}
h2.sec{
  font-family:var(--disp);font-size:17px;letter-spacing:.04em;
  text-transform:uppercase;margin:22px 0 9px;color:var(--chalk);
}
h2.sec:first-child{margin-top:0}

/* ---------- buttons ---------- */
button.btn{
  font-family:var(--disp);font-size:17px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--amber);color:#20160A;border:0;border-radius:6px;
  padding:15px 18px;width:100%;cursor:pointer;min-height:52px;
  transition:filter .12s,transform .06s;
  touch-action:manipulation;-webkit-appearance:none;
}
button.btn:active{transform:translateY(1px)}
button.btn:disabled{background:var(--panel);color:var(--dim-2);cursor:default}
button.btn.ghost{background:none;border:1px solid var(--line);color:var(--chalk)}
button.btn.sm{font-size:14px;padding:12px 14px;width:auto;min-height:46px}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- pinned actions ---------- */
.stickybar{
  position:sticky;top:0;z-index:6;
  background:var(--turf);
  padding:2px 0 12px;margin-bottom:2px;
  box-shadow:0 10px 12px -8px var(--turf);
}
button.mini{
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;
  background:var(--amber);color:#20160A;border:0;border-radius:5px;
  padding:11px 13px;cursor:pointer;white-space:nowrap;min-height:42px;
  touch-action:manipulation;-webkit-appearance:none;
}
button.mini:active{opacity:.7}

/* ---------- achievements ---------- */
.achbar{height:5px;border-radius:3px;background:var(--panel-hi);margin-top:10px;overflow:hidden}
.achbar span{display:block;height:100%;background:var(--amber)}
.achtick{
  font-family:var(--mono);font-size:15px;text-align:center;
  color:var(--dim-2);
}
.achtick.on{color:var(--win);font-weight:700}

/* ---------- week picker ---------- */
.weekpick{
  display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.weekpick::-webkit-scrollbar{display:none}
.weekpick button{
  flex:0 0 auto;min-width:44px;min-height:44px;
  background:var(--panel);border:1px solid var(--line);border-radius:5px;
  color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;
  touch-action:manipulation;-webkit-appearance:none;
}
.weekpick button.on{background:var(--amber);color:#20160A;border-color:var(--amber)}

/* ---------- schedule page header ---------- */
.navarrow{
  flex:0 0 auto;width:44px;height:44px;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);color:var(--chalk);
  font-size:22px;line-height:1;cursor:pointer;
  touch-action:manipulation;-webkit-appearance:none;
}
.navarrow:active{background:var(--panel-hi)}
.schedhead{
  flex:1;min-width:0;display:flex;align-items:center;gap:11px;
  background:none;border:0;color:inherit;cursor:pointer;text-align:left;
  font-family:inherit;padding:0;touch-action:manipulation;
}
.schedhead .t{display:block;font-family:var(--disp);font-size:18px;letter-spacing:.02em;
  text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schedhead .s{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px}

/* ---------- schedule list ---------- */
.sched{display:flex;flex-direction:column;gap:5px}
.sc-item{background:var(--field);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.sc-row{
  display:grid;grid-template-columns:20px 26px 1fr auto;align-items:center;gap:11px;
  padding:12px 12px;min-height:58px;touch-action:manipulation;
}
.sc-row.tap{cursor:pointer}
.sc-row.tap:active{background:var(--panel)}
.sc-row.open{background:var(--panel);border-bottom:1px solid var(--line)}
.sc-wk{font-family:var(--mono);font-size:10px;color:var(--dim-2);text-align:center}
.sc-info{min-width:0;display:flex;flex-direction:column}
.sc-name{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-sub{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.02em;margin-top:2px}
.sc-res{display:flex;align-items:center;gap:6px;white-space:nowrap;
  font-family:var(--mono);font-size:12px}
.sc-pts{color:var(--chalk);font-variant-numeric:tabular-nums}
.sc-pend{color:var(--dim-2)}
.sc-caret{color:var(--dim-2);font-size:10px}
.sc-ot{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--amber);
  background:rgba(255,182,39,.14);padding:1px 4px;border-radius:2px}
.sc-box{padding:9px 11px 11px;background:#071510}
.sb-item{display:flex;flex-direction:column}
.sb-item .sc-box{border:1px solid var(--line);border-top:0;border-radius:0 0 3px 3px}

/* ---------- schedule editor ---------- */
.ed-list{display:flex;flex-direction:column;gap:6px}
.ed-game{
  display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:4px;
  background:var(--field);border:1px solid var(--line);border-radius:3px;padding:5px;
}
.ed-game.mine{border-color:var(--amber)}
.ed-at{font-family:var(--mono);font-size:10px;color:var(--dim-2);text-align:center}
.ed-team{
  display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;
  column-gap:8px;align-items:center;
  background:none;border:1px solid transparent;border-radius:5px;
  padding:10px 8px;cursor:pointer;color:var(--chalk);text-align:left;font-family:inherit;
  min-width:0;min-height:50px;touch-action:manipulation;
}
.ed-team img,.ed-team .badge{grid-row:1/3}
.ed-n{font-family:var(--disp);font-size:14px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-c{font-family:var(--mono);font-size:10px;color:var(--dim-2);letter-spacing:.06em}
.ed-team:active{background:var(--panel)}
.ed-team.sel{border-color:var(--amber);background:rgba(255,182,39,.12)}
.ed-team.mine .ed-n{color:var(--amber)}
.ed-team:disabled{opacity:.45;cursor:default}

/* ---------- scoreboard ---------- */
.board{
  background:#071510;border:1px solid var(--line);border-radius:3px;
  padding:12px;margin-bottom:12px;
}
.bd-row{display:grid;grid-template-columns:30px 1fr auto auto;align-items:center;gap:10px;padding:7px 0}
.bd-row + .bd-row{border-top:1px solid rgba(44,90,61,.5)}
.bd-name{min-width:0}
.bd-abbr{font-family:var(--disp);font-size:17px;letter-spacing:.02em;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-meta{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.05em;margin-top:2px}
.bd-poss{
  font-family:var(--mono);font-size:11px;color:var(--dim);
  text-align:right;letter-spacing:.05em;white-space:nowrap;
}
.bd-score{
  font-family:var(--mono);font-weight:600;font-size:30px;color:var(--amber);
  min-width:52px;text-align:right;line-height:1;
  text-shadow:0 0 14px rgba(255,182,39,.28);font-variant-numeric:tabular-nums;
}
.bd-row.user .bd-abbr{color:var(--amber)}
.bd-row.dead .bd-score{color:var(--dim-2);text-shadow:none}
.bd-row.up{box-shadow:inset 3px 0 0 var(--amber);padding-left:7px}
.bd-row.up .bd-abbr::after{content:'●';color:var(--amber);font-size:10px;
  vertical-align:middle;margin-left:7px}

/* segmented control */
.speed{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.speed button{
  flex:1;background:var(--panel);border:0;border-right:1px solid var(--line);
  color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  padding:14px 5px;cursor:pointer;min-height:48px;
  touch-action:manipulation;-webkit-appearance:none;
}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--amber);color:#20160A}

/* ---------- quarter bar + box score ---------- */
.qbar{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--amber);text-align:center;padding:2px 0 8px;
  border-bottom:1px solid rgba(44,90,61,.5);margin-bottom:4px;
}
.boxwrap{border-top:1px solid rgba(44,90,61,.5);margin-top:8px;padding-top:8px;overflow-x:auto}
table.box{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
table.box th{
  padding:0 4px 4px;font-size:10px;letter-spacing:.1em;color:var(--dim-2);
  border-bottom:1px solid rgba(44,90,61,.5);text-align:right;
}
table.box th:first-child{text-align:left}
table.box td{padding:4px;border-bottom:0;color:var(--dim);text-align:right}
table.box td.tname{text-align:left;color:var(--chalk);font-family:var(--disp);
  font-size:14px;letter-spacing:.03em}
table.box td.now{color:var(--amber)}
table.box td.tot{color:var(--chalk);font-weight:600;
  border-left:1px solid rgba(44,90,61,.5);padding-left:8px}
table.box tr.me td.tname{color:var(--amber)}

/* ---------- classic scoreboard (VB6 colours) ---------- */
.board.classic{background:#000;border-color:#1d1d1d}
.cb-row{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;
  padding:8px 4px;
}
.cb-row + .cb-row{border-top:1px solid #161616}
.cb-row.dead{opacity:.55}
.cb-row.up{box-shadow:inset 3px 0 0 #FF0000;padding-left:8px}
.cb-mid{min-width:0}
.cb-name{
  font-family:var(--disp);font-size:22px;line-height:1.05;letter-spacing:.01em;
  color:#FF0000;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cb-stats{
  font-family:var(--mono);font-size:11px;font-weight:600;color:#808080;
  margin-top:5px;padding-left:14px;letter-spacing:.06em;
}
.cb-right{text-align:right}
.cb-score{
  font-family:var(--disp);font-size:30px;line-height:1;color:#FF0000;
  font-variant-numeric:tabular-nums;
}
.cb-left{font-family:var(--mono);font-size:10px;color:#fff;margin-top:4px;letter-spacing:.06em}
.board.classic .qbar{color:#FF0000;border-bottom-color:#1d1d1d}
.board.classic .boxwrap{border-top-color:#1d1d1d}
.board.classic table.box th{color:#6b6b6b;border-bottom-color:#1d1d1d}
.board.classic table.box td{color:#9a9a9a}
.board.classic table.box td.tname{color:#FF0000}
.board.classic table.box td.tot{color:#fff;border-left-color:#1d1d1d}
.board.classic table.box td.now{color:#fff}

/* ---------- conference championship ---------- */
img.conf-logo{object-fit:contain;flex:0 0 auto;vertical-align:middle}
.ccg-head{display:flex;align-items:center;gap:13px;border-color:var(--amber)}
.ccg-t{font-family:var(--disp);font-size:20px;letter-spacing:.03em;
  text-transform:uppercase;line-height:1.05}
.ccg-s{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber);margin-top:2px}
.ccg-bar{
  display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber);
}
.sb-ccg{display:flex;align-items:center;gap:4px;font-family:var(--mono);
  font-size:10px;letter-spacing:.08em;color:var(--dim)}

/* boosted / injured ratings */
.stat-up{color:#3FE07A;font-weight:700}
.stat-dn{color:#FF4D4D;font-weight:700}
.board.classic .stat-up{color:#3FE07A}
.board.classic .stat-dn{color:#FF6B6B}

/* ---------- injury strip ---------- */
.injbar{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
.inj{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  background:rgba(196,67,42,.18);color:var(--brick);
  border:1px solid rgba(196,67,42,.4);border-radius:2px;padding:3px 7px;
}

/* ---------- dice ---------- */
.dice-wrap{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 0 8px}
.die{
  width:44px;height:44px;border-radius:6px;background:var(--chalk);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:6px;box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.die i{border-radius:50%;background:#0B2016;width:8px;height:8px;align-self:center;justify-self:center}
.die{animation:tumble .28s ease-out}
@keyframes tumble{0%{transform:rotate(-14deg) scale(.86)}60%{transform:rotate(8deg) scale(1.06)}100%{transform:none}}
.dice-sum{font-family:var(--disp);font-size:30px;color:var(--amber);min-width:40px;text-align:center}

/* ---------- outcome grid (the signature) ---------- */
.grid-lbl{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px}
.ogrid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.og{
  text-align:center;border-radius:2px;padding:5px 0 4px;
  background:var(--panel);border:1px solid transparent;transition:all .18s;
}
.og .n{font-family:var(--mono);font-size:10px;color:var(--dim-2);display:block;line-height:1}
.og .p{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--dim);display:block;line-height:1.3}
.og.pts .p{color:var(--chalk)}
.og.td .p{color:var(--amber)}
.og.hit{background:var(--amber);border-color:#fff;transform:translateY(-2px)}
.og.hit .n,.og.hit .p{color:#20160A}

/* ---------- play log ---------- */
.log{max-height:172px;overflow-y:auto;margin-top:10px;
  font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--dim)}
.log div{padding:1px 0}
.log b{color:var(--chalk);font-weight:500}
.log .sc{color:var(--amber)}
.log .to{color:var(--amber);font-weight:600;letter-spacing:.04em}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th{
  text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim-2);padding:0 5px 6px;border-bottom:1px solid var(--line);
}
td{padding:9px 5px;border-bottom:1px solid rgba(44,90,61,.35)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(255,182,39,.09)}
tr.me td:first-child{box-shadow:inset 2px 0 0 var(--amber)}
.tname{color:var(--chalk)}
.rk{color:var(--dim-2);width:22px}

/* ---------- team pick ---------- */
.conf-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:9px;margin-bottom:4px;scrollbar-width:none}
.conf-tabs::-webkit-scrollbar{display:none}
.conf-tabs button{
  flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:11px 15px;
  border-radius:5px;cursor:pointer;min-height:44px;
  touch-action:manipulation;-webkit-appearance:none;
}
.conf-tabs button.on{background:var(--amber);color:#20160A;border-color:var(--amber)}
.pick{
  display:flex;align-items:center;gap:12px;padding:13px 12px;min-height:64px;
  touch-action:manipulation;-webkit-appearance:none;
  background:var(--field);border:1px solid var(--line);border-radius:3px;
  margin-bottom:6px;cursor:pointer;width:100%;text-align:left;color:inherit;
  font-family:inherit;font-size:inherit;
}
.pick:active{background:var(--panel)}
.badge{
  /* size always comes from badge(t,px) inline, never from here */
  border-radius:3px;display:grid;place-items:center;
  font-family:var(--disp);letter-spacing:.02em;color:#0B2016;
}
img.badge.logo{background:none;object-fit:contain;border-radius:0}
.pick-n{flex:1;min-width:0}
.pick-n .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-n .s{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.stars{font-family:var(--mono);font-size:11px;color:var(--amber);white-space:nowrap}

/* ---------- archetype picker ---------- */
.archrow{display:flex;flex-direction:column;gap:7px}
.arch{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:12px 13px;min-height:56px;cursor:pointer;text-align:left;
  color:var(--chalk);font-family:inherit;
  touch-action:manipulation;-webkit-appearance:none;
}
.arch.on{border-color:var(--amber);background:rgba(255,182,39,.12)}
.arch .an{font-family:var(--disp);font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.arch.on .an{color:var(--amber)}
.arch .ab{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ---------- store ---------- */
.buy{display:flex;align-items:center;gap:11px;padding:11px 0}
.buy + .buy{border-top:1px solid rgba(44,90,61,.5)}
.buy-i{flex:1;min-width:0}
.buy-i .t{font-weight:600;font-size:14px}
.buy-i .d{font-size:11.5px;color:var(--dim);line-height:1.35;margin-top:1px}
.pips{display:flex;gap:2px;margin-top:5px}
.pip{width:13px;height:5px;border-radius:1px;background:var(--panel-hi)}
.pip.on{background:var(--amber)}
.buy button{
  flex:0 0 auto;font-family:var(--mono);font-size:13px;font-weight:600;
  background:var(--panel-hi);color:var(--chalk);border:1px solid var(--line);
  border-radius:5px;padding:12px 13px;cursor:pointer;min-width:74px;min-height:46px;
  touch-action:manipulation;-webkit-appearance:none;
}
.buy button.can{background:var(--amber);color:#20160A;border-color:var(--amber)}
.buy button:disabled{opacity:.4;cursor:default}

/* ---------- misc ---------- */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--field);border:1px solid var(--line);border-radius:3px;padding:10px 11px}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim-2)}
.stat .v{font-family:var(--disp);font-size:25px;line-height:1.15;margin-top:2px}
.stat .v.amber{color:var(--amber)}
.note{font-size:12.5px;color:var(--dim);line-height:1.5}
.pill{
  display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 6px;border-radius:2px;
  background:var(--panel-hi);color:var(--dim);
}
.pill.w{background:rgba(87,199,122,.17);color:var(--win)}
.pill.l{background:rgba(196,67,42,.17);color:var(--brick)}
.pill.a{background:rgba(255,182,39,.17);color:var(--amber)}
.center{text-align:center}
.spread{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}

/* ---------- schedule editor ---------- */
.ed-list{display:flex;flex-direction:column;gap:6px}
.ed-game{
  display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:4px;
  background:var(--field);border:1px solid var(--line);border-radius:3px;padding:5px;
}
.ed-game.mine{border-color:var(--amber)}
.ed-at{font-family:var(--mono);font-size:10px;color:var(--dim-2);text-align:center}
.ed-team{
  display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;
  column-gap:8px;align-items:center;
  background:none;border:1px solid transparent;border-radius:5px;
  padding:10px 8px;cursor:pointer;color:var(--chalk);text-align:left;font-family:inherit;
  min-width:0;min-height:50px;touch-action:manipulation;
}
.ed-team img,.ed-team .badge{grid-row:1/3}
.ed-n{font-family:var(--disp);font-size:14px;letter-spacing:.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-c{font-family:var(--mono);font-size:10px;color:var(--dim-2);letter-spacing:.06em}
.ed-team:active{background:var(--panel)}
.ed-team.sel{border-color:var(--amber);background:rgba(255,182,39,.12)}
.ed-team.mine .ed-n{color:var(--amber)}
.ed-team:disabled{opacity:.45;cursor:default}

/* ---------- scoreboard ---------- */
.sb{display:flex;flex-direction:column;gap:7px}
.sb-game{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;
  background:var(--field);border:1px solid var(--line);border-radius:5px;
  padding:11px 11px;cursor:pointer;transition:border-color .15s;
  min-height:64px;touch-action:manipulation;
}
.sb-game.done{cursor:default}
.sb-game:not(.done):active{border-color:var(--amber)}
.sb-teams{min-width:0;display:flex;flex-direction:column;gap:3px}
.sb-team{
  display:grid;grid-template-columns:22px 16px 1fr auto 26px;
  align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--dim);
}
.sb-team.win{color:var(--chalk)}
.sb-rk{font-size:10px;color:var(--dim-2);text-align:right}
.sb-ab{font-family:var(--disp);font-size:14px;letter-spacing:.03em;color:inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-rec{font-size:10px;color:var(--dim-2)}
.sb-sc{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sb-team.win .sb-sc{color:var(--amber)}
.sb-status{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.sb-final{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim-2)}
.sb-go{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--amber)}
.sb-nt{font-family:var(--mono);font-size:10px;color:var(--dim-2)}

/* ---------- v1.40 board refresh ---------- */
.wk2 button{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  line-height:1.1;padding:8px 14px;border-radius:9px;
}
.wk2 .wk-t{font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase}
.wk2 .wk-d{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;opacity:.72}
.sb-date{font-family:var(--disp);font-size:18px;letter-spacing:.03em;
  color:var(--chalk);margin:3px 0 0}
.sb-team{grid-template-columns:28px 15px 1fr auto 32px;gap:9px}
.sb-nm{font-size:14px;font-weight:600;color:inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.sb-game{min-height:72px;padding:12px 12px}
.sb-game.has-odds{border-radius:5px 5px 0 0}
.sb-when{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.sb-when.b{color:var(--chalk);font-weight:600}
.sb-net{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim-2)}
.sb-odds{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:rgba(255,255,255,.035);border:1px solid var(--line);border-top:0;
  border-radius:0 0 5px 5px;padding:8px 11px;
  font-family:var(--mono);font-size:10.5px;color:var(--dim);cursor:pointer;
  touch-action:manipulation;
}
.sb-odds.still{border:1px solid var(--line);border-radius:5px;cursor:default}
.sb-odds b{color:var(--chalk);font-weight:600}
.sb-odds .dot{color:var(--dim-2)}
.sb-odds .car{margin-left:auto;color:var(--dim-2)}
.sb-odds-x{
  border:1px solid var(--line);border-top:0;border-radius:0 0 5px 5px;
  margin-top:-4px;padding:7px 11px 8px;
  font-family:var(--mono);font-size:10px;color:var(--dim-2);
  background:rgba(0,0,0,.25);
}
.sb-item:has(.sb-odds-x) .sb-odds{border-radius:0}
.sc-wk i{display:block;font-style:normal;font-size:8.5px;color:var(--dim-2);margin-top:1px}

/* ---------- v1.41 gambler market ---------- */
.mkt{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;
  border:1px solid var(--line);border-top:0;border-radius:0 0 5px 5px;
  padding:7px;background:rgba(255,255,255,.03);
}
.mkt.r0{border-radius:0}
.mkt-c{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:7px 3px;min-height:44px;color:var(--chalk);cursor:pointer;
  font-family:var(--mono);touch-action:manipulation;transition:border-color .12s;
}
.mkt-c .l1{font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.mkt-c .l2{font-size:9.5px;color:var(--dim-2)}
.mkt-c:active{border-color:var(--amber)}
.mkt-c.has{border-color:var(--amber);background:rgba(255,182,39,.10)}
.mkt-c:disabled{opacity:.4;cursor:default}
.mkt-my{
  font-family:var(--mono);font-size:10px;color:var(--amber);
  border:1px solid var(--line);border-top:0;border-radius:0 0 5px 5px;
  padding:6px 11px;background:rgba(255,182,39,.05);
}
.bet-r{display:flex;align-items:center;gap:9px;padding:7px 0}
.bet-r + .bet-r{border-top:1px solid rgba(44,90,61,.4)}
.bet-p{
  flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:700;
  border:1px solid;border-radius:3px;padding:2px 6px;letter-spacing:.06em;
}
.br-d{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.br-d i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim-2);margin-top:1px}
.br-m{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}

/* ---------- v1.46 weekly headlines ---------- */
.news{padding:11px 13px}
.nw{display:flex;align-items:flex-start;gap:10px;padding:9px 0;cursor:pointer}
.nw + .nw{border-top:1px solid rgba(44,90,61,.4)}
.nw.me{margin:0 -13px;padding-left:10px;padding-right:13px;
  border-left:3px solid var(--amber);background:rgba(255,182,39,.05)}
.nw-n{font-family:var(--disp);font-size:19px;color:var(--dim-2);
  width:16px;text-align:center;line-height:1.35;flex:0 0 auto}
.nw-b{flex:1;min-width:0}
.nw-h{font-size:13.5px;font-weight:600;line-height:1.35;color:var(--chalk)}
.nw-d{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.nw-tag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;
  color:var(--brick);border:1px solid var(--brick);border-radius:2px;
  padding:1px 4px;vertical-align:1px}
.nw-tag.my{color:var(--amber);border-color:var(--amber)}
.nw-tag.cb{color:var(--win);border-color:var(--win)}
.art-dek{font-family:var(--mono);font-size:11px;color:var(--dim);margin:5px 0 0;line-height:1.45}
.art-p{font-size:13.5px;line-height:1.6;color:var(--chalk);margin:10px 0 0}
.sc-box .art{margin-bottom:10px}
.sc-box .art .nw-h{font-size:14px}

/* ---------- v1.44 title screen (MainMenu_24.frm) ---------- */
body.splashon header, body.splashon #tabs{display:none}
body.splashon #view{padding:0;overflow:hidden}
.splash{position:absolute;inset:0;cursor:pointer;overflow:hidden;background:#0c1230}
.sp-bg{position:absolute;inset:0;background-size:cover;background-position:center center}
.sp-x{
  position:absolute;top:calc(8px + var(--safe-t,0px));right:14px;
  font-family:'Lucida Console','Courier New',monospace;font-weight:700;
  font-size:24px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);
  padding:6px 10px;z-index:3;
}
.sp-mid{
  position:absolute;left:0;right:0;top:24%;z-index:2;
  text-align:center;padding:0 18px;color:#fff;
}
.sp-title{
  font-family:'Lucida Console','Courier New',monospace;font-weight:700;
  font-size:clamp(26px,7.2vw,54px);line-height:1.12;letter-spacing:.01em;
  text-shadow:0 2px 0 rgba(0,0,0,.55), 0 6px 22px rgba(0,0,0,.65);
}
.sp-rule{
  height:6px;background:#fff;max-width:min(78vw,560px);margin:14px auto 12px;
  box-shadow:0 2px 10px rgba(0,0,0,.5);
}
.sp-author{
  font-family:'Lucida Console','Courier New',monospace;font-weight:400;
  font-size:clamp(12px,3.2vw,17px);color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.8);
}
.sp-continue{
  position:absolute;left:0;right:0;bottom:calc(26px + var(--safe-b,0px));
  text-align:center;z-index:2;
  font-family:'Lucida Console','Courier New',monospace;font-weight:700;
  font-size:clamp(13px,3.6vw,17px);color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.85);
}
/* Timer2: 750ms visible, 750ms hidden — a hard toggle, not a fade */
@keyframes vb-blink{0%,49.99%{opacity:1}50%,100%{opacity:0}}
.sp-blink{animation:vb-blink 1.5s steps(1,end) infinite}
@media(min-width:700px){
  .sp-mid{top:26%}
  .sp-title{font-size:clamp(40px,5.4vw,64px)}
}


/* ---------- iPad mini layout ---------- */
body.tablet #app{max-width:none;box-shadow:none}
@media(min-width:700px){
  body.tablet main{padding:20px 28px 30px}
  body.tablet .sb{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  body.tablet .sb-date{grid-column:1/-1}
  body.tablet .wk2 button{padding:10px 16px}
  body.tablet .sb-game{min-height:78px}
}
@media(min-width:1000px){
  body.tablet .sb{grid-template-columns:1fr 1fr 1fr}
  body.tablet main{padding:22px 36px 34px}
}

/* ---------- trophy case ---------- */
.case{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.tr-slot{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--field);border:1px solid var(--line);border-radius:3px;padding:11px 7px 9px;
}
.tr-img{width:44px;height:44px;object-fit:contain;
  filter:drop-shadow(0 0 9px rgba(255,182,39,.28))}
.tr-x{position:absolute;top:5px;right:7px;font-family:var(--mono);font-size:10px;
  font-weight:600;color:var(--amber)}
.tr-name{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--chalk);text-align:center;line-height:1.25}
.tr-yrs{font-family:var(--mono);font-size:10px;color:var(--dim-2);text-align:center;line-height:1.3}

/* ---------- offseason report ---------- */
.off-row{padding:7px 0}
.off-row + .off-row{border-top:1px solid rgba(44,90,61,.4)}
.off-top{display:flex;justify-content:space-between;align-items:baseline;gap:9px}
.off-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.off-rat{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
.off-why{font-family:var(--mono);font-size:10px;color:var(--dim-2);margin-top:2px}
.off-row.improved .off-name{color:var(--win)}
.off-row.declined .off-name{color:var(--brick)}

/* ---------- job security meter ---------- */
.meter{height:6px;border-radius:3px;background:var(--panel-hi);overflow:hidden;margin-top:9px}
.meter-fill{height:100%;border-radius:3px;transition:width .3s}

/* ---------- playoff bracket ---------- */
.bk-round{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bk-round.final{grid-template-columns:1fr;max-width:260px;margin:0 auto}
.bk-game{
  background:var(--field);border:1px solid var(--line);border-radius:3px;
  overflow:hidden;position:relative;
}
.bk-game::after{
  content:'';position:absolute;left:9px;right:9px;top:50%;height:1px;
  background:var(--line);
}
.bk-team{
  display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:7px;
  width:100%;padding:12px 10px;background:none;border:0;color:var(--dim);
  font-family:var(--mono);font-size:12.5px;cursor:pointer;text-align:left;
  min-height:46px;touch-action:manipulation;-webkit-appearance:none;
}
.bk-team .sd{font-size:10px;color:var(--dim-2);text-align:center}
.bk-team .ab{font-family:var(--disp);font-size:14px;letter-spacing:.03em;
  color:inherit;overflow:hidden;text-overflow:ellipsis}
.bk-team .sc{font-weight:600;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.bk-team.win{color:var(--chalk)}
.bk-team.win .sc{color:var(--amber)}
.bk-team.mine{box-shadow:inset 2px 0 0 var(--amber)}
.bk-byes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bk-byes .bk-team{background:var(--panel);border-radius:2px;grid-template-columns:20px 1fr}

/* version stamp */
.verline{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--dim-2);text-align:center;margin:18px 0 4px;text-transform:uppercase;
}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%);
  background:var(--amber);color:#20160A;font-family:var(--mono);font-size:12px;font-weight:600;
  padding:10px 15px;border-radius:3px;z-index:60;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* install hint */
#installTip{
  position:fixed;left:12px;right:12px;bottom:calc(74px + var(--safe-b));z-index:40;
  display:none;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 13px;font-size:13px;color:var(--dim);line-height:1.35;
}
#installTip.show{display:flex}
#installTip button{
  flex:0 0 auto;background:var(--amber);color:#20160A;border:0;border-radius:5px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  padding:10px 12px;min-height:40px;cursor:pointer;touch-action:manipulation;
}

/* modal */
#modal{
  position:fixed;inset:0;background:rgba(4,12,8,.86);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
#modal.show{display:flex}
.sheet{
  background:var(--field);border-top:2px solid var(--amber);
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  padding:18px 16px calc(18px + var(--safe-b));border-radius:6px 6px 0 0;
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(26px)}to{transform:none}}
.sheet h3{font-family:var(--disp);font-size:21px;letter-spacing:.03em;
  text-transform:uppercase;margin:0 0 4px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:600px){
  main{padding:18px 20px 26px}
  #app{max-width:640px;margin:0 auto;
    box-shadow:0 0 60px rgba(0,0,0,.5)}
}
</style>

<div id="app">

        <span class="lbl">Budget</span><span class="amt" id="hMoneyAmt"></span></button>
    </div>
    <div class="hdr-sub" id="hSub"></div>

</div>

</div>

<script>
const TEAM_DATA=[
["Air Force","AF",11,3,3,1,"MWC"],

              stackCal:true, stiffKnock:true, possTrim:true, confSwap:true, randomNC:false,

/* ============================================================
   SCHEDULE
   ============================================================ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Randomised non-conference slate. Top 50 by poll get home games up to
   two, otherwise home/away balances out. Never pairs same-conference
   teams. Returns null if it can't complete, so we can fall back. */
function randomNonConf(){
  const T=S.teams, N=T.length;
  const ranked=T.map(t=>t.id).sort((a,b)=>T[b].poll-T[a].poll);
  const elite=new Set(ranked.slice(0,50));
  const homeG=new Array(N).fill(0), awayG=new Array(N).fill(0);
  const out=[];
  for(let w=0;w<4;w++){
    const used=new Set(); const pairs=[];
    let tries=0;
    while(pairs.length<68 && tries<20000){
      const a=rnd(N), b=rnd(N); tries++;
      if(a===b||T[a].conf===T[b].conf||used.has(a)||used.has(b))continue;
      pairs.push([a,b]); used.add(a); used.add(b);
    }
    if(pairs.length<68){
      // repair: pair whatever is left across conferences
      const left=[]; for(let i=0;i<N;i++) if(!used.has(i)) left.push(i);
      for(let i=0;i<left.length;i++){
        if(used.has(left[i]))continue;
        for(let j=i+1;j<left.length;j++){
          if(used.has(left[j])||T[left[i]].conf===T[left[j]].conf)continue;
          pairs.push([left[i],left[j]]); used.add(left[i]); used.add(left[j]); break;
        }
      }
    }
    if(pairs.length<68) return null;
    pairs.forEach(([a,b])=>{
      let home,away;
      if(elite.has(a)&&homeG[a]<2){home=a;away=b;}
      else if(elite.has(b)&&homeG[b]<2){home=b;away=a;}
      else if(homeG[a]<awayG[a]){home=a;away=b;}
      else if(homeG[b]<awayG[b]){home=b;away=a;}
      else if(Math.random()<0.5){home=a;away=b;}
      else {home=b;away=a;}
      out.push(away,home); homeG[home]++; awayG[away]++;
    });
  }
  return out;
}

function buildSchedule(){
  const T=S.teams;
  T.forEach(t=>{t.sched=new Array(FINAL_WEEK+1).fill(null);});
  const rot=(S.schedRotate||0)&1;          // alternates 1,2,1,2 like schedulerotate
  let nc=SCHED.nc[rot];
  if(S.settings.randomNC){ const r=randomNonConf(); if(r) nc=r; }
  const cf=SCHED.cf[rot];
  const place=(w,aid,hid)=>{
    T[aid].sched[w]={opp:hid,home:false,neutral:false,played:false};
    T[hid].sched[w]={opp:aid,home:true, neutral:false,played:false};
  };
  // weeks 1-4 non-conference
  for(let w=1;w<=4;w++)
    for(let i=0;i<68;i++){
      const k=((w-1)*68+i)*2;
      place(w, nc[k], nc[k+1]);
    }
  // weeks 5-12 conference
  for(let w=5;w<=REG_WEEKS;w++)
    for(let i=0;i<68;i++){
      const k=((w-5)*68+i)*2;
      place(w, cf[k], cf[k+1]);
    }
}

/* ============================================================
   NON-CONFERENCE SCHEDULE EDITOR
   Weeks 1-4 only. Swapping two teams preserves the perfect
   matching by construction; the two extra safeguards are that
   no game becomes intra-conference and no team is left without
   a home game in the non-conference stretch.
   ============================================================ */
/* Schedule fees. A program at 12/3/3 or worse still gets to move things
   around for free — the same threshold that decides who counts as the
   little guy for guarantee games. Above it, the athletic department
   charges, and the price follows inflation like everything else. */
const SCHED_FEE = 10, HOME_FEE = 15;
function paysScheduleFees(){
  return S.me>=0 && !isCupcakeVisitor(S.teams[S.me]);
}
function scheduleFee(gainedHome){
  if(!paysScheduleFees()) return 0;
  return priced(gainedHome ? HOME_FEE : SCHED_FEE);
}

function ncWeekPlayed(w){ return S.teams.some(t=>t.sched[w]&&t.sched[w].played); }
function ncHomeCount(t){
  let n=0; for(let w=1;w<=4;w++) if(t.sched[w]&&t.sched[w].home) n++;
  return n;
}
function validateNC(){
  const bad=[];
  for(let w=1;w<=4;w++){
    S.teams.forEach(t=>{
      const g=t.sched[w]; if(!g) return;
      const o=S.teams[g.opp];
      if(o.sched[w]?.opp!==t.id) bad.push(`Week ${w}: ${t.ab} pairing is broken`);
      if(t.id<g.opp && o.conf===t.conf)
        bad.push(`Week ${w}: ${t.ab} and ${o.ab} are both ${t.conf}`);
    });
  }
  S.teams.forEach(t=>{
    if(ncHomeCount(t)===0) bad.push(`${t.name} has no home game in weeks 1-4`);
    // nobody should meet the same opponent twice out of conference
    const seen=new Set();
    for(let w=1;w<=4;w++){
      const g=t.sched[w]; if(!g) continue;
      if(seen.has(g.opp)) bad.push(`${t.name} would play ${S.teams[g.opp].name} twice`);
      seen.add(g.opp);
    }
  });
  return bad;
}
function snapshotNC(){
  return S.teams.map(t=>[1,2,3,4].map(w=>t.sched[w]?{...t.sched[w]}:null));
}
function restoreNC(snap){
  S.teams.forEach((t,i)=>{ [1,2,3,4].forEach((w,j)=>{ t.sched[w]=snap[i][j]; }); });
}

/* exchange two teams between their week-w games, keeping home/away slots */
function ncSwap(w,x,y){
  const T=S.teams;
  if(x===y) return {ok:false,why:'Pick two different teams.'};
  const gx=T[x].sched[w], gy=T[y].sched[w];
  if(!gx||!gy) return {ok:false,why:'One of them has no game that week.'};
  if(gx.played||gy.played) return {ok:false,why:'That week has already been played.'};

  const snap=snapshotNC();
  if(gx.opp===y){
    // same game — this just flips who hosts
    gx.home=!gx.home; gy.home=!gy.home;
  }else{
    const ox=gx.opp, oy=gy.opp, xh=gx.home, yh=gy.home;
    T[x].sched[w] ={opp:oy, home:yh,  neutral:false, played:false};
    T[oy].sched[w]={opp:x,  home:!yh, neutral:false, played:false};
    T[y].sched[w] ={opp:ox, home:xh,  neutral:false, played:false};
    T[ox].sched[w]={opp:y,  home:!xh, neutral:false, played:false};
  }
  const issues=validateNC();
  if(issues.length){ restoreNC(snap); return {ok:false,why:issues[0]}; }
  return {ok:true};
}

/* put weeks 1-4 back to the master file (or a fresh random slate) */
function ncReset(){
  for(let w=1;w<=4;w++) if(ncWeekPlayed(w)) return {ok:false,why:'Some of those weeks have been played.'};
  const rot=(S.schedRotate||0)&1;
  let nc=SCHED.nc[rot];
  if(S.settings.randomNC){ const r=randomNonConf(); if(r) nc=r; }
  for(let w=1;w<=4;w++)
    for(let i=0;i<68;i++){
      const k=((w-1)*68+i)*2, a=nc[k], h=nc[k+1];
      S.teams[a].sched[w]={opp:h,home:false,neutral:false,played:false};
      S.teams[h].sched[w]={opp:a,home:true, neutral:false,played:false};
    }
  return {ok:true};
}

/* ============================================================
   GUARANTEE GAMES
   Weeks 1-4 only: a small program visiting a big one gets paid.
   Source gate — visitor 12/3/3 or worse, host 13/5/5 or better.
   ============================================================ */
const CUPCAKE_FEE = 10;
function isCupcakeVisitor(t){
  // the usual gate, plus any offense stuck on caliber 1 with a modest defense
  return (t.rolls<=12 && t.cal<=3 && t.def<=3) || (t.cal<=1 && t.def<=4);
}
function isCupcakeHost(t){ return t.rolls>=13 && t.cal>=5 && t.def>=5; }

function cupcakeCount(){
  if(S.me<0) return 0;
  const me=S.teams[S.me];
  let n=0;
  for(let w=1;w<=4;w++){
    const g=me.sched[w];
    if(g && !g.home && isCupcakeHost(S.teams[g.opp])) n++;
  }
  return n;
}

/* every big-program road trip we could legally arrange, by week */
function cupcakeOptions(){
  if(S.me<0) return [];
  const me=S.teams[S.me], out=[];
  for(let w=1;w<=4;w++){
    if(ncWeekPlayed(w)) continue;
    const cur=me.sched[w]; if(!cur) continue;
    if(!cur.home && isCupcakeHost(S.teams[cur.opp])) continue;   // already one
    S.teams.forEach(x=>{
      if(x.id===S.me || x.conf===me.conf) return;
      if(!isCupcakeHost(x)) return;
      const xg=x.sched[w]; if(!xg || xg.played) return;
      if(xg.opp===S.me) return;
      const snap=snapshotNC();
      const ok=tryCupcake(w, x.id);
      restoreNC(snap);
      if(ok) out.push({week:w, id:x.id, fee:CUPCAKE_FEE});
    });
  }
  return out;
}

/* put the user on the road at team x in week w; caller restores on failure */
function tryCupcake(w, x){
  const me=S.teams[S.me];
  if(me.sched[w].home){                       // we need to be the visitor
    const r=ncSwap(w, S.me, me.sched[w].opp);
    if(!r.ok) return false;
  }
  if(me.sched[w].opp===x) return true;
  const r2=ncSwap(w, me.sched[w].opp, x);
  return !!r2.ok;
}

/* hosting a big program pays nothing — but flipping the venue fixes that */
function canFlipForPay(w){
  if(S.me<0) return false;
  const g=S.teams[S.me].sched[w];
  if(!g || g.played || !g.home) return false;
  return isCupcakeHost(S.teams[g.opp]);
}
function flipForPay(w){
  if(cupcakeCount()>=2) return {ok:false,why:'You can only take two of these a year.'};
  if(!canFlipForPay(w)) return {ok:false,why:"That one can't be flipped."};
  const g=S.teams[S.me].sched[w];
  const r=ncSwap(w, S.me, g.opp);
  return r.ok ? {ok:true, host:S.teams[g.opp].name} : {ok:false, why:r.why};
}

function bookCupcake(w, x){
  if(cupcakeCount()>=2) return {ok:false,why:'You can only take two of these a year.'};
  const cur=S.teams[S.me].sched[w];
  if(cur && !cur.home && isCupcakeHost(S.teams[cur.opp]))
    return {ok:false,why:'You already have a guarantee game that week.'};
  const snap=snapshotNC();
  if(!tryCupcake(w,x)){ restoreNC(snap); return {ok:false,why:"That one won't fit the schedule."}; }
  return {ok:true};
}

/* ============================================================
   MATCHUP PREP  (unified competitive adjustments from VB6)
   ============================================================ */
function prepGame(aid,hid,opt={}){
  const A=S.teams[aid], H=S.teams[hid];
  const neutral = !!opt.neutral;
  const notes=[];

  let aOC=A.cal, hOC=H.cal;
  let aO=A.rolls, hO=H.rolls;
  let aD=A.def,  hD=H.def;
  const HFA=H.hfa;

  // per-side rating deltas, so the board can show what moved and why
  const mods={a:{rolls:0,cal:0,def:0}, h:{rolls:0,cal:0,def:0}};

  // one-game pep talk boosts, user team only
  const pep=S.pepOn;
  const boost=(t,side)=>{
    if(!t.user) return;


    // possessions: a straight lift, never past the ceiling
    if(pep.roll){
      const cur = side==='a'?aO:hO;
      if(cur<MAX_ROLL){ if(side==='a')aO++; else hO++; mods[side].rolls++;
        notes.push(`${t.ab} +1 roll (pep talk)`); }
    }

    // defence: a pep talk either covers the injury or lifts you, never both
    if(S.tempDef>0){
      if(pep.def){ notes.push(`${t.ab} defense injury covered (pep talk)`); }
      else {
        const cur = side==='a'?aD:hD;
        if(cur>0){ if(side==='a')aD--; else hD--; mods[side].def--;
          notes.push(`${t.ab} -1 defense (injury)`); }
      }
    }else if(pep.def){
      const cur = side==='a'?aD:hD;
      if(cur<MAX_DEF){ if(side==='a')aD++; else hD++; mods[side].def++;
        notes.push(`${t.ab} +1 defense (pep talk)`); }
    }

    // caliber only lifts when healthy — an injury is covered further down,
    // where the injury itself is applied
    if(pep.cal && S.tempCal<=0){
      if(side==='a'&&aOC<MAX_CAL){aOC++;mods.a.cal++;notes.push(`${t.ab} +1 caliber (pep talk)`);}
      else if(side==='h'&&hOC<MAX_CAL){hOC++;mods.h.cal++;notes.push(`${t.ab} +1 caliber (pep talk)`);}
    }
  };
  boost(A,'a'); boost(H,'h');

  // the opponent's own preparation, if they found something this week
  if(S.oppPep && (A.user||H.user)){
    const op=S.oppPep;
    const side = (A.id===op.team) ? 'a' : (H.id===op.team) ? 'h' : null;
    if(side && !S.teams[op.team].user){
      const t=S.teams[op.team];
      if(op.stat==='rolls'){ if(side==='a')aO++; else hO++; mods[side].rolls++;
        notes.push(`${t.ab} +1 roll (their pep talk)`); }
      else if(op.stat==='def'){ if(side==='a')aD++; else hD++; mods[side].def++;
        notes.push(`${t.ab} +1 defense (their pep talk)`); }
      else if(op.stat==='cal'){
        if(side==='a'&&aOC<6){aOC++;mods.a.cal++;notes.push(`${t.ab} +1 caliber (their pep talk)`);}
        else if(side==='h'&&hOC<6){hOC++;mods.h.cal++;notes.push(`${t.ab} +1 caliber (their pep talk)`);}
      }
    }
  }


  // caliber adjustments. Original stacks these: 1v1 becomes 2v2 then 5v5.
  if(S.settings.stackCal!==false){
    if(aOC+hOC<6){aOC++;hOC++;notes.push('Both +1 caliber (combined cal. under 6)');}
    if(aOC+hOC<5){aOC+=3;hOC+=3;notes.push('Both +3 caliber (combined cal. under 5)');}
  }else{
    // The under-5 bump only ever fires after the under-6 bump has already
    // run (it needs a starting sum of 2, i.e. caliber 1 vs 1). Making them
    // exclusive changes that one matchup and leaves every other identical.
    let bumped=false;
    if(aOC+hOC<6){aOC++;hOC++;bumped=true;notes.push('Both +1 caliber (combined cal. under 6)');}
    if(!bumped&&aOC+hOC<5){aOC+=3;hOC+=3;notes.push('Both +3 caliber (combined cal. under 5)');}
  }
  // the grid only defines 1-6 and the +3 bump can overshoot it,
  // so pin the value before the 6v6 knockdown is tested
  if(aOC>6){aOC=6;} if(hOC>6){hOC=6;}

  // knockdown. Original only fires at exactly 6 and 6; the biting version
  // catches any combined caliber of 11 or more, so 6 v 5 is trimmed too.
  const knock = S.settings.stiffKnock!==false ? (aOC+hOC>=11) : (aOC===6&&hOC===6);
  if(knock){aOC--;hOC--;notes.push('Both -1 caliber (competitive adj.)');}
  if(aOC===3&&hOC===3){aOC++;hOC++;notes.push('Both +1 caliber (even matchup bonus)');}

  // caliber injury comes off the effective number, as in the source
  if(S.tempCal>0){
    const hurt=(t,side)=>{
      if(!t.user) return;
      if(pep.cal){ notes.push(`${t.ab} caliber injury covered (pep talk)`); return; }
      const cur = side==='a'?aOC:hOC;
      if(cur>1){ if(side==='a')aOC--; else hOC--; mods[side].cal--;
        notes.push(`${t.ab} -1 caliber (injury)`); }
    };
    hurt(A,'a'); hurt(H,'h');
  }

  // possessions
  let aRem=aO-hD;
  let hRem=hO-aD+(neutral?0:HFA);
  if(aRem>=8&&hRem>=8){aRem--;hRem--;notes.push('Both -1 possession (competitive adj.)');}
  if(aRem<6||hRem<6){
    aO++;hO++;
    aRem=aO-hD; hRem=hO-aD+(neutral?0:HFA);
    notes.push('Both +1 possession (a team was under 6)');
  }
  // downward mirror of the rule above: trim when either side runs away with
  // the possession count. Nothing in the original pulls possessions back.
  if(S.settings.possTrim!==false && (aRem>9||hRem>9)){
    aRem--;hRem--;
    notes.push('Both -1 possession (a team was over 9)');
  }
  // Floor. Whatever the worse-off side is short, both sides get, so the
  // gap between them is preserved.
  const short = POSS_FLOOR - Math.min(aRem,hRem);
  if(short>0){
    aRem+=short; hRem+=short;
    notes.push(`Both +${short} possession${short>1?'s':''} (nobody plays under ${POSS_FLOOR})`);
    if(FLOOR_CAL){
      if(aOC<MAX_CAL) aOC++;
      if(hOC<MAX_CAL) hOC++;
      notes.push('Both +1 caliber (short game)');
    }
  }
  aRem=Math.max(1,aRem); hRem=Math.max(1,hRem);

  // Spread. The source's coefficients: 3.5 points per possession of edge,
  // 7 per point of caliber. Written as one expression it reproduces every
  // branch the source defines, covers the three combinations it leaves at
  // zero, and drops the forced sign flip that made a better home team read
  // as the underdog. Negative favours away, positive favours home.
  const sp = (hRem - aRem) * 3.5 + (hOC - aOC) * 7;

  // The coach's opening-drive specialty. Which form it takes depends on
  // whether there is headroom left on the dial.
  let perk=null;
  const archK = S.coach && S.coach.archetype;
  const archDef = ARCHETYPES[archK] || {};
  const uSide = A.user ? 'a' : (H.user ? 'h' : null);
  // a CEO leans on one coordinator or the other, and not every week
  let perkKind = archDef.perk;
  if(perkKind==='ceo'){
    perkKind = (Math.random() < (archDef.perkChance||1))
      ? (Math.random()<0.5 ? 'guru' : 'mind')
      : null;
  }else if(perkKind && archDef.perkChance!=null &&
           Math.random() >= archDef.perkChance){
    perkKind = null;
  }
  if(uSide && perkKind==='guru'){
    const myCal = uSide==='a' ? aOC : hOC;
    perk = {who:uSide, used:false,
            kind: myCal<MAX_CAL ? 'calUp' : 'reroll'};
  }else if(uSide && perkKind==='mind'){
    const oSide = uSide==='a' ? 'h' : 'a';
    const oppCal = oSide==='a' ? aOC : hOC;
    perk = {who:oSide, used:false,
            kind: oppCal>1 ? 'calDown' : 'overturn'};
  }
  if(perk) notes.push({calUp:'You script the opening drive (+1 caliber, first roll)',
    reroll:'Offense already maxed — you get one more crack at your first empty drive',
    calDown:'You game-plan their opener (-1 caliber, their first roll)',
    overturn:'Their offense is already bottomed out — their first touchdown goes to replay'}[perk.kind]);

  const useQ = S.settings.quarters!==false;
  const aQ = useQ ? quarterSplit(aRem) : [aRem];
  const hQ = useQ ? quarterSplit(hRem) : [hRem];

  return {
    aid,hid,neutral,week:opt.week||S.week,
    aOC,hOC,aRem,hRem,
    aRemMax:aRem,hRemMax:hRem,
    aScore:0,hScore:0,
    aDef:aD, hDef:hD, mods,
    quarters:useQ,
    aQ,hQ, period:0, aLeft:aQ[0], hLeft:hQ[0],
    aQpts:aQ.map(()=>0), hQpts:hQ.map(()=>0),
    spread:sp, notes, plays:[], over:false, ot:0, perk
  };
}

/* Split possessions across four quarters. Base is floor(n/4); the
   remainder goes to Q4, then Q2, then Q1 — extras land at the ends of
   halves, and no quarter is ever left empty. */
function quarterSplit(n){
  const b=Math.floor(n/4), r=n%4, q=[b,b,b,b];
  const order=[3,1,0];
  for(let i=0;i<r;i++) q[order[i]]++;
  return q;
}
const PERIODS=['1st','2nd','3rd','4th'];
function periodName(i){ return i<4?PERIODS[i] : (i===4?'OT':(i-3)+'OT'); }
function otLabel(n){ return n<=0?'' : n===1?'OT' : n+'OT'; }

/* Box lines keep one OT column; the label says how many were played. */
function collapseQ(arr){
  if(arr.length<=4) return arr.slice();
  return [...arr.slice(0,4), arr.slice(4).reduce((a,b)=>a+b,0)];
}

/* effective caliber, with the mercy throttle from the source */
let THROTTLE_MARGIN = 35, THROTTLE_SCORE = 59;
function effCal(g,side){
  const mine = side==='a'?g.aScore:g.hScore;
  const theirs= side==='a'?g.hScore:g.aScore;
  let c = side==='a'?g.aOC:g.hOC;
  if((mine-theirs)>THROTTLE_MARGIN && mine>THROTTLE_SCORE) c=1;
  return clamp(c,1,6);
}

function possession(g,side){
  const otNum = g.period>=4 ? g.period-3 : 0;   // 1 = first overtime
  let c=effCal(g,side);
  const pk=g.perk;
  let note=null, conv=null, redo=null;

  // caliber-shifting perks land before the dice
  if(pk && !pk.used && pk.who===side){
    if(pk.kind==='calUp' && c<MAX_CAL){ c++; pk.used=true; note='opening script'; }
    else if(pk.kind==='calDown' && c>1){ c--; pk.used=true; note='defensive game plan'; }
  }

  let d1=d6(), d2=d6(), sum=d1+d2;
  let pts=GRID[c][sum];

  // the reroll perks trigger on what the drive produced
  if(pk && !pk.used && pk.who===side){
    if(pk.kind==='reroll' && pts===0){
      pk.used=true; redo={d1,d2,sum};
      d1=d6(); d2=d6(); sum=d1+d2; pts=GRID[c][sum];
      note='second chance';
    }else if(pk.kind==='overturn' && pts===7){
      pk.used=true; redo={d1,d2,sum};
      d1=d6(); d2=d6(); sum=d1+d2; pts=GRID[c][sum];
      note='replay overturn';
    }
  }

  if(otNum>0){
    const mine   = side==='a'?g.aScore:g.hScore;
    const theirs = side==='a'?g.hScore:g.aScore;
    // has the other team already had its possession this period?
    const secondUp = g.plays.some(p=>p.period===g.period && p.side!==side && !p.conv);

    if(otNum>=3){
      // third overtime on: alternating two-point tries, nothing else
      pts = pts>0 ? 2 : 0;
      note = pts ? 'two-point try good' : 'two-point try no good';
    }else{
      // down by more than a field goal with the ball second: you go for it
      if(pts===3 && secondUp && (theirs-mine)>3){
        pts=0; note='went for the touchdown, no good';
      }
      if(otNum===2 && pts===7){
        // second overtime forces the two-point attempt
        pts=6;
        const cd1=d6(), cd2=d6(), cs=cd1+cd2;
        const cpts=GRID[c][cs];
        const good = cpts>=3;
        if(good) pts=8;
        conv={d1:cd1,d2:cd2,sum:cs,good};
        note = good ? 'touchdown, two-point good' : 'touchdown, two-point failed';
      }
    }
  }

  /* v1.45 — down 8, last roll of the game, touchdown: go for two.
     The conversion is a second roll and must come up a 3 or a 7
     (8-in-36). Make it and the game is tied; miss and lose by 2.
     In a manual-roll live game the second roll waits for the tap. */
  let await2=false;
  if(otNum===0 && pts===7){
    const mine2   = side==='a'?g.aScore:g.hScore;
    const theirs2 = side==='a'?g.hScore:g.aScore;
    const lastRoll = side==='a' ? (g.aRem===1 && g.hRem<=0)
                                : (g.hRem===1 && g.aRem<=0);
    if(lastRoll && theirs2-mine2===8){
      pts=6;
      const manualLive = (typeof LIVE!=='undefined') && LIVE && LIVE.g===g && !LIVE.running;
      if(manualLive){
        await2=true;
        note='touchdown — going for two';
      }else{
        const cd1=d6(), cd2=d6(), cs=cd1+cd2;
        const good = cs===3||cs===7;
        if(good) pts=8;
        conv={d1:cd1,d2:cd2,sum:cs,good};
        note = good ? 'touchdown, two-point good — tied' : 'touchdown, two-point no good';
      }
    }
  }

  if(side==='a'){ g.aScore+=pts; g.aRem--; g.aLeft--; g.aQpts[g.period]+=pts; }
  else          { g.hScore+=pts; g.hRem--; g.hLeft--; g.hQpts[g.period]+=pts; }

  const t = S.teams[side==='a'?g.aid:g.hid];
  g.plays.push({side,d1,d2,sum,pts,cal:c,ab:t.ab,period:g.period,ot:otNum,
                note,conv,redo,a:g.aScore,h:g.hScore,odds:ROLL_ODDS[sum]});
  if(await2) g.pending2={side, cal:c};
  return g.plays[g.plays.length-1];
}

/* move to the next quarter, or into overtime, or end the game */
function advancePeriod(g){
  if(g.period < g.aQ.length-1){
    g.period++;
    g.aLeft=g.aQ[g.period]; g.hLeft=g.hQ[g.period];
    return true;
  }
  if(g.aScore===g.hScore){          // tied after the last period
    g.aQ.push(1); g.hQ.push(1);
    g.aQpts.push(0); g.hQpts.push(0);
    g.period++; g.aLeft=1; g.hLeft=1;
    g.aRem++; g.hRem++; g.ot++;
    return true;
  }
  g.over=true;
  return false;
}

/* v1.45 — resolve a held two-point try (works for live and autoPlay) */
function resolve2pt(g){
  const p2=g.pending2; if(!p2) return null;
  const play=g.plays[g.plays.length-1];
  const cd1=d6(), cd2=d6(), cs=cd1+cd2;
  const good = cs===3||cs===7;
  play.conv={d1:cd1,d2:cd2,sum:cs,good};
  if(good){
    play.pts=8;
    if(p2.side==='a'){ g.aScore+=2; g.aQpts[play.period]+=2; }
    else             { g.hScore+=2; g.hQpts[play.period]+=2; }
  }
  play.a=g.aScore; play.h=g.hScore;
  play.note = good ? 'touchdown, two-point good — tied' : 'touchdown, two-point no good';
  g.pending2=null;
  return play;
}

function nextSide(g){
  if(g.over) return null;
  if(g.pending2) return g.pending2.side;
  let guard=0;
  while(g.aLeft<=0 && g.hLeft<=0 && guard++<40){
    if(!advancePeriod(g)) return null;
  }
  if(g.aLeft>0 && g.hLeft>0){
    // away opens the first half, home the second; overtimes alternate
    const starter = g.period<2 ? 'a'
                  : g.period<4 ? 'h'
                  : (((g.period-3)%2===1) ? 'a' : 'h');
    const used = (g.aQ[g.period]-g.aLeft)+(g.hQ[g.period]-g.hLeft);
    return used%2===0 ? starter : (starter==='a'?'h':'a');
  }
  return g.aLeft>0 ? 'a' : 'h';
}

function autoPlay(g){
  let guard=0;
  while(!g.over && guard++<400){
    if(g.pending2){ resolve2pt(g); continue; }
    const s=nextSide(g);
    if(!s) break;
    possession(g,s);
  }
  g.over=true;
  return g;
}

/* A pep talk is only worth spending if it improves your standing
   relative to the opponent once every adjustment has been applied.
   prepGame is deterministic, so we can simply try it both ways. */
function pepHelps(kind, m){
  if(S.me<0 || !m) return false;
  const saved={...S.pepOn};
  const side = (m.aid===S.me) ? 'a' : 'h';
  const edge = g => {
    const mine   = side==='a' ? g.aOC  : g.hOC;
    const theirs = side==='a' ? g.hOC  : g.aOC;
    const myP    = side==='a' ? g.aRem : g.hRem;
    const theirP = side==='a' ? g.hRem : g.aRem;
    return {cal: mine-theirs, poss: myP-theirP};
  };
  S.pepOn={cal:false,roll:false,def:false};
  const off = edge(prepGame(m.aid,m.hid,{neutral:m.neutral,week:S.week}));
  S.pepOn={cal:false,roll:false,def:false}; S.pepOn[kind]=true;
  const on  = edge(prepGame(m.aid,m.hid,{neutral:m.neutral,week:S.week}));
  S.pepOn=saved;
  return on.cal>off.cal || on.poss>off.poss;
}

/* ============================================================
   WEEKLY RANDOM EVENTS  (ApplyWeeklyRandomEvents)
   Two dice a week. Snake eyes is a permanent hit, 11 and 12 are
   temporary injuries. Your first two seasons are protected.
   ============================================================ */
/* The other side prepares too. Rolled once when the week turns so the
   pre-game card and the game itself agree, and it never changes on a
   re-render. Odds rise with the stakes. */
function oppPepChance(wk){
  if(wk>=14) return 0.75;          // playoff
  if(wk===CCG_WEEK) return 0.50;   // conference championship
  return 0.25;                     // regular season
}
function rollOpponentPep(){
  S.oppPep=null;
  if(S.me<0) return;
  const m=userGameThisWeek(); if(!m) return;
  const oppId = (m.aid===S.me) ? m.hid : m.aid;
  const o=S.teams[oppId];
  if(Math.random() >= oppPepChance(S.week)) return;
  const opts=[];
  if(o.rolls<MAX_ROLL) opts.push('rolls');
  if(o.cal<MAX_CAL)   opts.push('cal');
  if(o.def<MAX_DEF)   opts.push('def');
  if(!opts.length) return;          // nothing left to boost
  S.oppPep={team:oppId, stat:opts[rnd(opts.length)]};
}

function applyWeeklyRandomEvents(){
  if(S.me<0) return null;
  if(S.eliminated) return null;        // nothing left to play for
  if(S.tempCal>0) S.tempCal--;
  if(S.tempDef>0) S.tempDef--;
  if((S.coach.seasons||0) < 2) return null;      // seasons 1 and 2 are safe

  const total=d6()+d6();
  const t=S.teams[S.me];

  if(total===2){
    // permanent: try a random stat, then fall through to the others
    const start=rnd(3);
    for(let alt=0;alt<3;alt++){
      const pick=(start+alt)%3;
      if(pick===0 && t.rolls>10){ t.rolls--;
        return {kind:'perm', stat:'possessions',
                msg:'Major discipline incident — permanent -1 possession'}; }
      if(pick===1 && t.def>0){ t.def--;
        return {kind:'perm', stat:'defense',
                msg:'Major discipline incident — permanent -1 defense'}; }
      if(pick===2 && t.cal>1){ t.cal--;
        return {kind:'perm', stat:'caliber',
                msg:'Major discipline incident — permanent -1 caliber'}; }
    }
    return null;
  }
  if(total===11){
    const dur=rnd(6)+1;
    if(S.tempCal<dur) S.tempCal=dur;
    return {kind:'temp', stat:'caliber', weeks:S.tempCal,
            msg:`Star receiver hurt — -1 caliber for ${S.tempCal} week${S.tempCal>1?'s':''}`};
  }
  if(total===12){
    const dur=rnd(6)+1;
    if(S.tempDef<dur) S.tempDef=dur;
    return {kind:'temp', stat:'defense', weeks:S.tempDef,
            msg:`Star linebacker hurt — -1 defense for ${S.tempDef} week${S.tempDef>1?'s':''}`};
  }
  return null;
}

/* ============================================================
   RECORD BOOK
   Longest winning runs anywhere in the league, yours or not.
   Only runs of eight or more are worth recording.
   ============================================================ */
const STREAK_FLOOR = 8;
function noteStreak(t){
  if((t.streak||0) < STREAK_FLOOR) return;
  if(!S.records) S.records={streaks:[]};
  const list=S.records.streaks;
  const key=t.name+'|'+t.streakStart;
  const entry={key, name:t.name, ab:t.ab, len:t.streak,
               from:t.streakStart, to:S.year, user:!!t.user};
  const i=list.findIndex(x=>x.key===key);
  if(i>=0) list[i]=entry; else list.push(entry);
  list.sort((a,b)=>b.len-a.len || a.from-b.from);
  if(list.length>25) list.length=25;
}

/* ============================================================
   MONEY LEDGER
   Every movement goes through here so the UI can show where the
   money came from and where it went.
   ============================================================ */
function ledgerPush(amount, label){
  if(!S.ledger) S.ledger=[];
  S.ledger.unshift({y:S.year, w:S.week, a:amount, t:label, bal:S.money});
  if(S.ledger.length>60) S.ledger.length=60;
}
function credit(amount, label){
  if(!amount) return 0;
  S.money += amount; ledgerPush(amount, label); return amount;
}
function debit(amount, label){
  if(!amount) return 0;
  S.money -= amount; ledgerPush(-amount, label); return amount;
}

/* ============================================================
   RESULT APPLICATION
   ============================================================ */
function strength(t){ return t.rolls+t.def+t.cal; }

function moneyFor(week,won,t){
  if(week<CCG_WEEK) return 0;
  const s=strength(t);
  const big=(S.playoffFormat||12)===24;
  const W={13:37, 14:37, 15:47, 16:57, 17:67};
  const L={13:6,  14:8,  15:10, 16:12, 17:20};
  // In the 24-team format every round shifts back a week, and the added
  // opening round pays 80% of what the opening round used to.
  let key=week, mult=1;
  if(big && week>CCG_WEEK){
    if(week===14){ key=14; mult=0.8; }
    else key = week-1;
  }
  const w=W[key]||0, l=L[key]||0;
  return won ? Math.round(Math.max(0, w-s)*mult) : Math.round(l*mult);
}

function applyResult(g){
  const A=S.teams[g.aid], H=S.teams[g.hid];
  if(A.sched[g.week]?.played && A.sched[g.week].opp===g.hid) return null;
  const awayWon=g.aScore>g.hScore;
  const Wt=awayWon?A:H, Lt=awayWon?H:A;
  const ws=awayWon?g.aScore:g.hScore, ls=awayWon?g.hScore:g.aScore;
  const conf = A.conf===H.conf;
  const wk=g.week;

  // Every game counts, postseason included — the source never gates these
  // on the week, and conference credit follows the two teams' conferences.
  Wt.w++; Lt.l++;
  if(conf){ Wt.cw++; Lt.cl++; }
  Wt.allW++; Lt.allL++;

  // win streaks run across seasons; the conference shuffle carries them
  // with the identity, which is what you want
  if(!Wt.streak) Wt.streakStart=S.year;
  Wt.streak=(Wt.streak||0)+1;
  if(Wt.streak>(Wt.bestStreak||0)) Wt.bestStreak=Wt.streak;
  noteStreak(Wt);
  Lt.streak=0;
  if(Wt.user||Lt.user){
    const meT=Wt.user?Wt:Lt, won=Wt.user;
    if(wk<=REG_WEEKS && conf){ if(won)S.coach.confW++; else S.coach.confL++; }
    if(wk>=14){ if(won)S.coach.poW++; else S.coach.poL++; }
  }
  A.pf+=g.aScore;A.pa+=g.hScore;
  H.pf+=g.hScore;H.pa+=g.aScore;

  // v1.48 — keep a compact log of the scoring plays so recaps can
  // reference the real rolls: side + period + dice sum + score type,
  // four characters per score (~40 bytes a game).
  const spStr=g.plays.filter(p=>p.pts>0).map(p=>
    p.side + p.period.toString(36) + p.sum.toString(36) +
    ({3:'f',7:'t',2:'d',8:'e',6:'s'}[p.pts]||'f')).join('');
  // v1.50 — per-side drive/luck aggregates, computed with full engine
  // knowledge while we still have it: [drives, scores, luck*10 (points
  // over the caliber's expectation), long-odds scores, whisker-misses]
  const EVG={1:1.417,2:2.0,3:2.333,4:2.778,5:3.194,6:4.417};
  const tally=side=>{
    let d=0,sc=0,luck=0,lk=0,un=0;
    for(const p of g.plays){
      if(p.side!==side) continue;
      d++;
      luck += p.pts - (EVG[p.cal]||2.3);
      if(p.pts>0){ sc++; if(p.sum<=3||p.sum>=11) lk++; }
      else if(p.cal<6 && GRID[p.cal+1][p.sum]>0) un++;
    }
    return [d,sc,Math.round(luck*10),lk,un];
  };
  const stArr=[...tally('a'),...tally('h')];
  const rec=(t,opp,home,neutral,pf,pa,won,q,oq)=>{
    t.sched[wk]={opp:opp.id,home,neutral,played:true,pf,pa,won,q,oq,ot:g.ot,sp:spStr,st:stArr};
  };
  rec(A,H,false,g.neutral,g.aScore,g.hScore,awayWon,collapseQ(g.aQpts),collapseQ(g.hQpts));
  rec(H,A,true, g.neutral,g.hScore,g.aScore,!awayWon,collapseQ(g.hQpts),collapseQ(g.aQpts));

  // playoff games must land in the bracket or the winner can't advance
  if(S.phase==='playoff' && S.playoff &&
     !S.playoff.results.some(r=>r.aid===g.aid&&r.hid===g.hid)){
    S.playoff.results.push({aid:g.aid,hid:g.hid,neutral:g.neutral,
                            a:g.aScore,h:g.hScore,round:S.playoff.round});
  }

  // ---- poll movement (VB6 formula) ----
  const under = Wt.poll < Lt.poll;
  let wAdj, lAdj=0;
  if(under){
    wAdj = 50+strength(Lt)*2;
    if(wk<CCG_WEEK || !CONF[Lt.conf].p) lAdj = -(90+strength(Wt)*2);
  }else{
    wAdj = 20+strength(Lt);
    if(wk<CCG_WEEK || !CONF[Lt.conf].p) lAdj = -(60+strength(Wt));
  }
  Wt.poll+=wAdj; Lt.poll+=lAdj;

  // ---- money ----
  if(Wt.user||Lt.user){
    const me=Wt.user?Wt:Lt; const won=Wt.user;
    let m=0, why;
    if(wk<CCG_WEEK){
      m = won ? (under?3:2) : (under?0:1);
      why = won ? (under?'Upset win':'Win') : 'Loss';
      if(wk<5 && me===A && isCupcakeVisitor(A) && isCupcakeHost(H)){
        m += CUPCAKE_FEE; g.cupcake=true; why += ' + guarantee game';
      }
    }else{
      m = moneyFor(wk,won,me);
      why = `${weekName(wk)} ${won?'win':'exit'}`;
    }
    if(m>0){ credit(m, why); g.payout=m; }
    if(won){S.coach.w++;}else{S.coach.l++;}
    S.coach.rating += (won?wAdj+30:lAdj+20);
    if(!won && wk>=14) S.eliminated=true;      // knocked out of the playoff
    checkAchievements(g);
    S.lastResult={won,pf:me===A?g.aScore:g.hScore,pa:me===A?g.hScore:g.aScore,
                  opp:(me===A?H:A).name,pay:m,ot:g.ot};
    checkObjectives(g,me,won);
  }
  return {Wt,Lt,ws,ls};
}

/* ---- one-time season objectives (CheckObjectives in VB6) ---- */
const OBJECTIVES=[
  {k:'w6',    t:'Win six games',        d:'Reach bowl eligibility'},
  {k:'home3', t:'Win three at home',    d:'Defend your own field'},
  {k:'p42',   t:'Score 42 in a game',   d:'Put up a big number'},
  {k:'upset', t:'Upset a stronger team',d:'Beat a team rated above you'},
  {k:'top25', t:'Beat a ranked team',   d:'Knock off anyone in the Top 25'},
  {k:'shut',  t:'Pitch a shutout',      d:'Hold an opponent to zero'}
];
const objValue = k => (S.coach.objBonus&&S.coach.objBonus[k])||0;
function objAward(k){
  if(S.obj[k])return;
  const o=OBJECTIVES.find(x=>x.k===k); if(!o)return;
  const v=objValue(k); if(!v)return;
  S.obj[k]=true; credit(v, 'Objective: '+o.t);
  toast(`Objective: ${o.t} — $${v}`);
}
function checkObjectives(g,me,won){
  const opp=S.teams[me.id===g.aid?g.hid:g.aid];
  const mine=me.id===g.aid?g.aScore:g.hScore;
  const theirs=me.id===g.aid?g.hScore:g.aScore;
  if(won){
    if(strength(opp)+opp.cal*2 > strength(me)+me.cal*2) objAward('upset');
    if(opp.rank>0&&opp.rank<=25) objAward('top25');
    if(theirs===0&&mine>0) objAward('shut');
    if(me.w>=6) objAward('w6');
    const homeW=me.sched.filter((x,w)=>x&&x.played&&x.home&&x.won&&w<=REG_WEEKS).length;
    if(homeW>=3) objAward('home3');
  }
  if(mine>=42) objAward('p42');
}

/* ============================================================
   COACH SELECT PACKAGE  (loadtm_Click in TeamSelect.frm)
   Starting cash, pep talks, contract length and objective
   bounties all scale against the program you take.
   ============================================================ */
/* Default gate from TeamSelect.frm: no Power 4, and the program must be
   genuinely poor. "Show all" lifts it but forfeits high-score eligibility. */
function isEligibleProgram(t){
  return !CONF[t.conf].p && t.rolls<=11 && t.cal<=2 && t.def<=2;
}

function coachPackage(t){
  const weak = t.rolls<=11 && t.cal<=2 && t.def<=2;
  let cash = 25 - (t.rolls + t.cal + t.def);
  const contract = 3;          // every first deal is three years
  if(weak) cash += 8;

  const rating = t.rolls + t.cal*3 + t.def;
  if(rating<=18)      cash += 15;
  else if(rating<=22) cash += 10;
  else                cash += 5;
  let pep, tier;
  if(rating<=18){ pep={roll:6,cal:3,def:3}; tier='Rebuild'; }
  else if(rating<=22){ pep={roll:4,cal:2,def:2}; tier='Middling'; }
  else { pep={roll:1,cal:1,def:1}; tier='Loaded'; }

  return {cash, contract, pep, rating, tier, weak,
    obj:{ w6: weak?20:15, home3: weak?10:8, p42: weak?5:3,
          upset:3, top25:7, shut:10 }};
}

/* ============================================================
   CONTRACT + JOB SECURITY  (CheckCoachJobSecurity in VB6)
   The fire line is frozen when you sign. The cushion scales
   inversely with the job: elite programs get the shortest rope.
   ============================================================ */
function cushionFor(t){
  const o=t.rolls, c=t.cal, d=t.def;
  if(o>=14 && c===6 && d>=6) return 250;
  if(o<=11 && c<=3 && d<=3) return 400;
  if((o===12||o===13) && c>=3 && c<=4 && d<=4) return 350;
  if(o>=12 && c>=5 && d>=4) return 300;
  return 350;
}
function cushionLabel(cu){
  return {250:'Elite',300:'Good',350:'Mid-tier',400:'Rebuild'}[cu]||'Mid-tier';
}
function signContract(years){
  const t=S.teams[S.me], c=S.coach;
  c.cushion=cushionFor(t);
  c.fireLine=c.rating-c.cushion;
  c.warnLine=c.fireLine+150;
  c.warned=false;
  c.contractLeft=years||4;
}
/* one-time in-season warning, mirrors the ContractWarned flag */
function jobWarningCheck(){
  const c=S.coach;
  if(!c.warned && c.rating<=c.warnLine && c.rating>c.fireLine){
    c.warned=true;
    toast('Your job is in serious jeopardy.');
  }
}

/* ============================================================
   ELITE POSTSEASON PENALTIES
   Source gate is exact: OffRolls=14, Cal=6, Def=6 or 7 — which
   means a fully maxed 15/8/6 program escapes it. Widened to >=
   so the best teams actually pay.
   ============================================================ */
function isElite(t){ return t.rolls>=14 && t.cal>=6 && t.def>=6; }

const ELITE_CCG_MISS = 15, ELITE_PO_MISS = 10, ELITE_CCG_LOSS_PCT = 0.8;
function eliteMissPenalty(kind){
  if(S.me<0) return;
  const t=S.teams[S.me];
  if(!t.user||!isElite(t)) return;
  const c=S.coach;
  if(kind==='ccg'){
    if(c.eliteMissedCCG) return;
    c.eliteMissedCCG=true;
    const amt=priced(ELITE_CCG_MISS);
    debit(amt,'Missed conference title game');
    toast(`Elite program missed the conference title game — $${amt}`);
  }else if(kind==='ccgLoss'){
    if(c.eliteLostCCG) return;
    c.eliteLostCCG=true;
    // losing it is 80% as bad as never getting there
    const amt=Math.round(priced(ELITE_CCG_MISS)*ELITE_CCG_LOSS_PCT);
    debit(amt,'Lost the conference title game');
    toast(`Elite program lost its conference title game — $${amt}`);
  }else if(kind==='seed'){
    if(c.eliteMissedSeed) return;
    c.eliteMissedSeed=true;
    const amt=priced(ELITE_PO_MISS);
    debit(amt,'Missed a top-eight seed');
    toast(`Elite program failed to earn a bye — $${amt}`);
  }else{
    if(c.eliteMissedPlayoff) return;
    c.eliteMissedPlayoff=true;
    const amt=priced(ELITE_PO_MISS);
    debit(amt,'Missed the playoff');
    toast(`Elite program missed the playoff — $${amt}`);
  }
}

/* ============================================================
   RANKINGS
   ============================================================ */
function updateRanks(){
  const s=S.teams.slice().sort((a,b)=>
    b.poll-a.poll || b.w-a.w || (b.pf-b.pa)-(a.pf-a.pa));
  s.forEach((t,i)=>{t.rank=i+1;});
}

function confStandings(ck){
  return S.teams.filter(t=>t.conf===ck).sort((a,b)=>
    b.cw-a.cw || a.cl-b.cl || b.w-a.w || b.poll-a.poll);
}

/* ============================================================
   WEEK RUNNER
   ============================================================ */
function weekGames(w){
  const seen=new Set(); const out=[];
  S.teams.forEach(t=>{
    const g=t.sched[w]; if(!g)return;
    const k=t.id<g.opp?`${t.id}-${g.opp}`:`${g.opp}-${t.id}`;
    if(seen.has(k))return; seen.add(k);
    const aid=g.home?g.opp:t.id, hid=g.home?t.id:g.opp;
    out.push({aid,hid,neutral:g.neutral});
  });
  return out;
}

/* every game this week with its status, for the scoreboard */
function weekBoard(){
  const w=S.week, seen=new Set(), out=[];
  S.teams.forEach(t=>{
    const g=t.sched[w]; if(!g) return;
    const k=t.id<g.opp?`${t.id}-${g.opp}`:`${g.opp}-${t.id}`;
    if(seen.has(k))return; seen.add(k);
    const aid=g.home?g.opp:t.id, hid=g.home?t.id:g.opp;
    const ag=S.teams[aid].sched[w];
    out.push({aid,hid,neutral:!!g.neutral,played:!!ag.played,
              a:ag.played?ag.pf:null, h:ag.played?ag.pa:null});
  });
  return out;
}
function gamesLeft(){ return weekBoard().filter(g=>!g.played).length; }

function userGameThisWeek(){
  if(S.me<0)return null;
  const me=S.teams[S.me];
  if(S.phase==='playoff'){
    const m=S.playoff?.pending?.find(g=>g.aid===S.me||g.hid===S.me);
    if(!m) return null;
    // the bracket keeps the matchup around after it's decided, so check
    // the schedule entry or the game stays replayable
    const e=me.sched[S.week];
    if(e && e.played) return null;
    return m;
  }
  const g=me.sched[S.week];
  if(!g||g.played)return null;
  return {aid:g.home?g.opp:S.me, hid:g.home?S.me:g.opp, neutral:g.neutral};
}

/* simulate every game this week except the user's */
function simRestOfWeek(){
  // Only games that haven't been played. Anything already watched live is
  // finished — re-simming it would apply the result a second time.
  weekBoard().filter(g=>!g.played).forEach(m=>{
    if(m.aid===S.me||m.hid===S.me)return;
    const g=prepGame(m.aid,m.hid,{neutral:m.neutral,week:S.week});
    autoPlay(g); applyResult(g);
  });
  updateRanks();
}

function clearPeps(){
  ['cal','roll','def'].forEach(k=>{
    if(S.pepOn[k]){S.pep[k]=Math.max(0,S.pep[k]-1);S.pepOn[k]=false;}
  });
}

function advanceWeek(){
  clearPeps();
  S.lastEvent = applyWeeklyRandomEvents();
  // the opponent prepares for the week we are moving INTO, so this has to
  // happen after the week and phase have actually changed
  if(S.week<REG_WEEKS){ S.week++; rollOpponentPep(); return; }
  if(S.week===REG_WEEKS){ startCCG(); rollOpponentPep(); return; }
  if(S.week===CCG_WEEK){ startPlayoff(); rollOpponentPep(); return; }
  advancePlayoffRound();
