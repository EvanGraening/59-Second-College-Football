  rollOpponentPep();
}

/* ============================================================
   CONFERENCE CHAMPIONSHIPS
   ============================================================ */
function startCCG(){
  S.week=CCG_WEEK; S.phase='ccg';
  S.teams.forEach(t=>{t.sched[CCG_WEEK]=null;});
  CONF_KEYS.forEach(ck=>{
    const st=confStandings(ck);
    const a=st[1], h=st[0];
    a.sched[CCG_WEEK]={opp:h.id,home:false,neutral:true,played:false};
    h.sched[CCG_WEEK]={opp:a.id,home:true, neutral:true,played:false};
  });
  if(S.me>=0 && !S.teams[S.me].sched[CCG_WEEK]) eliteMissPenalty('ccg');
}

function ccgWinners(){
  return CONF_KEYS.map(ck=>{
    const inC=S.teams.filter(t=>t.conf===ck);
    const g=inC.find(t=>t.sched[CCG_WEEK]?.played);
    if(!g) return confStandings(ck)[0];
    return g.sched[CCG_WEEK].won ? g : S.teams[g.sched[CCG_WEEK].opp];
  });
}

/* ============================================================
   12-TEAM PLAYOFF
   ============================================================ */
/* The field, for either format. Conference winners are automatic; the
   remaining places go to the best teams left in the poll. */
/* Standard tournament order for a bracket of n slots. Pairs sit next to
   each other, so 16 gives 1-16, 8-9, 4-13, 5-12, 2-15, 7-10, 3-14, 6-11 —
   which puts 1 and 2 on opposite sides and can only meet in the final. */
function seedOrder(n){
  let o=[1];
  while(o.length<n){
    const m=o.length*2, next=[];
    o.forEach(x=>{ next.push(x, m+1-x); });
    o=next;
  }
  return o;
}

function buildField(champs, format){
  const byPoll = a => a.slice().sort((x,y)=>y.poll-x.poll);
  if(format===24){
    const auto=byPoll(champs);                       // all nine are in
    const inSet=new Set(auto.map(t=>t.id));
    const atLarge=byPoll(S.teams.filter(t=>!inSet.has(t.id))).slice(0,24-auto.length);
    return byPoll([...auto,...atLarge]);             // seeded on the poll
  }
  const topChamps=byPoll(champs).slice(0,5);
  const inSet=new Set(topChamps.map(t=>t.id));
  const atLarge=byPoll(S.teams.filter(t=>!inSet.has(t.id))).slice(0,7);
  const seeded=byPoll(topChamps).slice(0,4);
  const rest=byPoll([...topChamps.slice(4),...atLarge]);
  return [...seeded,...rest];
}

/* the bracket as it stands right now */
function projectedField(){
  const champs=CONF_KEYS.map(ck=>confStandings(ck)[0]).filter(Boolean);
  return buildField(champs, S.playoffFormat||12);
}

function startPlayoff(){
  updateRanks();
  const champs=ccgWinners();
  if(S.me>=0){
    const g=S.teams[S.me].sched[CCG_WEEK];
    if(g && g.played && !g.won) eliteMissPenalty('ccgLoss');
  }
  champs.forEach(t=>{
    t.titles++;
    if(t.user){ S.coach.titles++; awardTrophy(TROPHY_OF[t.conf]); unlockAch('conf_'+t.conf); }
  });
  const format = S.playoffFormat||12;
  const field = buildField(champs, format);
  field.forEach((t,i)=>{t.seed=i+1;});

  if(S.me>=0 && !field.some(t=>t.id===S.me)){ eliteMissPenalty('playoff'); S.eliminated=true; }

  const byeCount = format===24 ? 8 : 4;
  if(S.me>=0 && format===24){
    const seedOfMe=(field.find(t=>t.id===S.me)||{}).seed;
    if(seedOfMe && seedOfMe>byeCount) eliteMissPenalty('seed');
  }
  const byes = field.slice(0,byeCount).map(t=>t.id);
  const openers = field.slice(byeCount);

  // highest remaining seed hosts the lowest: 24 travels to 9, 23 to 10 ...
  const pending=[];
  for(let i=0;i<openers.length/2;i++){
    pending.push({aid:openers[openers.length-1-i].id, hid:openers[i].id, neutral:false});
  }

  field.forEach(t=>{ t.poApps=(t.poApps||0)+1; });
  openers.forEach(t=>{ t.poR1=(t.poR1||0)+1; });

  if(S.me>=0 && field.some(t=>t.id===S.me)){
    S.coach.poApps++;
    if(byes.includes(S.me)) S.coach.poQ++; else S.coach.po1++;
  }

  S.phase='playoff'; S.week=14;
  S.playoff={ format, round:1, field:field.map(t=>t.id), results:[],
              pending, byes, slots:null, live:[] };
  S.teams.forEach(t=>{t.sched[14]=null;});
  pending.forEach(m=>{
    S.teams[m.aid].sched[14]={opp:m.hid,home:false,neutral:false,played:false};
    S.teams[m.hid].sched[14]={opp:m.aid,home:true, neutral:false,played:false};
  });
}

function winnerOf(m){
  const r=S.playoff.results.find(x=>x.aid===m.aid&&x.hid===m.hid);
  if(!r)return null;
  return r.a>r.h?m.aid:m.hid;
}

function advancePlayoffRound(){
  const P=S.playoff;
  const T=S.teams;
  const fmt=P.format||12;
  const lastRound = fmt===24 ? 5 : 4;
  const byeCount = P.byes.length;
  const bracketSize = byeCount*2;
  const justPlayed=P.pending.slice();
  const winners=justPlayed.map(winnerOf).filter(x=>x!==null);
  const wasIn = m => m.aid===S.me||m.hid===S.me;
  P.round++;
  if(P.round<=lastRound) S.week++;
  P.pending=[];

  if(S.me>=0 && winners.includes(S.me)){
    const qRound = fmt===24 ? 3 : 2;
    if(P.round===qRound) S.coach.poQ++;
    else if(P.round===qRound+1) S.coach.poS++;
  }
  if(P.round===lastRound+1 && justPlayed.some(wasIn) && !winners.includes(S.me))
    S.coach.runnerUps++;

  const pairUp = neutral => {
    for(let i=0;i<P.slots.length;i+=2){
      const x=P.slots[i], y=P.slots[i+1];
      if(x==null||y==null) continue;
      const hi = T[x].seed<T[y].seed ? x : y;
      const lo = hi===x ? y : x;
      P.pending.push({aid:lo, hid:hi, neutral});
    }
  };

  if(P.round===2){
    // Slot the bracket once and never re-seed it. Byes take positions 1-8
    // (or 1-4); each opening-round winner inherits the position of the
    // higher seed in its game.
    const order=seedOrder(bracketSize);
    const r1={};
    justPlayed.forEach(m=>{
      const head=Math.min(T[m.aid].seed, T[m.hid].seed);
      r1[head]=winnerOf(m);
    });
    P.slots = order.map(pos => pos<=byeCount ? P.field[pos-1] : r1[pos]);
    pairUp(fmt!==24);           // the 24-team byes host; the 12-team quarters are neutral
  }else if(P.round<=lastRound){
    // walk the tree: each pair collapses to its winner, order preserved
    const next=[];
    for(let i=0;i<P.slots.length;i+=2){
      const x=P.slots[i], y=P.slots[i+1];
      const m=justPlayed.find(g=>(g.aid===x&&g.hid===y)||(g.aid===y&&g.hid===x));
      next.push(m?winnerOf(m):null);
    }
    P.slots=next;
    pairUp(true);
  }else{
    const champ=winners[0];
    if(champ!=null){
      S.teams[champ].natties++;
      if(champ===S.me){
        S.coach.natties++; awardTrophy(10);
        const t=S.teams[champ];
        if(t.l===0) unlockAch('perfect');
        if(!P4_CONF(t.conf)) unlockAch('g5natty');
        checkAchievements();
      }
      P.champion=champ;
    }
    S.phase='offseason';
    return;
  }

  // whoever is still standing has reached this round; the number of teams
  // left names it, so the same code covers both formats
  const remaining=P.pending.length*2;
  const field_ = {16:'poR16', 8:'poQF', 4:'poSF', 2:'poFinal'}[remaining];
  if(field_) P.pending.forEach(m=>{
    S.teams[m.aid][field_]=(S.teams[m.aid][field_]||0)+1;
    S.teams[m.hid][field_]=(S.teams[m.hid][field_]||0)+1;
  });

  S.teams.forEach(t=>{t.sched[S.week]=null;});
  P.pending.forEach(m=>{
    S.teams[m.aid].sched[S.week]={opp:m.hid,home:false,neutral:m.neutral,played:false};
    S.teams[m.hid].sched[S.week]={opp:m.aid,home:true, neutral:m.neutral,played:false};
  });
}

/* reconstruct the bracket round by round, finished games and upcoming */
function playoffRounds(){
  const P=S.playoff; if(!P) return [];
  const names = (P.format||12)===24
    ? ['First Round','Second Round','Quarterfinals','Semifinals','National Championship']
    : ['First Round','Quarterfinals','Semifinals','National Championship'];
  const out=[];
  for(let r=1;r<=names.length;r++){
    const done=P.results.filter(x=>x.round===r);
    const pend=(P.round===r?(P.pending||[]):[])
      .filter(m=>!done.some(d=>d.aid===m.aid&&d.hid===m.hid));
    out.push({r, name:names[r-1], reached:done.length>0||pend.length>0,
      games:[...done.map(x=>({aid:x.aid,hid:x.hid,a:x.a,h:x.h,done:true})),
             ...pend.map(m=>({aid:m.aid,hid:m.hid,done:false}))]});
  }
  return out;
}

/* ============================================================
   CONFERENCE IDENTITY SWAP  (SwapRandomTeamsInConference)
   Schedule slots are fixed by team id, so trading identities
   between slots inside a conference reshuffles who plays whom
   without touching the authored matchup files. Your own team
   never moves, and nobody leaves their conference.
   ============================================================ */
/* Defined by exclusion, not inclusion: everything belongs to the team
   identity and travels with it, EXCEPT the handful of things that belong
   to the schedule slot or get recomputed. Listing what stays is safer than
   listing what moves — a new stat added later travels automatically. */
const SLOT_FIELDS=new Set(['id','conf','user','sched','pre','drift','changed']);

function swapConference(ck){
  const idx=S.teams.filter(t=>t.conf===ck && !t.user).map(t=>t.id);
  if(idx.length<2) return 0;
  for(let i=idx.length-1;i>0;i--){          // Fisher-Yates
    const j=rnd(i+1); [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  let n=0;
  for(let i=0;i+1<idx.length;i+=2){
    const A=S.teams[idx[i]], B=S.teams[idx[i+1]];
    Object.keys(A).forEach(f=>{
      if(SLOT_FIELDS.has(f)) return;
      const tmp=A[f]; A[f]=B[f]; B[f]=tmp;
    });
    n++;
  }
  return n;                                  // odd team out stays put
}
function swapAllConferences(){
  return CONF_KEYS.reduce((n,ck)=>n+swapConference(ck),0);
}

/* ============================================================
   JOB OFFERS  (ShowJobOptions / btnAcceptOffer / btnDeclineOffer)
   Offers arrive when a contract expires. What you're shown is
   gated by coach rating: low ratings see only bad Group of 5
   jobs, high ratings see solid programs that haven't won a title.
   ============================================================ */
const P4_CONF = c => !!CONF[c].p;

/* What a job is worth. Three things move it: how good you are, how badly
   the school needs you, and what they can afford. The ceiling is set to
   roughly two and a half upgrades at that school's price level, so a big
   program's offer buys more than a small one's — and it grows with
   inflation instead of pinning everyone to a flat number. */
function bonusCap(t){
  const tier = Math.min(t.cal, MAX_CAL-1);
  return Math.round(priced(COST_CAL[tier] || 40) * 2.5);
}
function schoolNeed(t){
  const g = t.w + t.l;
  if(!g) return 1;
  const pct = t.w / g;
  if(pct < 0.42) return 1.45;      // desperate, and motivated to pay
  if(pct < 0.58) return 1.20;      // treading water
  return 1.0;                      // doing fine, no premium
}
function signingBonus(t, rehire){
  const r=S.coach.rating;
  if(r<=0) return 0;
  const p4 = P4_CONF(t.conf);
  const pct = rehire ? (p4?0.025:0.020) : (p4?0.050:0.035);
  const raw = r * pct * (rehire ? 1 : schoolNeed(t));
  return Math.min(bonusCap(t), Math.round(raw));
}


/* your own school will only re-sign you if your rating clears the bar
   its roster sets — good programs demand far more */
function rehireAllowed(t){
  const R=overallRating(t), r=S.coach.rating;
  if(R<27)  return r>100;
  if(R<=35) return r>=250;
  if(R===36) return r>=1250;
  return r>2000;
}

/* Your résumé, not a raw number, decides which doors open.
   0 unproven · 1 proven at a small school · 2 a consistent winner
   3 someone the big programs want */
function coachTier(){
  const c=S.coach;
  const big=(c.resume||[]).filter(r=>r.w>=8).length;
  const cc=c.titles||0, po=c.poApps||0, nc=c.natties||0;
  if(nc>=1 || cc>=3 || po>=3) return 4;   // a name
  if(cc>=2 || po>=2)          return 3;   // proven at the top
  // a title alone used to vault you past tier 1 entirely; now the rung
  // has to be climbed — a trophy plus a track record, or a long one
  if((cc>=1 && big>=2) || big>=4) return 2;   // a winner
  if(big>=2)                  return 1;   // worth a look
  return 0;                               // unproven
}

/* Pools are cumulative, so a coach who fails at a big job still has the
   mid-tier and the good small schools to fall back on. */
function offerFits(t, tier){
  const p4=P4_CONF(t.conf), R=overallRating(t), w=t.w;
  if(!p4 && R<=18)             return tier>=0;  // bottom of the barrel
  if(!p4 && R<=23 && w<=7)     return tier>=1;  // a step up — and only a job in trouble
  if(!p4 && R<=23)             return tier>=2;  // any decent small school
  if(p4 && R<=24 && w<=7)      return tier>=2;  // a genuinely broken Power 4 program
  if(!p4)                      return tier>=3;  // the best of the small schools
  if(R<=32 && w<=8)            return tier>=3;  // mid-tier Power 4 in a down year
  return tier>=4 && w<=9;                       // a big program in a rough spell
}

function buildJobOffers(){
  const T=S.teams;
  const me = S.me>=0 ? T[S.me] : null;
  const tier = coachTier();
  const out=[], seen=new Set();

  if(me && rehireAllowed(me)){
    out.push({id:me.id, rehire:true, years:3, bonus:signingBonus(me,true),
              w:me.w, l:me.l});
    seen.add(me.id);
  }

  const pool=[];
  T.forEach(t=>{
    if(seen.has(t.id) || (me && t.id===me.id)) return;
    if(!offerFits(t, tier)) return;
    pool.push({id:t.id, rehire:false, years:3,
               bonus:signingBonus(t,false), w:t.w, l:t.l,
               score:t.rolls*5 + t.cal*10 + t.def*5});
  });
  pool.sort((a,b)=> b.score-a.score || b.w-a.w ||
                    T[a.id].name.localeCompare(T[b.id].name));
  out.push(...pool.slice(0, Math.max(0, 5-out.length)));
  return out;
}


function acceptOffer(i){
  const o=S.offers[i]; if(!o) return null;
  const t=S.teams[o.id];
  const switching = S.me<0 || o.id!==S.me;
  if(S.me>=0) S.teams[S.me].user=false;
  S.me=o.id; t.user=true;
  if(switching) S.coach.rating=0;        // fresh start at a new school
  credit(o.bonus, (o.rehire?'Re-signing':'Signing')+' bonus');
  S.pep.roll++; S.pep.def++;
  const bigCal = t.rolls<=11 && t.cal<=3 && t.def<=3;
  S.pep.cal += bigCal?2:1;
  signContract(o.years);
  S.tempCal=0; S.tempDef=0; S.lastEvent=null;
  S.unemployed=false; S.offers=null; S.phase='season';
  return {team:t.name, bonus:o.bonus, years:o.years, rehire:o.rehire,
          pep:{roll:1,def:1,cal:bigCal?2:1}, reset:switching};
}

/* the career is over, one way or another */
function retireCareer(reason){
  if(S.me>=0) S.teams[S.me].user=false;
  S.finalScore = calcRunScore();
  S.retireReason = reason;
  S.phase='retired';
  S.offers=null;
}

/* Stop here: bank the score and close the book on this coach. */
function endRun(){
  checkAchievements();
  retireCareer('You called it a career.');
}

function declineOffers(){
  if(S.me>=0) S.teams[S.me].user=false;
  S.me=-1;
  S.coach.rating=0; S.coach.contractLeft=0;
  S.unemployed=true; S.offers=null; S.phase='unemployed';
}

/* a year on the sidelines: the league plays on without you */
function sitOutSeason(){
  let guard=0;
  S.phase='season';
  while(S.phase!=='offseason' && guard++<40){
    simRestOfWeek();
    advanceWeek();
  }
  applyLeagueDrift();
  if(S.settings.confSwap!==false) swapAllConferences();
  resetSeason();
  if(S.coach.seasons>=MAX_SEASONS){
    retireCareer('You reached forty seasons on the sideline. Time to hang it up.');
    return 0;
  }
  S.offers=buildJobOffers();
  if(!S.offers.length){
    retireCareer("You sat out a season and the phone still never rang. Sadly, coaching isn't for you \u2014 your career has ended.");
    return 0;
  }
  S.phase='offers';
  return S.offers.length;
}

function applyLeagueDrift(){
  S.teams.forEach(t=>{ t.pre={rolls:t.rolls, cal:t.cal, def:t.def}; });
  S.lastBoost=null;
  S.teams.forEach(t=>{
    // A Recruiter gets one more roll of the dice when the year goes badly.
    const arch=ARCHETYPES[S.coach && S.coach.archetype];
    // a reroll isn't guaranteed — the staff only get another crack at it
    // some of the time, which is what keeps the Recruiter in line
    const gotReroll = arch && arch.rerollDecline &&
      (arch.rerollChance==null || Math.random() < arch.rerollChance);
    const guards = (t.user && arch) ? (gotReroll ? 'all' : (arch.protect||null)) : null;
    const tries = guards ? 2 : 1;
    for(let attempt=0; attempt<tries; attempt++){
    if(attempt>0){ t.rolls=t.pre.rolls; t.cal=t.pre.cal; t.def=t.pre.def; }
    // A targeted recruiting push replaces the usual random movement:
    // two swings at one chosen rating, and no chance of sliding back.
    if(t.user && S.recruitBoost){
      const k=S.recruitBoost;
      const cap={rolls:MAX_ROLL, cal:MAX_CAL, def:MAX_DEF}[k];
      const rolled=[]; let got=false;
      for(let i=0;i<2 && !got;i++){
        const r=d6(); rolled.push(r);
        if(r<=3 && t[k]<cap){ t[k]++; got=true; }
      }
      t.drift = got
        ? `Targeted recruiting landed a ${STAT_LABEL[k]}`
        : `Targeted recruiting came up empty`;
      t.changed=got;
      S.lastBoost={stat:k, got, rolled, maxed:t[k]>=cap && !got};
      S.recruitBoost=null;
      break;
    }
    const g5 = !CONF[t.conf].p;
    let changed=false;

    /* A program has a level it belongs at. Fall below it and the alumni,
       the facilities and the name still count for something, so recruiting
       tends to pull you back. The further below, the stronger the pull. */
    const baseline = (t.baseRolls||t.rolls) + (t.baseCal||t.cal)*3 + (t.baseDef||t.def);
    const gap = baseline - overallRating(t);
    const pull  = gap>0 ? Math.min(0.75,  gap*BASELINE_PULL) : 0;   // below: help
    const drag  = gap<0 ? Math.min(0.75, -gap*BASELINE_PULL) : 0;   // above: harder to hold

    // Branch 1 — maxed-out decline
    if(t.rolls>=MAX_ROLL && t.cal>=MAX_CAL && t.def>=MAX_DEF){
      if(Math.random()<0.6){
        if(Math.random()<0.5){ if(t.rolls>10){t.rolls--;changed=true;} }
        else { if(t.def>1){t.def--;changed=true;} }
      }
      t.drift = changed?'Roster decay':'Held together';

    // Branch 2 — mid-major transfer attrition
    }else if(g5 && (t.rolls>=13 || t.cal>=5)){
      const r=Math.random();
      if(r<0.15){
        const pick=rnd(3);
        if(pick===0&&t.rolls<14){t.rolls++;changed=true;}
        else if(pick===1&&t.cal<6){t.cal++;changed=true;}
        else if(pick===2&&t.def<7){t.def++;changed=true;}
        t.drift='Held off the portal';
      }else if(r<0.6){ t.drift='Portal pressure, no loss'; }
      else{
        const pick=rnd(3);
        if(pick===0&&t.rolls>10){t.rolls--;changed=true;}
        else if(pick===1&&t.cal>1){t.cal--;changed=true;}
        else if(pick===2&&t.def>1){t.def--;changed=true;}
        t.drift='Lost players to the portal';
      }

    // Branch 3 — everyone else
    }else{
      const notMaxed = t.rolls<MAX_ROLL||t.cal<MAX_CAL||t.def<MAX_DEF;
      if(notMaxed){
        const p4=CONF[t.conf].p;
        if((p4&&t.w>=11)||(!p4&&t.w>=9)){
          if(Math.random()<0.5){
            for(let k=0;k<3&&!changed;k++){
              const pick=rnd(3);
              if(pick===0&&t.rolls<MAX_ROLL){t.rolls++;changed=true;}
              else if(pick===1&&t.def<MAX_DEF){t.def++;changed=true;}
              else if(pick===2&&t.cal<MAX_CAL){t.cal++;changed=true;}
            }
            if(changed) t.drift='Recruiting boost off a big season';
          }
        }
      }
      if(!changed){
        let roll=d6();
      // below where you belong a bad roll gets a second look; above it,
      // a good one does — a program tends back toward its own level
      if(pull>0 && roll>=3 && roll<=5 && Math.random()<pull) roll=d6();
      else if(drag>0 && (roll<=2 || roll===6) && Math.random()<drag) roll=d6();
        /* Rock bottom. A rating that cannot fall any further used to waste
           the roll and leave the program stuck there for years, which is why
           so many ended up on caliber 1. Now hitting the floor sometimes
           brings the turnaround instead — a new benefactor, a new staff. */
        let rebound=false;
        const bottom = (v,floor)=> v<=floor && Math.random()<FLOOR_REBOUND;
        if(roll===1&&t.rolls<MAX_ROLL){t.rolls++;changed=true;}
        else if(roll===2&&t.def<MAX_DEF){t.def++;changed=true;}
        else if(roll===3){
          if(t.rolls>10){t.rolls--;changed=true;}
          else if(bottom(t.rolls,10)&&t.rolls<MAX_ROLL){t.rolls++;changed=rebound=true;}
        }
        else if(roll===4){
          if(t.def>1){t.def--;changed=true;}
          else if(bottom(t.def,1)&&t.def<MAX_DEF){t.def++;changed=rebound=true;}
        }
        /* Caliber has only six rungs against eight for defense, so it drifts
           to the extremes fastest. Giving it some inertia keeps programs near
           the offense they were built with without making it predictable. */
        else if(roll===5){
          if(Math.random()<CAL_INERTIA){ /* the class holds together */ }
          else if(t.cal>1){t.cal--;changed=true;}
          else if(bottom(t.cal,1)&&t.cal<MAX_CAL){t.cal++;changed=rebound=true;}
        }
        else if(roll===6){
          if(Math.random()<CAL_INERTIA){ /* nobody moved the needle */ }
          else if(t.cal<MAX_CAL){t.cal++;changed=true;}
        }
        if(!t.drift||changed)
          t.drift = rebound ? 'Nowhere to go but up' : 'Normal roster turnover';
      }
    }
    t.changed=changed;
    const slipped = guards==='all'
      ? ((t.rolls<t.pre.rolls)||(t.cal<t.pre.cal)||(t.def<t.pre.def))
      : (guards||[]).some(k=>t[k]<t.pre[k]);
    if(!slipped) break;
    if(attempt+1<tries) t.drift = guards==='all'
      ? 'Recruiting staff went back to work'
      : 'Your specialty held the line';
    }
  });

}

function resetSeason(){
  S.year++; S.week=1; S.phase='season';
  S.schedRotate=((S.schedRotate||0)+1)&1;
  S.playoff=null; S.lastResult=null;   // objectives are career one-offs, never reset
  S.coach.eliteMissedCCG=false; S.coach.eliteMissedPlayoff=false; S.coach.eliteLostCCG=false; S.coach.eliteMissedSeed=false;
  S.tempCal=0; S.tempDef=0; S.lastEvent=null; S.oppPep=null;
  S.eliminated=false; S.preseasonDone=false;
  S.teams.forEach(t=>{
    t.seasons=(t.seasons||0)+1;
    t.w=t.l=t.cw=t.cl=t.pf=t.pa=0; t.seed=0;
    t.poll=(t.rolls+t.cal*3+t.def)*20;
  });
  // the Motivator's staff turns up with something every year
  const arch = ARCHETYPES[S.coach && S.coach.archetype];
  if(S.me>=0 && arch && arch.yearlyOne){
    S.pep = S.pep || {cal:0,roll:0,def:0};
    const k=['cal','roll','def'][rnd(3)];       // one, and which one is luck
    S.pep[k]=(S.pep[k]||0)+1;
    S.pepGift = {[k]:1};
  } else S.pepGift = null;

  updateRanks();
  buildSchedule();
  rollOpponentPep();          // week 1 needs one too
}

/* ============================================================
   RECRUITING BILL
   The offseason roll decides what your roster *could* be. Holding
   onto it costs money scaled to how good the program already is —
   improving costs most, standing still costs less, and sliding
   backwards is the only free outcome.
   ============================================================ */
function overallRating(t){ return t.rolls + t.cal*3 + t.def; }
function recruitCost(t, kind){
  const R=overallRating(t);
  // Progressive: the first 10 points of rating are free, so a bottom-tier
  // program pays very little and a loaded one pays a lot.
  const base=Math.max(0,R-10);
  if(kind==='improved')  return costOf('bill', Math.round(base*1.8));
  if(kind==='unchanged') return costOf('bill', Math.round(base*1.2));
  return 0;
}
function driftKind(pre,t){
  if(t.rolls>pre.rolls||t.cal>pre.cal||t.def>pre.def) return 'improved';
  if(t.rolls<pre.rolls||t.cal<pre.cal||t.def<pre.def) return 'declined';
  return 'unchanged';
}
/* knock one point off, respecting the same floors the drift uses */
function forceDecline(t){
  const opts=[];
  if(t.rolls>10) opts.push('rolls');
  if(t.cal>1)    opts.push('cal');
  if(t.def>1)    opts.push('def');
  if(!opts.length) return false;
  t[opts[rnd(opts.length)]]--;
  return true;
}

/* what the offseason roll is offering, and what each option costs */
function recruitOptions(){
  if(S.me<0) return null;
  const me=S.teams[S.me], pre=me.pre;
  const kind=driftKind(pre,me);
  if(kind==='declined' || S.settings.recruitPay===false) return null;
  return {
    kind,
    from:[pre.rolls,pre.cal,pre.def],
    to:[me.rolls,me.cal,me.def],
    improveCost: kind==='improved' ? recruitCost(me,'improved') : 0,
    holdCost: recruitCost({rolls:pre.rolls,cal:pre.cal,def:pre.def},'unchanged'),
    money: S.money
  };
}

/* settle the user's recruiting bill; returns what happened.
   choice: 'auto' | 'keep' | 'hold' | 'let' */
function settleRecruiting(choice){
  const me=S.teams[S.me];
  const pre=me.pre;
  let kind=driftKind(pre,me);

  if(choice==='let' && kind!=='declined'){
    me.rolls=pre.rolls; me.cal=pre.cal; me.def=pre.def;
    const lost=forceDecline(me);
    return {kind, cost:0, paid:0, outcome:'declined',
            note: lost?'Let the roster slide rather than pay':'Let the roster slide'};
  }
  if(choice==='hold' && kind==='improved'){
    me.rolls=pre.rolls; me.cal=pre.cal; me.def=pre.def;
    kind='unchanged';
  }
  if(kind==='declined' || S.settings.recruitPay===false)
    return {kind, cost:0, paid:0, outcome:kind, note:kind==='declined'
      ? 'Roster slipped — nothing to pay for' : 'Recruiting bill turned off'};

  if(kind==='improved' && choice!=='hold'){
    const cost=recruitCost(me,'improved');
    if(S.money>=cost){
      debit(cost,'Recruiting: signed the class');
      return {kind, cost, paid:cost, outcome:'improved',
              note:'Signed the class that got you better'};
    }
    // couldn't fund the improvement — fall back to holding what you had
    me.rolls=pre.rolls; me.cal=pre.cal; me.def=pre.def;
    kind='unchanged';
  }

  const hold=recruitCost(me,'unchanged');
  if(S.money>=hold){
    debit(hold,'Recruiting: held the roster');
    return {kind:'unchanged', cost:hold, paid:hold, outcome:'unchanged',
            note: driftKind(pre,me)==='unchanged' && me.rolls===pre.rolls
              ? 'Held the roster together' : 'Could not fund the upgrade, held instead'};
  }
  const lost=forceDecline(me);
  return {kind, cost:hold, paid:0, outcome:'declined',
          note: lost ? 'Could not cover recruiting — lost a player'
                     : 'Could not cover recruiting'};
}

/* ============================================================
   CHAMPIONSHIP EXPECTATION
   Once a roster reaches 15/6/7 the boosters expect a title, and
   anything short of one costs coaching points. The further you
   fall short, the worse it stings.
   ============================================================ */
function isStacked(t){ return t.rolls>=15 && t.cal>=6 && t.def>=7; }

function championshipExpectation(){
  const me=S.teams[S.me];
  if(!isStacked(me)) return null;
  const P=S.playoff;
  if(P && P.champion===S.me) return null;      // delivered

  const madeCCG = me.sched[CCG_WEEK] && me.sched[CCG_WEEK].played;
  const inField = P && P.field && P.field.includes(S.me);
  let howFar=0;                                 // last round won
  if(inField){
    howFar = P.byes && P.byes.includes(S.me) ? 1 : 0;
    (P.results||[]).forEach(r=>{
      const won=(r.aid===S.me&&r.a>r.h)||(r.hid===S.me&&r.h>r.a);
      if(won) howFar=Math.max(howFar,r.round);
    });
  }
  let hit, why;
  if(!inField){ hit=1400; why='Missed the playoff with a roster built to win it all'; }
  else if(howFar<=1){ hit=1000; why='Out in the quarterfinals'; }
  else if(howFar===2){ hit=700; why='Out in the semifinals'; }
  else { hit=400; why='Lost the national championship'; }
  if(!madeCCG){ hit+=300; why+=', and no conference title game'; }

  S.coach.rating -= hit;
  return {hit, why};
}

/* ============================================================
   OFFSEASON
   ============================================================ */
/* Roll the league's offseason but stop before the recruiting bill so the
   player can decide. Returns the options, or null if there's nothing to ask. */
function beginOffseason(){
  if(S._offRolled) return recruitOptions();
  applyLeagueDrift();
  S._offRolled=true;
  return recruitOptions();
}

/* ------------------------------------------------------------
   Season's end, before anything about next year is decided.
   This is btnContract_Click's moment: the books close on the
   year, then — if the deal is up — the market opens, using the
   ratings and records exactly as the season left them.
   ------------------------------------------------------------ */
function closeSeason(){
  const me=S.teams[S.me];
  const wins=me.w;
  const cc=me.sched[CCG_WEEK]?.played && me.sched[CCG_WEEK].won;
  const natty=S.playoff?.champion===S.me;

  S.coach.seasons++;
  S.coach.resume.push({
    year:S.year, team:me.name, w:me.w, l:me.l,
    rank:me.rank, cc:!!cc, natty:!!natty
  });

  if(me.l===0 && me.w>=REG_WEEKS) unlockAch('unbeaten');
  checkAchievements();

  const expMiss = championshipExpectation();

  let rev = Math.max(0, 26-strength(me)) + me.w + (cc?10:0) + (natty?20:0)
            + inflationTiers()*REVENUE_STEP;
  if(me.rank<=25) rev+=5;
  credit(rev, 'Season revenue');

  const c=S.coach;
  const fired = c.rating<=c.fireLine;
  if(fired){ c.everFired=true; unlockAch('fired'); }
  let expiring=false;
  if(!fired){
    c.contractLeft--;
    if(c.contractLeft<=0) expiring=true;
  }
  S._close={rev, expMiss, cc, natty, wins};
  return {fired, expiring, rev, expMiss, cc, natty, wins,
          capped:c.seasons>=MAX_SEASONS,
          rating:c.rating, fireLine:c.fireLine};
}

function runOffseason(recruitChoice){
  const me=S.teams[S.me];
  const before={rolls:me.rolls, def:me.def, cal:me.cal};
  const cl=S._close||{}; S._close=null;
  const {rev=0, expMiss=null, cc=false, natty=false, wins=me.w} = cl;
  const c=S.coach;
  const fired=false, renewed=false, expiring=false;

  // ---- offseason rating movement (OffseasonAdjustments in VB6) ----
  // Applies to every program including yours, which is why money never
  // stops mattering: a maxed roster decays.
  if(!S._offRolled) applyLeagueDrift();
  S._offRolled=false;

  // ---- recruiting bill ----
  const recruit = S.me>=0 ? settleRecruiting(recruitChoice||'auto') : null;
  const meAfter = {rolls:me.rolls, def:me.def, cal:me.cal, drift:me.drift};

  // ---- offseason report, built before identities move ----
  const report={user:null, improved:[], unchanged:[], declined:[],
                avgBefore:0, avgAfter:0};
  let tb=0, ta=0;
  S.teams.forEach(t=>{
    const o=t.pre, n={rolls:t.rolls,cal:t.cal,def:t.def};
    const oldR=o.rolls+o.cal*3+o.def, newR=n.rolls+n.cal*3+n.def;
    tb+=oldR; ta+=newR;
    const kind = (n.rolls>o.rolls||n.cal>o.cal||n.def>o.def) ? 'improved'
               : (n.rolls<o.rolls||n.cal<o.cal||n.def<o.def) ? 'declined' : 'unchanged';
    const row={name:t.name, ab:t.ab, id:t.id, conf:t.conf,
               from:[o.rolls,o.cal,o.def], to:[n.rolls,n.cal,n.def],
               rec:`${t.w}-${t.l}`, why:t.drift||'Normal roster turnover', kind};
    if(t.user) report.user=row; else report[kind].push(row);
  });
  report.avgBefore=(tb/S.teams.length).toFixed(2);
  report.avgAfter =(ta/S.teams.length).toFixed(2);
  report.counts={improved:report.improved.length,
                 unchanged:report.unchanged.length,
                 declined:report.declined.length};
  ['improved','unchanged','declined'].forEach(k=>
    report[k].sort((a,b)=>a.name.localeCompare(b.name)));
  report.recruit = recruit;
  report.boost = S.lastBoost;

  // shuffle identities within each conference for schedule variance
  const swaps = S.settings.confSwap!==false ? swapAllConferences() : 0;

  resetSeason();
  S.lastReport=report;
  return {fired, rev, wins, cc, natty, before, after:meAfter, renewed, swaps,
          rating:c.rating, fireLine:c.fireLine, report, expMiss, recruit, expiring,
          capped: c.seasons>=MAX_SEASONS};
}

/* resign mid-career: $25 and half your rating (ResignBtn_Click) */
function resign(){
  const c=S.coach;
  S.money-=25;
  c.rating=Math.trunc(c.rating/2);
  S.teams[S.me].user=false;
  S.phase='fired';
  S.resigned=true;
}

/* ============================================================
   RUN SCORE + HIGH SCORES  (CalculateRunScore / SaveHighScore)
   Wins are worth more at a weak program: each one pays
   10,000 minus 100 per point of team rating.
   ============================================================ */
function calcRunScore(){
  if(S.me<0) return S.runScore||0;
  const t=S.teams[S.me], c=S.coach;
  const R=overallRating(t);
  let n = c.w * (10000 - R*100);
  const g=c.w+c.l;
  if(g>0) n += Math.round((c.w/g)*100);
  n += (c.po1||0)*1000;
  n += (c.poQ||0)*1500;
  n += (c.poS||0)*2000;
  n += (c.runnerUps||0)*2500;
  n += (c.natties||0)*10000;
  n += (c.rating||0)*100;
  return Math.max(0, Math.round(n));   // a run never scores below zero
}

/* ------------------------------------------------------------
   Storage adapter. Inside the Claude app window.storage exists;
   hosted anywhere else it does not, so fall back to localStorage
   and finally to memory so nothing throws.
   ------------------------------------------------------------ */
const STORE = (function(){
  try{
    if(typeof window!=='undefined' && window.storage &&
       typeof window.storage.get==='function') return window.storage;
  }catch(e){}
  try{
    const ls = (typeof localStorage!=='undefined') ? localStorage : null;
    if(ls){
      ls.setItem('cfb59:probe','1'); ls.removeItem('cfb59:probe');
      return {
        get:async k=>{ const v=ls.getItem(k); return v===null?null:{key:k,value:v}; },
        set:async(k,v)=>{ ls.setItem(k,String(v)); return {key:k,value:v}; },
        delete:async k=>{ ls.removeItem(k); return {key:k,deleted:true}; }
      };
    }
  }catch(e){}
  const mem={};
  return {
    get:async k=>k in mem?{key:k,value:mem[k]}:null,
    set:async(k,v)=>{mem[k]=String(v);return{key:k,value:v};},
    delete:async k=>{delete mem[k];return{key:k,deleted:true};}
  };
})();

/* ============================================================
   ACHIEVEMENTS
   These outlive a career — they are kept alongside the high
   scores, not in the save, so they accumulate across every run.
   ============================================================ */
const ACH_KEY='cfb59:achievements';
let ACH={};
const ACHIEVEMENTS=[
  // a single season
  {id:'unbeaten', g:'Season', n:'Perfect Regular Season', d:'Win all twelve'},
  {id:'perfect',  g:'Season', n:'Perfect Season',  d:'Undefeated, national title included'},
  {id:'score60',  g:'Season', n:'Hang Sixty',      d:'Score 60 in a game'},
  {id:'blow40',   g:'Season', n:'Running Clock',   d:'Win by 40'},
  {id:'shutRank', g:'Season', n:'Blackout',        d:'Shut out a ranked team'},
  {id:'giant',    g:'Season', n:'Giant Killer',    d:'Beat a top-five team while unranked'},
  {id:'marathon', g:'Season', n:'Marathon',        d:'Win in triple overtime'},
  {id:'streak15', g:'Season', n:'Unstoppable',     d:'Win fifteen straight'},
  // one per conference
  ...CONF_KEYS.map(c=>({id:'conf_'+c, g:'Conferences',
    n:CONF[c].n+' Champion', d:'Win the '+c+' title'})),
  // a whole career
  {id:'natty1',   g:'Career', n:'National Champion', d:'Win it all once'},
  {id:'natty3',   g:'Career', n:'Dynasty',           d:'Win it all three times'},
  {id:'w100',     g:'Career', n:'Century',           d:'100 career wins'},
  {id:'w250',     g:'Career', n:'Institution',       d:'250 career wins'},
  {id:'lifer',    g:'Career', n:'Lifer',             d:'Coach all thirty seasons'},
  {id:'schools4', g:'Career', n:'Journeyman',        d:'Coach four different programs'},
  {id:'twoSchools',g:'Career',n:'Portable Winner',   d:'Win a conference title at two schools'},
  {id:'g5natty',  g:'Career', n:'Cinderella',        d:'Win the national title outside the Power Four'},
  {id:'loaded',   g:'Career', n:'Loaded',            d:'Build a 15 / 6 / 8 roster'},
  {id:'rating4k', g:'Career', n:'Untouchable',       d:'Reach a coach rating of 4,000'},
  {id:'fired',    g:'Career', n:'Shown the Door',    d:'Get fired'},
  {id:'survivor', g:'Career', n:'Survivor',          d:'Reach ten seasons without being fired'}
];
async function loadAch(){
  try{ const r=await STORE.get(ACH_KEY); if(r&&r.value) ACH=JSON.parse(r.value)||{}; }catch(e){}
}
function unlockAch(id){
  if(ACH[id]) return false;
  const meta=ACHIEVEMENTS.find(a=>a.id===id); if(!meta) return false;
  ACH[id]={year:S.year, team:S.me>=0?S.teams[S.me].name:'', coach:S.coach.name||'Coach'};
  try{ STORE.set(ACH_KEY, JSON.stringify(ACH)); }catch(e){}
  if(typeof toast==='function') toast('Achievement: '+meta.n);
  return true;
}
/* Evaluated from live state, so it can be called freely. */
function checkAchievements(g){
  if(S.me<0) return;
  const c=S.coach, me=S.teams[S.me];
  if(g && (g.aid===S.me || g.hid===S.me)){
    const mine = g.aid===S.me ? g.aScore : g.hScore;
    const them = g.aid===S.me ? g.hScore : g.aScore;
    const opp  = S.teams[g.aid===S.me ? g.hid : g.aid];
    if(mine>them){
      if(mine>=60) unlockAch('score60');
      if(mine-them>=40) unlockAch('blow40');
      if(them===0 && opp.rank<=25) unlockAch('shutRank');
      if(opp.rank<=5 && me.rank>25) unlockAch('giant');
      if(g.ot>=3) unlockAch('marathon');
    }
  }
  if((me.streak||0)>=15) unlockAch('streak15');
  if(me.rolls>=MAX_ROLL && me.cal>=MAX_CAL && me.def>=MAX_DEF) unlockAch('loaded');
  if((c.rating||0)>=4000) unlockAch('rating4k');
  if(c.w>=100) unlockAch('w100');
  if(c.w>=250) unlockAch('w250');
  if(c.natties>=1) unlockAch('natty1');
  if(c.natties>=3) unlockAch('natty3');
  if(c.seasons>=MAX_SEASONS) unlockAch('lifer');
  if(c.seasons>=10 && !c.everFired) unlockAch('survivor');
  const schools=new Set((c.resume||[]).map(r=>r.team));
  if(schools.size>=4) unlockAch('schools4');
  const confWinners=new Set((c.trophies||[]).filter(t=>t.n!==10).map(t=>t.team));
  if(confWinners.size>=2) unlockAch('twoSchools');
}

const SCORES_KEY='cfb59:scores';
function ensureSession(){
  if(!S.sid) S.sid=String(Math.floor(Math.random()*900000)+100000);
  return S.sid;
}
async function saveHighScore(){
  if(S.unranked || S.me<0) return false;
  ensureSession();
  const entry={
    sid:S.sid, score:calcRunScore(), coach:S.coach.name||'Coach',
    team:S.teams[S.me].name, w:S.coach.w, l:S.coach.l,
    nc:S.coach.natties, cc:S.coach.titles, po:S.coach.poApps||0,
    seasons:S.coach.seasons, rating:S.coach.rating,
    date:new Date().toISOString().slice(0,10)
  };
  let list=await loadHighScores();
  const i=list.findIndex(x=>x.sid===entry.sid);
  if(i>=0){ if(entry.score>=list[i].score) list[i]=entry; }
  else list.push(entry);
  list.sort((a,b)=>b.score-a.score);
  list=list.slice(0,25);
  try{ await STORE.set(SCORES_KEY, JSON.stringify(list)); }catch(e){ return false; }
  return true;
}

    const r=await STORE.get(SCORES_KEY);

/* ---------- season calendar (v1.40) ----------
   Week 1 lands on the last Saturday of August, matching the real
   opening-weekend cadence; every later week is seven days on. */
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function satOfWeek(w, year){
  const y = year!=null ? year : S.year;
  const d = new Date(y, 7, 31);                 // Aug 31
  d.setDate(31 - ((d.getDay()+1)%7));           // back up to the Saturday
  d.setDate(d.getDate() + (w-1)*7);
  return d;
}
const weekDateLong  = w => { const d=satOfWeek(w); return `Saturday, ${MON3[d.getMonth()]} ${d.getDate()}`; };
const weekDateShort = w => { const d=satOfWeek(w); return `${MON3[d.getMonth()].toUpperCase()} ${d.getDate()}`; };
const weekDateSlash = w => { const d=satOfWeek(w); return `${d.getMonth()+1}/${d.getDate()}`; };

/* ---------- broadcast slots (v1.40) ----------
   Deterministic per (year, week, matchup) so the listing never
   reshuffles between renders or after a reload. */
function gHash(w,aid,hid){
  let x=((S.year*7919 + w*911 + aid*127 + hid*31)>>>0)||1;
  x^=x<<13; x>>>=0; x^=x>>>17; x^=x<<5; return x>>>0;
}
const TV_MARQUEE=[['3:30 PM','CBS'],['4:00 PM','FOX'],['7:00 PM','ABC'],
                  ['7:30 PM','NBC'],['8:00 PM','ESPN']];
const TV_RANKED =[['12:00 PM','ESPN'],['12:00 PM','FOX'],['3:00 PM','NBC'],
                  ['3:30 PM','ESPN2'],['5:30 PM','CBSSN'],['7:00 PM','ESPN']];
const TV_REST   =[['12:00 PM','ESPN2'],['12:00 PM','FS1'],['1:00 PM','CBSSN'],
                  ['3:00 PM','FS1'],['5:30 PM','CBSSN'],['10:30 PM','ESPN2']];
function tvSlot(w,aid,hid){
  const best=Math.min(S.teams[aid].rank||99, S.teams[hid].rank||99);
  const pool = (w>REG_WEEKS || best<=15) ? TV_MARQUEE
             : best<=25 ? TV_RANKED : TV_REST;
  return pool[gHash(w,aid,hid)%pool.length];
}

/* ---------- betting lines (v1.40) ----------
   Spread comes straight from prepGame's engine math, then gets pinned
   at 65.5 — the runaway-score limits mean nothing should honestly hang
   a bigger number than that on the board. Totals use expected points
   per possession off the dice grid; moneyline is derived from the
   spread and goes off the board past 32. */
const SPREAD_CAP = 65.5;
const EV_PP = {1:1.42, 2:2.00, 3:2.33, 4:2.78, 5:3.19, 6:4.42};
const r05 = v => Math.round(v*2)/2;
function lineFor(aid,hid,neutral){
  const g=prepGame(aid,hid,{neutral});
  // Expected margin from the dice grid itself, not the VB6 display
  // coefficients — those overshoot real margins by nearly 2x in
  // mismatches (7 pts per caliber step vs ~4.5 the grid actually pays).
  const raw=g.hRem*EV_PP[g.hOC]-g.aRem*EV_PP[g.aOC];
  let sp=r05(raw);
  if(sp> SPREAD_CAP) sp= SPREAD_CAP;
  if(sp<-SPREAD_CAP) sp=-SPREAD_CAP;
  const tot=Math.floor(g.aRem*EV_PP[g.aOC]+g.hRem*EV_PP[g.hOC])+0.5;
  const mag=Math.abs(sp);
  const p=Math.min(.5+mag*.025,.955);
  const ml= mag>=28 ? null : Math.max(100,Math.round(p/(1-p)*20)*5);
  return {sp,tot,ml,capped:Math.abs(raw)>SPREAD_CAP,g};
}
function fmtSpread(sp){ return Number.isInteger(sp)?sp.toFixed(0):sp.toFixed(1); }
let OPEN_ODDS=null;
function toggleOdds(k){ OPEN_ODDS = OPEN_ODDS===k?null:k; render(); }
function oddsStrip(aid,hid,neutral,key){
  const A=S.teams[aid], H=S.teams[hid];
  const L=lineFor(aid,hid,neutral);
  const fav=L.sp>0?H:A, dog=L.sp>0?A:H;
  const sTxt=L.sp===0?'<b>PK</b>':`<b>${esc(fav.ab)} -${fmtSpread(Math.abs(L.sp))}</b>`;
  const mTxt=L.sp===0?'<b>EVEN</b>'
    : L.ml==null?`<b>${esc(dog.ab)} OFF</b>`:`<b>${esc(dog.ab)} +${L.ml}</b>`;
  const open = S.mode!=='gambler' && OPEN_ODDS===key;
  const det = open?`<div class="sb-odds-x">Proj: ${esc(A.ab)} ${L.g.aRem} poss · cal ${L.g.aOC}
      &nbsp;—&nbsp; ${esc(H.ab)} ${L.g.hRem} poss · cal ${L.g.hOC}${
      L.capped?' &nbsp;·&nbsp; line capped at 65.5':''}</div>`:'';
  return `<div class="sb-odds" ${S.mode==='gambler'?'style="cursor:default"'
    :`onclick="event.stopPropagation();toggleOdds('${key}')"`}>
      <span>Spread: ${sTxt}</span><span class="dot">•</span>
      <span>Total: <b>${L.tot.toFixed(1)}</b></span><span class="dot">•</span>
      <span>ML: ${mTxt}</span>
      ${S.mode==='gambler'?'':`<span class="car">${open?'▴':'▾'}</span>`}
    </div>${det}`;
}

let SCORE_SHOWN=null, SCORE_TIMER=null;
function animateScore(target){
  const el=$('hScore'); if(!el) return;
  if(SCORE_SHOWN===null) SCORE_SHOWN=target;
  clearInterval(SCORE_TIMER);
  const paint=v=>{ el.textContent=v.toLocaleString(); };
  if(SCORE_SHOWN===target){ paint(target); return; }
  const step=Math.sign(target-SCORE_SHOWN)*(Math.floor(Math.abs(target-SCORE_SHOWN)/20)+1);
  el.classList.add('tick');
  SCORE_TIMER=setInterval(()=>{
    SCORE_SHOWN+=step;
    if((step>0&&SCORE_SHOWN>=target)||(step<0&&SCORE_SHOWN<=target)){
      SCORE_SHOWN=target; clearInterval(SCORE_TIMER);
      setTimeout(()=>el.classList.remove('tick'),400);
    }
    paint(SCORE_SHOWN);
  },40);
}

function go(t){ TAB=t; const v=$('view'); if(v) v.scrollTop=0; render(); }
function render(){
  // every render replaces the whole view, so hold the scroll position or
  // the screen jumps on each possession
  const vp=$('view');
  const keepY = vp ? vp.scrollTop : 0;
  if(SPLASH){ paintSplash(); return; }
  paintChrome();
  const restore=()=>{ if(vp && keepY) vp.scrollTop=keepY; };
  if(S.mode==='gambler'){
    if(LIVE){ $('view').innerHTML=viewLive(); restore(); return; }
    if(SCHED_PAGE){ $('view').innerHTML=viewSchedulePage(); restore(); save(); return; }
    if(S.phase==='offseason'){ $('view').innerHTML=viewGamblerOffseason(); restore(); save(); return; }
    $('view').innerHTML=({week:viewGamblerWeek,news:viewNews,league:viewLeague,bets:viewBets,
      history:viewHistory,settings:viewSettings}[TAB]||viewGamblerWeek)();
    restore(); save(); return;
  }
  // These come first: between jobs you still have a career, and losing your
  // team is not the same as not having started one. Checking S.me<0 ahead of
  // them sent a fired coach back to the hire screen.
  if(S.phase==='retired'){
    $('view').innerHTML = TAB==='history' ? viewHistory() : viewRetired();
    save(); return;
  }
  if(S.phase==='offers'){ $('view').innerHTML=viewOffers(); save(); restore(); return; }
  if(S.phase==='unemployed'){ $('view').innerHTML=viewUnemployed(); save(); restore(); return; }
  if(S.phase==='fired'){ $('view').innerHTML=viewFired(); restore(); return; }

  if(S.me<0){ $('view').innerHTML=viewPick(); restore(); return; }
  if(LIVE){ $('view').innerHTML=viewLive(); restore(); return; }
  if(SCHED_PAGE){ $('view').innerHTML=viewSchedulePage(); restore(); save(); return; }
  if(EDITOR){ $('view').innerHTML=viewEditor(); save(); restore(); return; }
  if(S.phase==='offseason'){ $('view').innerHTML=viewOffseason(); restore(); return; }
  $('view').innerHTML={week:viewWeek,news:viewNews,team:viewTeam,league:viewLeague,
                       history:viewHistory,coach:viewCoach,
                       settings:viewSettings}[TAB]();
  restore();
  save();
}

    <p class="eyebrow">Or skip the sideline</p>
    <h2 class="sec" style="margin-top:0">The Gambler</h2>
    <p class="note">No program, no film room, no ratings sheet — those are hidden from you
    for good. $5,000, a weekly board of lines, and a $${MIN_BET} minimum. The league runs
    itself; you just pick winners. Uses the name above if you've typed one.</p>
    <button class="btn ghost" style="margin-top:11px" onclick="startGambler()">Start with $5,000</button>
  </div>`;
}
function choose(id){
  const nm=($('cname')?.value||'').trim();
  S.coach.name = nm || 'Coach';
  S.coach.archetype = PICK_ARCH;
  S.me=id; S.teams[id].user=true;
  S.phase='season';
  const pk=coachPackage(S.teams[id]);
  S.money=0; S.ledger=[]; credit(pk.cash, 'Starting budget');
  S.pep={cal:pk.pep.cal, roll:pk.pep.roll, def:pk.pep.def};
  S.coach.objBonus=pk.obj;
  S.unranked = false;          // every start is from the same pool now
  // shuffle everyone else's slots so a new dynasty isn't the same schedule
  if(S.settings.confSwap!==false) swapAllConferences();
  updateRanks(); buildSchedule();
  signContract(pk.contract);
  TAB='week'; render();
  sheet(`<h3>${esc(S.teams[id].name)}</h3>
    <p class="note">${pk.tier} job · ${CONF[S.teams[id].conf].n}${
      CONF[S.teams[id].conf].p?' · Power 4':' · Group of 5'}</p>
    <div class="row2" style="margin-top:12px">
      <div class="stat"><div class="k">Starting cash</div><div class="v amber">$${pk.cash}</div></div>
      <div class="stat"><div class="k">Contract</div><div class="v">${pk.contract} yrs</div></div>
    </div>
    <div class="card" style="margin-top:10px;padding:6px 13px"><table>
      <tr><th>Pep talks banked</th><th class="num">Qty</th></tr>
      <tr><td class="tname">Possession</td><td class="num">${pk.pep.roll}</td></tr>

let BOARD_FILTER='feat', LOOK_WEEK=null;
function setLookWeek(w){ LOOK_WEEK = (w===S.week?null:w);
  const v=$('view'); if(v) v.scrollTop=0; render(); }

function viewPreseason(){
  const me=S.teams[S.me];
  const booked=cupcakeCount();

        text-transform:uppercase">Guarantee games</span>

        ${booked} of 2 booked</span>
    </div>
    <p class="note" style="margin:6px 0 0">A big program pays <b>$${CUPCAKE_FEE}</b> to host you

  </div>`:''}

  <p class="eyebrow" style="margin:16px 0 8px">Your non-conference weeks</p>

      const g=me.sched[w];

/* the list of hosts is scoped to one week, which is how you actually think about it */
function openCupcakeWeek(w){
  const me=S.teams[S.me];
  const list=cupcakeOptions().filter(o=>o.week===w)
    .sort((a,b)=>strength(S.teams[b.id])-strength(S.teams[a.id]));
  const cur=S.teams[me.sched[w].opp];
  sheet(`<h3>Week ${w}</h3>
    <p class="note">Currently ${me.sched[w].home?'hosting':'at'} <b>${esc(cur.name)}</b>.
    Pick a program to visit instead — they pay $${CUPCAKE_FEE} for the trip.</p>
    <div style="margin-top:12px;max-height:52vh;overflow-y:auto">
    ${canFlipForPay(w)?`<button class="pick" style="border-color:var(--amber)" onclick="closeSheet();doFlip(${w})">
      ${badge(cur)}
      <div class="pick-n">
        <div class="t">Play at ${esc(cur.name)} instead</div>
        <div class="s">Same opponent, just move the game to their field</div>
      </div>
      <div class="stars" style="color:var(--amber)">$${CUPCAKE_FEE}</div>
    </button>`:''}
    ${list.length ? list.map(o=>{
      const x=S.teams[o.id];
      return `<button class="pick" onclick="takeCupcake(${w},${o.id})">
        ${badge(x)}
        <div class="pick-n">
          <div class="t">at ${esc(x.name)}</div>
          <div class="s">${x.rolls}/${x.cal}/${x.def} · ${CONF[x.conf].n}</div>
        </div>
        <div class="stars" style="color:var(--amber)">$${o.fee}</div>
      </button>`;
    }).join('') : (canFlipForPay(w)?'' : '<p class="note">Nothing available this week that keeps the schedule legal.</p>')}
    </div>
    <button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">Never mind</button>`);
}

function doFlip(w){

}
function takeCupcake(w,x){

}
function startSeason(){ S.preseasonDone=true; render(); }

function viewWeek(){
  const me=S.teams[S.me];
  if(S.week===1 && !S.preseasonDone && S.phase==='season') return viewPreseason();

  // looking back at a week already played: results only, nothing actionable
  if(LOOK_WEEK && LOOK_WEEK!==S.week){
    const e=me.sched[LOOK_WEEK];
    let hb=`<p class="eyebrow">${weekName(LOOK_WEEK)} · ${S.year}</p>`+weekPicker();
    if(e && e.played){
      const o=S.teams[e.opp];
      hb+=`<div class="card center">
        <p class="eyebrow" style="margin:0 0 5px">Your game</p>
        <div style="font-family:var(--disp);font-size:27px;letter-spacing:.03em;
          color:${e.won?'var(--win)':'var(--brick)'}">${e.won?'W':'L'} ${e.pf}-${e.pa}</div>
        <p class="note">${e.won?'Beat':'Lost to'} ${esc(o.name)}${
          e.ot?` in ${otLabel(e.ot).toLowerCase()}`:''}</p>
        ${boxStored(me,LOOK_WEEK)}
      </div>`;
    }else{
      hb+=`<div class="card center"><p class="note">You had no game that week.</p></div>`;
    }
    return hb + scoreboardFor(LOOK_WEEK);
  }

  const m=userGameThisWeek();
  let h=`<p class="eyebrow">${weekName(S.week)} · ${S.year}</p>`+weekPicker();
  if(S.week===1 && S.pepGift) h+=`<div class="card" style="border-color:var(--win);padding:10px 12px">
    <p class="eyebrow" style="margin:0 0 3px;color:var(--win)">Your staff delivers</p>
    <p class="note" style="margin:0">${Object.entries(S.pepGift)
      .map(([k,n])=>`+${n} ${({roll:'possession',cal:'caliber',def:'defense'})[k]}`)
      .join(', ')} pep talk${Object.keys(S.pepGift).length>1?'s':''} for the season.</p></div>`;
  if(S.lastEvent) h+=`<div class="card" style="border-color:${
      S.lastEvent.kind==='perm'?'var(--brick)':'var(--amber)'};padding:10px 12px">
    <p class="eyebrow" style="margin:0 0 3px;color:${
      S.lastEvent.kind==='perm'?'var(--brick)':'var(--amber)'}">${
      S.lastEvent.kind==='perm'?'Program news':'Injury report'}</p>
    <p class="note" style="margin:0">${esc(S.lastEvent.msg)}</p></div>`;
  if(S.tempCal>0||S.tempDef>0) h+=`<div class="injbar">
    ${S.tempCal>0?`<span class="inj">-1 CAL · ${S.tempCal} wk</span>`:''}
    ${S.tempDef>0?`<span class="inj">-1 DEF · ${S.tempDef} wk</span>`:''}</div>`;

  if(m){
    h+=preGameCard(m);
  }else{
    const done=me.sched[S.week]?.played;
    const alive=S.phase==='playoff'&&S.playoff&&
      (S.playoff.byes?.includes(S.me)||S.playoff.results.some(r=>
        (r.aid===S.me&&r.a>r.h)||(r.hid===S.me&&r.h>r.a)));
    const title = done?'Your result'
      : S.phase!=='playoff' ? 'Open date'
      : alive ? 'First-round bye' : 'Your season is over';
    h+=`<div class="card center">
      <h2 class="sec" style="margin-top:0">${title}</h2>
      ${done?lastLine()+boxStored(me,S.week):`<p class="note">${S.phase!=='playoff'?'No game this week.'
        :alive?'You are through to the next round.':'Watch the bracket finish without you.'}</p>`}
    </div>`;
  }
  const left=gamesLeft();
  h+=`<div class="stickybar"><button class="btn" onclick="finishWeek()">
      ${left?`Sim remaining ${left} and advance`:'Advance to next week'}</button></div>`;
  h+=scoreboard();
  return h;
}

function preGameCard(m){
  const me=S.teams[S.me];
  const g=prepGame(m.aid,m.hid,{neutral:m.neutral,week:S.week});
  const A=S.teams[m.aid], H=S.teams[m.hid];
  const iAmAway=m.aid===S.me;
  const opp=iAmAway?H:A;
  let spr=r05(g.hRem*EV_PP[g.hOC]-g.aRem*EV_PP[g.aOC]);
  if(spr> SPREAD_CAP) spr= SPREAD_CAP;
  if(spr<-SPREAD_CAP) spr=-SPREAD_CAP;
  const fav=spr>0?H:A, dog=spr>0?A:H;
  const tot=Math.floor(g.aRem*EV_PP[g.aOC]+g.hRem*EV_PP[g.hOC])+0.5;
  const mag=Math.abs(spr);
  const mlP=Math.min(.5+mag*.025,.955);
  const ml= mag>=28 ? null : Math.max(100,Math.round(mlP/(1-mlP)*20)*5);
  const [kickTime,kickNet]=tvSlot(S.week,m.aid,m.hid);
  const oddsHtml=`<div class="sb-odds still">
      <span>Spread: <b>${spr===0?'PK':esc(fav.ab)+' -'+fmtSpread(mag)}</b></span><span class="dot">•</span>
      <span>Total: <b>${tot.toFixed(1)}</b></span><span class="dot">•</span>
      <span>ML: <b>${spr===0?'EVEN':ml==null?esc(dog.ab)+' OFF':esc(dog.ab)+' +'+ml}</b></span>
    </div>`;

  let h='';
  if(isCCG(S.week) && confBadge(me.conf,40)){
    h+=`<div class="card ccg-head">
      ${confBadge(me.conf,44)}
      <div><div class="ccg-t">${esc(CONF[me.conf].n)}</div>
        <div class="ccg-s">Championship Game</div></div>
    </div>`;
  }
  h+=`<div class="card">
    <div style="display:flex;align-items:center;gap:11px;cursor:pointer" onclick="showTeam(${opp.id})">
      ${badge(opp)}
      <div style="flex:1;min-width:0">
        <div style="font-family:var(--disp);font-size:19px;letter-spacing:.03em;text-transform:uppercase">
          ${m.neutral?'vs':iAmAway?'at':'vs'} ${esc(opp.name)}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--dim)">
          ${rankTag(opp)}${recOf(opp)} · ${CONF[opp.conf].n}${m.neutral?' · neutral site':''}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--dim-2);margin-top:2px">
          ${weekDateLong(S.week).replace('Saturday','Sat')} · ${kickTime} · ${kickNet}</div>
      </div>
    </div>
    <table style="margin-top:12px">
      <tr><th></th><th class="num">Poss</th><th class="num">Cal</th><th class="num">Def</th></tr>
      <tr class="${iAmAway?'me':''}"><td class="tname">${esc(A.ab)}</td>
        <td class="num">${statNum(g.aRem,0)}</td>
        <td class="num">${statNum(g.aOC,g.mods.a.cal)}</td>
        <td class="num">${statNum(g.aDef,0)}</td></tr>
      <tr class="${iAmAway?'':'me'}"><td class="tname">${esc(H.ab)}</td>
        <td class="num">${statNum(g.hRem,0)}</td>
        <td class="num">${statNum(g.hOC,g.mods.h.cal)}</td>
        <td class="num">${statNum(g.hDef,0)}</td></tr>
    </table>
    ${S.settings.quarters!==false?`<p class="spread" style="margin:8px 0 0">
      Possessions by quarter — ${esc(A.ab)} ${g.aQ.join('/')} · ${esc(H.ab)} ${g.hQ.join('/')}</p>`:''}
    <div style="margin:9px 0 0">${oddsHtml}</div>
    ${S.oppPep?`<p class="note" style="margin:7px 0 0;color:var(--brick)">
      ${esc(opp.name)} have prepared — +1 ${
        {rolls:'possession',cal:'caliber',def:'defense'}[S.oppPep.stat]} for them this week.</p>`:''}
    ${g.notes.length?`<div class="log" style="max-height:78px;margin-top:8px">${
      g.notes.map(n=>`<div>${esc(n)}</div>`).join('')}</div>`:''}
  </div>`;

  const anyPep=(S.pep.cal||0)+(S.pep.roll||0)+(S.pep.def||0)>0;
  if(anyPep){
    h+=`<div class="card"><p class="eyebrow">Pep talks — one game only</p>
      ${['cal','roll','def'].map(k=>{
        const lbl={cal:'+1 Caliber',roll:'+1 Possession',def:'+1 Defense'}[k];
        if((S.pep[k]||0)<1)return '';
        const useful = pepHelps(k, m);
        return `<div class="buy"><div class="buy-i"><div class="t">${lbl}</div>
          <div class="d">${useful ? `${S.pep[k]} in reserve`
            : `<span style="color:var(--dim-2)">No edge in this matchup — the adjustments cancel it</span>`}</div></div>
          <button class="${S.pepOn[k]?'can':''}" ${useful?'':'disabled'}
            onclick="togglePep('${k}')">${S.pepOn[k]?'On':useful?'Use':'—'}</button></div>`;
      }).join('')}</div>`;
  }

  h+=`<button class="btn" onclick="playGame(${m.aid},${m.hid},${m.neutral})">Play the game</button>
    <div class="speed" style="margin-top:8px">
      <button class="${S.settings.roll!=='auto'?'on':''}" onclick="setRollMode('manual')">I roll each possession</button>
      <button class="${S.settings.roll==='auto'?'on':''}" onclick="setRollMode('auto')">Auto-roll</button>
    </div>
    <button class="btn ghost" style="margin-top:10px" onclick="simGame(${m.aid},${m.hid},${m.neutral})">Sim it instantly</button>`;
  return h;
}

/* ---------- ESPN-style scoreboard for the whole week ---------- */
function weekPicker(){
  const cur=S.week, shown=LOOK_WEEK||cur;
  const weeks=[]; for(let w=1;w<=cur;w++) weeks.push(w);
  if(weeks.length<2) return '';
  return `<div class="weekpick wk2">${weeks.map(w=>`
    <button class="${shown===w?'on':''}" onclick="setLookWeek(${w})">
      <span class="wk-t">${w<=REG_WEEKS?'Week '+w:periodLabelShort(w)}</span>
      <span class="wk-d">${weekDateShort(w)}</span>
    </button>`).join('')}</div>`;
}

function scoreboardFor(w){
  const saved=S.week; S.week=w;
  try{ return scoreboard(true); } finally { S.week=saved; }
}

function scoreboard(historic){
  const all=weekBoard();
  if(!all.length) return '';
  const mine=g=>g.aid===S.me||g.hid===S.me;
  const bestRank=g=>Math.min(S.teams[g.aid].rank||999, S.teams[g.hid].rank||999);

  const myConf = S.me>=0 ? S.teams[S.me].conf : null;
  let list=all.filter(g=>!mine(g));
  if(BOARD_FILTER==='feat') list=list.filter(g=>bestRank(g)<=25);
  else if(BOARD_FILTER==='conf' && myConf){
    list=list.filter(g=>S.teams[g.aid].conf===myConf||S.teams[g.hid].conf===myConf);
  }
  list.sort((x,y)=>(x.played-y.played)||bestRank(x)-bestRank(y));

  const counts={feat:all.filter(g=>!mine(g)&&bestRank(g)<=25).length,
                conf:myConf?all.filter(g=>!mine(g)&&(S.teams[g.aid].conf===myConf||
                     S.teams[g.hid].conf===myConf)).length:0,
                all:all.length-all.filter(mine).length};

  let h=`<h2 class="sec">Around the country</h2>
    <div class="speed" style="margin-bottom:10px">
      ${[['feat','Ranked',counts.feat],...(myConf?[['conf','My conf',counts.conf]]:[]),['all','All',counts.all]]
        .map(([k,l,n])=>`<button class="${BOARD_FILTER===k?'on':''}"
          onclick="setBoard('${k}')">${l} ${n}</button>`).join('')}
    </div>`;

  if(!list.length){
    h+=`<div class="card center"><p class="note">No games match that filter this week.</p></div>`;
  }else{
    h+=`<div class="sb"><div class="sb-date">${weekDateLong(S.week)}</div>${
      list.map(g=>gameRow(g,historic)).join('')}</div>`;
  }

  return h;
}

function gameRow(g, historic){
  const A=S.teams[g.aid], H=S.teams[g.hid];
  const aw=g.played&&g.a>g.h, hw=g.played&&g.h>g.a;
  const side=(t,score,win)=>`
    <div class="sb-team ${win?'win':''}">
      ${badge(t,24)}
      <span class="sb-rk">${t.rank<=25?t.rank:''}</span>
      <span class="sb-nm" onclick="event.stopPropagation();showTeam(${t.id})">${esc(t.name)}</span>
      <span class="sb-rec">${recOf(t)}</span>
      <span class="sb-sc">${g.played?score:''}</span>
    </div>`;
  const openable = g.played && A.sched[S.week]?.q;
  const open = OPEN_BOX===('sb:'+g.aid+':'+S.week);
  const otN = g.played ? (A.sched[S.week]?.ot||0) : 0;
  const [kt,net]=tvSlot(S.week,g.aid,g.hid);
  const status=g.played
    ? `<span class="sb-final">${open?'▾':(otN?'Final/'+otLabel(otN):'Final')}</span>`
    : historic ? `<span class="sb-pend">—</span>`
    : `<span class="sb-when">Sat, ${weekDateSlash(S.week)}</span>
       <span class="sb-when b">${kt}</span>
       <span class="sb-net">${net}</span>
       <span class="sb-go">Watch ▸</span>`;
  const ccgTag = isCCG(S.week) && A.conf===H.conf
    ? `<span class="sb-ccg">${confBadge(A.conf,14)}${A.conf}</span>` : '';
  const showOdds = !g.played && !historic;
  return `<div class="sb-item">
    <div class="sb-game ${g.played?'done':''} ${showOdds?'has-odds':''}"
      ${g.played
        ? (openable?`onclick="toggleBox('sb:${g.aid}',${S.week})"`:'')
        : historic ? '' : `onclick="playGame(${g.aid},${g.hid},${g.neutral})"`}
      style="${openable?'cursor:pointer':''}">
      <div class="sb-teams">${side(A,g.a,aw)}${side(H,g.h,hw)}</div>
      <div class="sb-status">${status}${ccgTag||(g.neutral?'<span class="sb-nt">neutral</span>':'')}</div>
    </div>
    ${showOdds?oddsStrip(g.aid,g.hid,g.neutral,'od:'+g.aid+':'+S.week):''}
    ${open?`<div class="sc-box">${boxStored(A,S.week)}</div>`:''}
  </div>`;
}
function setBoard(k){ BOARD_FILTER=k; render(); }

function lastLine(){
  const r=S.lastResult; if(!r)return '';
  return `<div style="font-family:var(--disp);font-size:27px;letter-spacing:.03em;
    color:${r.won?'var(--win)':'var(--brick)'}">${r.won?'W':'L'} ${r.pf}-${r.pa}</div>
    <p class="note">${r.won?'Beat':'Lost to'} ${esc(r.opp)}${r.ot?(r.ot===1?' in overtime':` in ${r.ot} overtimes`):''}${
      r.pay?` · $${r.pay}`:''}</p>`;
}

function togglePep(k){
  const m=userGameThisWeek();
  if(!S.pepOn[k] && !pepHelps(k,m)) return toast('That would not change anything here.');
  S.pepOn[k]=!S.pepOn[k]; render();
}

/* ============================================================
   LIVE GAME
   ============================================================ */
function playGame(aid,hid,neutral){
  const g=prepGame(aid,hid,{neutral:!!neutral,week:S.week});
  LIVE={g,last:null,done:false,running:S.settings.roll==='auto',
        cpu:(aid!==S.me&&hid!==S.me)};
  render();
  if(LIVE.running) scheduleTick();
}
function simGame(aid,hid,neutral){
  const g=prepGame(aid,hid,{neutral:!!neutral,week:S.week});
  autoPlay(g); applyResult(g); updateRanks();
  if(aid===S.me||hid===S.me){
    jobWarningCheck();
    const r=S.lastResult;
    if(r) toast(`${r.won?'Won':'Lost'} ${r.pf}-${r.pa}${r.pay?` · +$${r.pay}`:''}`);
  }
  render();
}
function scheduleTick(){
  clearTimeout(LIVE_TIMER);
  LIVE_TIMER=setTimeout(tick,S.settings.autoMs);
}
function tick(){
  if(!LIVE||!LIVE.running)return;
  if(step()) scheduleTick();
}
/* run one possession; false once the game is finished */
function step(){
  const g=LIVE.g;
  if(g.pending2){
    const pl=resolve2pt(g);
    LIVE.last=Object.assign({},pl,{d1:pl.conv.d1,d2:pl.conv.d2,
      sum:pl.conv.sum,odds:ROLL_ODDS[pl.conv.sum]});
    if(g.over||!nextSide(g)){ finishLive(); return false; }
    render(); return true;
  }
  if(g.over||!nextSide(g)){ finishLive(); return false; }
  LIVE.last=possession(g,nextSide(g));
  if(g.pending2){ render(); return true; }
  if(g.over||!nextSide(g)){ finishLive(); return false; }
  render();
  return true;
}
function rollNow(){
  if(!LIVE||LIVE.done)return;
  LIVE.running=false; clearTimeout(LIVE_TIMER);
  step();
}
function setRollMode(m){
  S.settings.roll=m;
  if(!LIVE){ render(); return; }
  LIVE.running=(m==='auto')&&!LIVE.done;
  render();
  if(LIVE.running) scheduleTick(); else clearTimeout(LIVE_TIMER);
}
function togglePause(){
  if(!LIVE)return;
  LIVE.running=!LIVE.running;
  render();
  if(LIVE.running) scheduleTick(); else clearTimeout(LIVE_TIMER);
}
function setSpeed(ms){
  S.settings.autoMs=ms;
  render();
  if(LIVE&&LIVE.running) scheduleTick();
}
function skipLive(){
  clearTimeout(LIVE_TIMER);
  if(!LIVE)return;
  LIVE.running=false; autoPlay(LIVE.g); finishLive();
}
function finishLive(){
  clearTimeout(LIVE_TIMER);
  LIVE.g.over=true; LIVE.running=false; LIVE.done=true;
  // bank it here rather than on Continue — otherwise navigating away or
  // reloading before pressing Continue loses the game entirely
  if(!LIVE.applied){ LIVE.applied=true; applyResult(LIVE.g); updateRanks(); }
  render();
}
function closeLive(){
  const g=LIVE.g;
  const wasMine=(g.aid===S.me||g.hid===S.me);
  if(!LIVE.applied){ LIVE.applied=true; applyResult(g); updateRanks(); }
  LIVE=null;
  if(wasMine) jobWarningCheck();
  render();
}

/* sim whatever is left this week, then move on */
function finishWeek(){
  const m=userGameThisWeek();
  if(m){
    const g=prepGame(m.aid,m.hid,{neutral:m.neutral,week:S.week});
    autoPlay(g); applyResult(g); updateRanks(); jobWarningCheck();
  }
  simRestOfWeek();
  advanceWeek();
  render();
}

function pickTeam(id){
  if(EDIT_SEL===null){ EDIT_SEL=id; render(); return; }
  if(EDIT_SEL===id){ EDIT_SEL=null; render(); return; }

  const me=S.teams[S.me];
  const snapEntry=e=>e?{opp:e.opp,home:e.home}:null;
  const before=snapEntry(me.sched[EDIT_WEEK]);
  const snap=snapshotNC();

  const r=ncSwap(EDIT_WEEK, EDIT_SEL, id);
  if(!r.ok){ toast(r.why); EDIT_SEL=null; render(); return; }

  // only your own schedule moving triggers a fee
  const after=snapEntry(me.sched[EDIT_WEEK]);
  const moved = before && after && (before.opp!==after.opp || before.home!==after.home);
  if(moved){
    const gainedHome = !before.home && after.home;
    const fee = scheduleFee(gainedHome);
    if(fee>S.money){
      restoreNC(snap);
      toast(`Need $${fee} to ${gainedHome?'move that game home':'change that game'}`);
      EDIT_SEL=null; render(); return;
    }
    if(fee) debit(fee, gainedHome?'Moved a game home':'Schedule change');
    toast(fee ? `${gainedHome?'Moved home':'Schedule changed'} — $${fee}`
              : `${S.teams[EDIT_SEL].ab} and ${S.teams[id].ab} swapped`);
  }else{
    toast(`${S.teams[EDIT_SEL].ab} and ${S.teams[id].ab} swapped`);
  }
  EDIT_SEL=null; render();
}

/* full schedule list: logo, opponent name, record, result — tap for the box score */
function weekBoardFor(w){
  const seen=new Set(), out=[];
  S.teams.forEach(t=>{
    const g=t.sched[w]; if(!g) return;
    const k=t.id<g.opp?`${t.id}-${g.opp}`:`${g.opp}-${t.id}`;
    if(seen.has(k))return; seen.add(k);
    out.push({aid:g.home?g.opp:t.id, hid:g.home?t.id:g.opp});
  });
  return out;
}

/* box score for a live game object — overtimes collapse into one column */
function boxLive(g){
  const A=S.teams[g.aid], H=S.teams[g.hid];
  const aQ=collapseQ(g.aQpts), hQ=collapseQ(g.hQpts);
  const heads=[...PERIODS.slice(0,Math.min(4,aQ.length))];
  if(aQ.length>4) heads.push(otLabel(g.ot));
  const inOT = g.period>=4;
  const cur = inOT ? 4 : g.period;
  const shown = i => g.over || i<cur ||
    (i===cur && g.plays.some(p=>(p.period>=4?4:p.period)===i));
  const cell=(pts,i)=>`<td class="num ${i===cur&&!g.over?'now':''}">${shown(i)?pts:'·'}</td>`;
  return `<table class="box">
    <tr><th></th>${heads.map(h=>`<th class="num">${h}</th>`).join('')}<th class="num">F</th></tr>
    <tr class="${A.user?'me':''}"><td class="tname">${esc(A.ab)}</td>
      ${aQ.map(cell).join('')}<td class="num tot">${g.aScore}</td></tr>
    <tr class="${H.user?'me':''}"><td class="tname">${esc(H.ab)}</td>
      ${hQ.map(cell).join('')}<td class="num tot">${g.hScore}</td></tr>
  </table>`;
}

  const away=e.home?o:t, home=e.home?t:o;
  const aQ=e.home?e.oq:e.q, hQ=e.home?e.q:e.oq;
  const aS=e.home?e.pa:e.pf, hS=e.home?e.pf:e.pa;
  const heads=[...PERIODS.slice(0,Math.min(4,aQ.length))];
  if(aQ.length>4) heads.push(otLabel(e.ot||1));
  return `<table class="box">
    <tr><th></th>${heads.map(h=>`<th class="num">${h}</th>`).join('')}<th class="num">F</th></tr>

        const cls=(last&&last.sum===n?'hit ':'')+(p===7?'td':p===3?'pts':'');
        return `<div class="og ${cls}"><span class="n">${n}</span><span class="p">${p||'–'}</span></div>`;
      }).join('')}
    </div>`}
    <div class="log">
      ${g.plays.slice().reverse().slice(0,30).map(p=>
        `<div>${g.quarters?`<span style="color:var(--dim-2)">${periodName(p.period)}</span> `:''}<b>${esc(p.ab)}</b> ${p.redo
          ? `rolled ${p.redo.sum}, <span class="to">${p.note==='replay overturn'?'overturned':'again'}</span> ${p.sum}`
          : `rolled ${p.sum}`} — ${
          p.note ? `<span class="${p.pts?'sc':''}">${esc(p.note)}${p.pts?', '+p.pts:''}</span>`
          : p.pts===7?'<span class="sc">touchdown, 7</span>'
          : p.pts===3?'<span class="sc">field goal, 3</span>':'no points'
        }${p.conv?` <span style="color:var(--dim-2)">[two-point roll ${p.conv.sum}]</span>`:''
        } <span style="color:var(--dim-2)">(${p.a}-${p.h})</span></div>`).join('')}
    </div>
  </div>

  ${done?`
    <div class="card center">
      <div style="font-family:var(--disp);font-size:31px;letter-spacing:.03em;color:var(--amber)">
        ${g.aScore>g.hScore?esc(A.ab):esc(H.ab)} ${Math.max(g.aScore,g.hScore)}-${Math.min(g.aScore,g.hScore)}</div>
      ${g.ot?`<p class="note">${otLabel(g.ot)} — ${g.ot} overtime${g.ot>1?'s':''}</p>`:''}
    </div>`:''}`;
}

  return h+'</div>';
}

function buy(kind){
  const t=S.teams[S.me];
  const map={roll:['rolls',COST_ROLL,MAX_ROLL,'Possessions'],
             cal:['cal',COST_CAL,MAX_CAL,'Caliber'],
             def:['def',COST_DEF,MAX_DEF,'Defense']};
  const [k,tbl,max,lbl]=map[kind];
  const cost=costOf(k, tbl[t[k]]);
  if(t[k]>=max||!cost) return toast('Already maxed out.');
  if(S.money<cost) return toast('Not enough cash.');
  debit(cost, `${lbl} up to ${t[k]+1}`); t[k]++;
  toast(`${lbl} up to ${t[k]}.`);
  render();
}
function setOpt(k,v){ S.settings[k]=v; render(); }
function openBoost(){
  const t=S.teams[S.me];
  const cap={rolls:MAX_ROLL, cal:MAX_CAL, def:MAX_DEF};
  sheet(`<h3>Recruiting boost</h3>
    <p class="note">$${costOf('boost',BOOST_COST)} — less than buying the point outright, because it isn't
    guaranteed. Two swings at the rating you pick, about a three-in-four chance, and your
    roster can't slide backwards that offseason.</p>
    <div style="margin-top:12px">
    ${['rolls','cal','def'].map(k=>{
      const maxed=t[k]>=cap[k];
      return `<button class="pick" ${maxed?'disabled style="opacity:.45"':`onclick="setBoost('${k}')"`}>
        <div class="pick-n">
          <div class="t" style="text-transform:capitalize">${STAT_LABEL[k]}</div>
          <div class="s">Now ${t[k]} of ${cap[k]}${maxed?' — already maxed':''}</div>
        </div>
        <div class="stars" style="color:var(--amber)">${maxed?'—':'+1'}</div>
      </button>`;
    }).join('')}
    </div>
    <button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">Cancel</button>`);
}
function setBoost(k){
  const c=costOf('boost',BOOST_COST);
  if(S.money<c) return toast('Not enough cash.');
  debit(c, 'Recruiting boost: '+STAT_LABEL[k]);
  S.recruitBoost=k;
  closeSheet(); toast(`Recruiting aimed at ${STAT_LABEL[k]}`); render();
}

function buyPep(k){
  const c=costOf('pep_'+k,PEP_COST[k]);
  if(S.money<c) return toast('Not enough cash.');
  debit(c, 'Pep talk: '+({roll:'possession',cal:'caliber',def:'defense'}[k]));
  S.pep[k]++;
  render();
}

let LEAGUE_VIEW='poll';
let STAT_SORT='poll';

    h+=`<p class="eyebrow" style="margin-top:14px">If the season ended today · ${fmt}-team field</p>

          ? 'All nine conference leaders are in. Seeds 1 to 8 would have a bye; 9 to 24 open at the higher seed.'

      </div>
      <div class="card" style="padding:6px 13px;margin-top:10px"><table>
        <tr><th class="rk">Sd</th><th>Team</th><th class="num">Rec</th><th class="num">Status</th></tr>
        ${field.map((t,i)=>{
          const seed=i+1;
          const bye=seed<=byes;
          const champ=champIds.has(t.id);
          return `<tr class="${t.user?'me':''}" onclick="showTeam(${t.id})" style="cursor:pointer">
            <td class="rk" style="color:${bye?'var(--amber)':'var(--dim-2)'}">${seed}</td>
            <td class="tname">${esc(t.name)}${champ?` <span class="pill a">${t.conf}</span>`:''}</td>
            <td class="num">${recOf(t)}</td>
            <td class="num" style="color:${bye?'var(--amber)':'var(--dim)'}">${bye?'Bye':'Round 1'}</td>
          </tr>`;

      <div class="card" style="padding:6px 13px"><table>
        ${firstOut.map(t=>`<tr onclick="showTeam(${t.id})" style="cursor:pointer">
          <td class="tname">${esc(t.name)}</td><td class="num">${recOf(t)}</td>
          <td class="num" style="color:var(--dim-2)">${t.conf}</td></tr>`).join('')}
      </table></div>`:''}
      ${fmt===12?`<p class="note" style="margin-top:12px;color:var(--dim-2)">
        A vote on expanding to 24 comes${(S.voteHistory||[]).length?' round again':''} after season ${S.nextVote||8}.</p>`:''}`;
    return h;
  }

  if(LEAGUE_VIEW==='poll'){
    const top=S.teams.slice().sort((a,b)=>a.rank-b.rank).slice(0,25);
    h+=`<p class="eyebrow" style="margin-top:14px">Tap any team for their schedule</p>
      <div class="card" style="padding:6px 13px"><table>
      <tr><th class="rk">#</th><th>Team</th><th class="num">Rec</th><th class="num">Poll</th></tr>
      ${top.map(t=>`<tr class="${t.user?'me':''}" ${tap(t)} style="cursor:pointer">
        <td class="rk">${t.rank}</td>
        <td class="tname">${esc(t.name)}</td>
        <td class="num">${recOf(t)}</td>
        <td class="num" style="color:var(--dim)">${S.mode==='gambler'?'—':t.poll}</td></tr>`).join('')}
    </table></div>`;

  }else if(LEAGUE_VIEW==='stats'){
    const key={pf:t=>-t.pf, pa:t=>t.pa, diff:t=>-(t.pf-t.pa), poll:t=>-t.poll,
               rec:t=>-(t.w-t.l), name:t=>t.name}[STAT_SORT];
    const list=S.teams.slice().sort((a,b)=>{
      const x=key(a),y=key(b);
      return typeof x==='string'?x.localeCompare(y):x-y;
    });
    const th=(k,l,cls)=>`<th class="${cls||''}" onclick="STAT_SORT='${k}';render()"
      style="cursor:pointer;${STAT_SORT===k?'color:var(--amber)':''}">${l}</th>`;

      <tr>${th('name','Team')}${th('rec','W-L','num')}${th('pf','PF','num')}
          ${th('pa','PA','num')}${th('diff','Diff','num')}${th('poll','Poll','num')}</tr>
      ${list.map(t=>{
        const d=t.pf-t.pa;
        return `<tr class="${t.user?'me':''}" ${tap(t)} style="cursor:pointer">
          <td class="tname">${rankTag(t)}${esc(t.ab)}</td>

      <div class="card" style="padding:6px 13px"><table>

          <th class="num">PF</th><th class="num">PA</th></tr>
      ${st.map(t=>`<tr class="${t.user?'me':''}" ${tap(t)} style="cursor:pointer">
        <td class="tname">${rankTag(t)}${esc(t.ab)}</td>
        <td class="num">${t.cw}-${t.cl}</td>
        <td class="num">${recOf(t)}</td>
        <td class="num">${t.pf}</td>
        <td class="num" style="color:var(--dim)">${t.pa}</td>
      </tr>`).join('')}</table></div>`;
  }
  return h;
}
function bracket(){
  const P=S.playoff; if(!P) return '';
  const T=S.teams;
  const rounds=playoffRounds();

  const side=(id,score,won,shown)=>{
    const t=T[id];
    return `<button class="bk-team ${won?'win':''} ${t.user?'mine':''}" onclick="showTeam(${id})">
      <span class="sd">${t.seed||'-'}</span>
      <span class="ab">${esc(t.ab)}</span>
      <span class="sc">${shown?score:'–'}</span></button>`;
  };
  const game=g=>{
    const aw=g.done&&g.a>g.h, hw=g.done&&g.h>g.a;
    return `<div class="bk-game">
      ${side(g.aid,g.a,aw,g.done)}
      ${side(g.hid,g.h,hw,g.done)}
    </div>`;
  };

  let h=`<p class="eyebrow">${S.year} playoff</p>`;

  // seeds 1-4 sit out the first round
  if(P.byes&&P.round===1){
    h+=`<div class="card" style="padding:11px 13px">
      <p class="eyebrow" style="margin:0 0 7px">First-round byes</p>
      <div class="bk-byes">${P.byes.map(id=>
        `<button class="bk-team win ${T[id].user?'mine':''}" onclick="showTeam(${id})">
          <span class="sd">${T[id].seed}</span><span class="ab">${esc(T[id].ab)}</span></button>`).join('')}</div>
    </div>`;
  }

  rounds.forEach(r=>{
    if(!r.reached) return;
    h+=`<p class="eyebrow" style="margin:16px 0 7px">${r.name}</p>
      <div class="bk-round ${r.r===4?'final':''}">${r.games.map(game).join('')}</div>`;
  });

  if(P.champion!=null){
    const c=T[P.champion];
    h+=`<div class="card center" style="border-color:var(--amber);margin-top:14px">
      <p class="eyebrow">National champions</p>
      <div style="font-family:var(--disp);font-size:27px;letter-spacing:.03em;color:var(--amber)">
        ${esc(c.name)}</div></div>`;
  }
  return h;
}
