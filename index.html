/* ============================================================
   THE GAMBLER  (v1.41)
   A career mode with no program. $5,000, the weekly board, and
   whatever edge you can find. The league runs itself; every
   offseason the same drift and identity swaps hit as usual.
   ============================================================ */
const MIN_BET=5;
const r2 = v => Math.round(v*100)/100;
function fmtCash(v){
  const a=Math.abs(v);
  const s=Number.isInteger(a)?a.toLocaleString()
    :a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return (v<0?'-$':'$')+s;
}
function fmtHc(v){
  const a=Math.abs(v), s=Number.isInteger(a)?a.toFixed(0):a.toFixed(1);
  return v>0?'+'+s : v<0?'-'+s : 'PK';
}
const fmtMl = p => p>0?'+'+p:''+p;

function startGambler(){
  const el=$('cname'); const nm=(el&&el.value.trim())||'The Gambler';
  S.mode='gambler'; S.gname=nm; S.coach.name=nm;
  S.me=-1; S.phase='season'; S.preseasonDone=true;
  S.bank={cash:5000, peak:5000, w:0,l:0,p:0, ev:0,
          wagered:0, won:0, lost:0, pending:[], history:[], nextId:1};
  if(S.settings.confSwap!==false) swapAllConferences();
  S.teams.forEach(t=>{ t.poll=(t.rolls+t.cal*3+t.def)*20; });
  updateRanks(); buildSchedule(); ensureJuice();
  TAB='week'; render();
  sheet(`<h3>Welcome to the book</h3>
    <p class="note">$5,000. Minimum bet $${MIN_BET}, maximum whatever you're holding.
    Spreads and totals pay -110; moneylines pay their price. The board hangs new
    numbers every week — some of them are wrong. Finding out which is your job.</p>
    <button class="btn" style="margin-top:14px" onclick="closeSheet()">Show me the board</button>`);
}

/* --- quiet weekly misalignment: 3-7 games get a bad number --- */
function juiceKey(){ return S.year+':'+S.week; }
function ensureJuice(){
  if(S.mode!=='gambler') return;
  const key=juiceKey();
  const fresh = !(S.juice && S.juice.key===key);
  if(!fresh && S.lines && S.lines.key===key) return;
  const games=weekBoard().filter(g=>!g.played);
  if(fresh){
    const n=Math.min(games.length, 3+rnd(5));            // 3..7
    const adj={};
    shuffle(games.slice()).slice(0,n).forEach(g=>{
      adj[g.aid+'-'+g.hid]={ kind: rnd(2)?'sp':'tot',
                             d: (1+rnd(4))*0.5*(rnd(2)?1:-1) };   // ±0.5..2
    });
    S.juice={key, adj};
  }
  // The book sims its own games: every posted number comes from running
  // the matchup SIM_N times through the real engine, so the throttle,
  // OT, and every competitive adjustment are priced in by construction.
  const map={};
  games.forEach(g=>{ map[g.aid+'-'+g.hid]=makeBook(g.aid,g.hid,g.neutral,
    S.juice.adj[g.aid+'-'+g.hid]); });
  S.lines={key, map};
}

const SIM_N=300;
const r3 = v => Math.round(v*1000)/1000;
function priceMl(p){
  if(p>=.945||p<=.055) return null;          // off the board
  const q=Math.min(.975, p*1.045);           // the book's hold
  let am = q>=.5 ? -Math.round(q/(1-q)*20)*5 : Math.round((1-q)/q*20)*5;
  if(am<0&&am>-105) am=-105;
  if(am>0&&am<100)  am=100;
  return am;
}
/* Pick the number that best balances the two sides. The raw median of a
   lumpy discrete distribution can sit right on a mass point (margins pile
   up on 7s and 3s), so scan nearby half-points and take the one whose
   cover probability is closest to a coin flip. */
function balanceLine(sorted, start){
  let best=start, bestOff=1;
  for(let c=start-1.5;c<=start+1.5;c+=0.5){
    const cc=r05(c);
    let below=0, at=0;
    for(const v of sorted){ if(v<cc)below++; else if(v===cc)at++; }
    const off=Math.abs((below+at/2)/sorted.length-.5);
    if(off<bestOff-1e-9){ bestOff=off; best=cc; }
  }
  return best;
}
function makeBook(aid,hid,neutral,j){
  const margins=new Array(SIM_N), totals=new Array(SIM_N);
  for(let i=0;i<SIM_N;i++){
    const g=prepGame(aid,hid,{neutral});
    autoPlay(g);
    margins[i]=g.hScore-g.aScore;
    totals[i]=g.hScore+g.aScore;
  }
  margins.sort((a,b)=>a-b); totals.sort((a,b)=>a-b);
  const med=a=>{const m=a.length>>1; return a.length%2?a[m]:(a[m]+a[m-1])/2;};
  const fairSp =balanceLine(margins, r05(med(margins)));
  const fairTot=balanceLine(totals , r05(med(totals)));
  let sp=fairSp, tot=fairTot;
  if(j){ if(j.kind==='sp') sp=r05(sp+j.d); else tot=r05(tot+j.d); }
  if(sp> SPREAD_CAP) sp= SPREAD_CAP;
  if(sp<-SPREAD_CAP) sp=-SPREAD_CAP;
  tot=Math.max(14.5,tot);
  const cnt=(arr,f)=>{let s=0;for(const v of arr)if(f(v))s++;return s;};
  const pA =r3(cnt(margins,m=>m< sp)/SIM_N);   // away covers: a + sp > h
  const puA=r3(cnt(margins,m=>m===sp)/SIM_N);
  const pOv=r3(cnt(totals ,t=>t> tot)/SIM_N);
  const puT=r3(cnt(totals ,t=>t===tot)/SIM_N);
  const pH =r3(cnt(margins,m=>m> 0 )/SIM_N);
  return {sp,tot, mlA:priceMl(1-pH), mlH:priceMl(pH),
          fair:{sp:fairSp,tot:fairTot}, pA,puA,pOv,puT,pH};
}

/* --- the posted market: cached per week --- */
function market(aid,hid,neutral){
  ensureJuice();
  const key=juiceKey(), k=aid+'-'+hid;
  if(S.lines && S.lines.key===key && S.lines.map[k]) return S.lines.map[k];
  const e=makeBook(aid,hid,neutral,
    (S.juice&&S.juice.key===key)?S.juice.adj[k]:null);
  if(S.lines && S.lines.key===key) S.lines.map[k]=e;
  return e;
}

/* --- expected value straight off the book's own simulations --- */
function slipProbs(M,type){
  if(type==='spA') return {p:M.pA, push:M.puA};
  if(type==='spH') return {p:r3(Math.max(0,1-M.pA-M.puA)), push:M.puA};
  if(type==='ovr') return {p:M.pOv, push:M.puT};
  if(type==='und') return {p:r3(Math.max(0,1-M.pOv-M.puT)), push:M.puT};
  if(type==='mlA') return {p:r3(1-M.pH), push:0};
  return {p:M.pH, push:0};
}
function betEV(b,stake){
  const mult=b.price>0?b.price/100:100/(-b.price);
  const p=b.pr?b.pr.p:.5, push=b.pr?b.pr.push:0;
  return stake*(p*mult-(1-p-push));
}

/* --- bet slip --- */
let SLIP=null;
function openSlip(aid,hid,neutral,type){
  if(S.bank.cash<MIN_BET){ toast(`Bankroll is under the $${MIN_BET} minimum`); return; }
  ensureJuice();
  const M=market(aid,hid,neutral);
  const A=S.teams[aid],H=S.teams[hid];
  let line=null, price=-110, desc='';
  if(type==='spA'){ line=M.sp;  desc=`${A.ab} ${fmtHc(M.sp)}`; }
  else if(type==='spH'){ line=-M.sp; desc=`${H.ab} ${fmtHc(-M.sp)}`; }
  else if(type==='ovr'){ line=M.tot; desc=`Over ${M.tot.toFixed(1)}`; }
  else if(type==='und'){ line=M.tot; desc=`Under ${M.tot.toFixed(1)}`; }
  else if(type==='mlA'){ if(M.mlA==null){toast('Moneyline is off the board');return;}
    price=M.mlA; desc=`${A.ab} ML ${fmtMl(M.mlA)}`; }
  else { if(M.mlH==null){toast('Moneyline is off the board');return;}
    price=M.mlH; desc=`${H.ab} ML ${fmtMl(M.mlH)}`; }
  SLIP={aid,hid,neutral:!!neutral,type,line,price,desc,pr:slipProbs(M,type),
        game:`${A.ab} @ ${H.ab}`, week:S.week, year:S.year};
  const dfl=Math.min(25,Math.floor(S.bank.cash));
  sheet(`<h3>Bet slip</h3>
    <p class="note" style="margin:0">${esc(A.name)} at ${esc(H.name)} · ${weekName(S.week)}</p>
    <div class="card" style="margin-top:10px;padding:10px 13px">
      <div style="font-family:var(--disp);font-size:20px;letter-spacing:.03em;text-transform:uppercase">
        ${esc(desc)}</div>
      <p class="note" style="margin:2px 0 0">${
        type==='mlA'||type==='mlH'?'Straight up — pays the price':'-110 · lay 110 to win 100'}</p>
    </div>
    <div class="speed" style="margin-top:11px">
      ${[5,25,50,100].map(v=>`<button onclick="setStake(${v})">$${v}</button>`).join('')}
      <button onclick="setStake('max')">Max</button>
    </div>
    <input id="slipStake" type="number" inputmode="decimal" min="${MIN_BET}" step="1" value="${dfl}"
      oninput="slipCalc()"
      style="width:100%;margin-top:9px;padding:11px;background:var(--panel);
      border:1px solid var(--line);border-radius:3px;color:var(--chalk);
      font-family:var(--mono);font-size:16px">
    <p class="note" id="slipOut" style="margin:8px 0 0"></p>
    <button class="btn" style="margin-top:11px" onclick="confirmBet()">Place bet</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Never mind</button>`);
  slipCalc();
}
function setStake(v){
  const el=$('slipStake'); if(!el) return;
  el.value = v==='max' ? Math.floor(S.bank.cash*100)/100 : v;
  slipCalc();
}
function slipCalc(){
  const out=$('slipOut'); if(!out||!SLIP) return;
  const st=parseFloat($('slipStake').value)||0;
  const mult=SLIP.price>0?SLIP.price/100:100/(-SLIP.price);
  out.innerHTML = st<MIN_BET ? `Minimum bet is $${MIN_BET}.`
    : st>S.bank.cash ? `That's more than your bankroll (${fmtCash(S.bank.cash)}).`
    : `Risk <b>${fmtCash(r2(st))}</b> to win <b>${fmtCash(r2(st*mult))}</b> — returns ${fmtCash(r2(st+st*mult))}.`;
}
function confirmBet(){
  if(!SLIP) return;
  const st=r2(parseFloat($('slipStake').value)||0);
  if(st<MIN_BET){ toast(`Minimum bet is $${MIN_BET}`); return; }
  if(st>S.bank.cash){ toast('Not enough in the bankroll'); return; }
  const ev=r2(betEV(SLIP,st));
  const b={id:S.bank.nextId++, aid:SLIP.aid, hid:SLIP.hid, type:SLIP.type,
           line:SLIP.line, price:SLIP.price, desc:SLIP.desc, game:SLIP.game,
           week:SLIP.week, year:SLIP.year, stake:st, ev};
  S.bank.cash=r2(S.bank.cash-st);
  S.bank.wagered=r2(S.bank.wagered+st);
  S.bank.ev=r2(S.bank.ev+ev);
  S.bank.pending.push(b);
  SLIP=null; closeSheet();
  toast(`${b.desc} · ${fmtCash(st)}`);
  render();
}

/* --- settlement --- */
function settleBets(){
  if(S.mode!=='gambler'||!S.bank.pending.length) return null;
  const done=[], keep=[];
  S.bank.pending.forEach(b=>{
    const e=S.teams[b.aid].sched[b.week];
    const ok = e && e.opp===b.hid && e.played && b.year===S.year;
    if(!ok){
      if(b.year===S.year && b.week===S.week){ keep.push(b); return; }
      // game vanished (bracket rebuilt, season rolled) — refund, no action
      S.bank.cash=r2(S.bank.cash+b.stake);
      S.bank.wagered=r2(S.bank.wagered-b.stake);
      S.bank.ev=r2(S.bank.ev-b.ev);
      return;
    }
    const a=e.pf, h=e.pa;
    let out;
    if(b.type==='spA')      out = a+b.line>h?'W': a+b.line===h?'P':'L';
    else if(b.type==='spH') out = h+b.line>a?'W': h+b.line===a?'P':'L';
    else if(b.type==='ovr') out = a+h>b.line?'W': a+h===b.line?'P':'L';
    else if(b.type==='und') out = a+h<b.line?'W': a+h===b.line?'P':'L';
    else if(b.type==='mlA') out = a>h?'W':'L';
    else                    out = h>a?'W':'L';
    const mult=b.price>0?b.price/100:100/(-b.price);
    let profit=0;
    if(out==='W'){ profit=r2(b.stake*mult);
      S.bank.cash=r2(S.bank.cash+b.stake+profit); S.bank.won=r2(S.bank.won+profit); S.bank.w++; }
    else if(out==='P'){ S.bank.cash=r2(S.bank.cash+b.stake); S.bank.p++; }
    else { S.bank.lost=r2(S.bank.lost+b.stake); S.bank.l++; }
    const row=Object.assign({},b,{result:out, score:`${a}-${h}`,
      profit: out==='W'?profit: out==='P'?0:-b.stake});
    done.push(row); S.bank.history.unshift(row);
  });
  S.bank.pending=keep;
  if(S.bank.history.length>250) S.bank.history.length=250;
  S.bank.peak=Math.max(S.bank.peak||0,S.bank.cash);
  return done.length?done:null;
}

let LAST_SETTLE=null;
function gamblerFinishWeek(){
  ensureJuice();
  const wk=S.week, yr=S.year;
  simRestOfWeek();
  const rows=settleBets();
  LAST_SETTLE = rows ? {week:wk, year:yr, rows} : null;
  advanceWeek();
  ensureJuice();
  render();
  if(LAST_SETTLE) showSettleSheet();
}
function showSettleSheet(){
  const s=LAST_SETTLE; if(!s) return;
  const w=s.rows.filter(b=>b.result==='W').length,
        l=s.rows.filter(b=>b.result==='L').length,
        p=s.rows.filter(b=>b.result==='P').length;
  const net=r2(s.rows.reduce((x,b)=>x+b.profit,0));
  sheet(`<h3>${weekName(s.week)} settled</h3>
    <p class="note" style="margin:0 0 8px"><b style="color:${net>=0?'var(--win)':'var(--brick)'}">${
      net>=0?'+':''}${fmtCash(net)}</b> · went ${w}-${l}${p?'-'+p:''} · bankroll ${fmtCash(S.bank.cash)}</p>
    ${s.rows.map(betRow).join('')}
    <button class="btn" style="margin-top:13px" onclick="closeSheet()">Back to the board</button>`);
}
function betRow(b){
  const col=b.result==='W'?'var(--win)':b.result==='L'?'var(--brick)':'var(--dim)';
  return `<div class="bet-r">

}

function marketCard(g){

/* your action on the game you're watching, with live cover status */
function liveTicket(g){
  const bets=S.bank?S.bank.pending.filter(b=>b.aid===g.aid&&b.hid===g.hid
    &&b.week===S.week&&b.year===S.year):[];
  if(!bets.length) return '';
  const a=g.aScore, h=g.hScore, tot=a+h;
  const st=b=>{
    let d;
    if(b.type==='spA') d=a+b.line-h;
    else if(b.type==='spH') d=h+b.line-a;
    else if(b.type==='ovr') return tot>b.line?['cashed','var(--win)']
      :tot===b.line?['push pace','var(--dim)']:[`needs ${(b.line-tot).toFixed(1).replace('.0','')} more`,'var(--amber)'];
    else if(b.type==='und') return tot<b.line?['covering','var(--win)']
      :tot===b.line?['push pace','var(--dim)']:['dead','var(--brick)'];
    else if(b.type==='mlA') d=a-h;
    else d=h-a;
    return d>0?['covering','var(--win)']:d===0?['push pace','var(--dim)']:['behind','var(--brick)'];
  };
  return `<div class="card" style="padding:9px 12px;margin-top:9px">

}

/* ============================================================
   WEEKLY HEADLINES  (v1.46)
   Five formulaic stories per completed week: the user's result
   up top, then the biggest Top-25 games ranked by the combined
   rating (strength) of the matchup. Deterministic — headlines
   are regenerated from results, never stored.
   ============================================================ */
function weekResults(w){
  const seen=new Set(), out=[];
  for(const t of S.teams){
    const e=t.sched && t.sched[w];
    if(!e || !e.played) continue;
    const key=Math.min(t.id,e.opp)+'-'+Math.max(t.id,e.opp);
    if(seen.has(key)) continue;
    seen.add(key);
    const aid = e.home ? e.opp : t.id;
    const hid = e.home ? t.id : e.opp;
    const ae = S.teams[aid].sched[w];
    if(!ae) continue;
    out.push({aid,hid,a:ae.pf,h:ae.pa,ot:ae.ot||0,q:ae.q,oq:ae.oq});
  }
  return out;
}
function storyFor(g,w){
  const A=S.teams[g.aid], H=S.teams[g.hid];
  const awayWon=g.a>g.h;
  const wT=awayWon?A:H, lT=awayWon?H:A;
  const ws=Math.max(g.a,g.h), ls=Math.min(g.a,g.h);
  const margin=ws-ls, total=g.a+g.h;
  const wr=wT.rank<=25?wT.rank:0, lr=lT.rank<=25?lT.rank:0;
  const rk=t=> t.rank<=25?`No. ${t.rank} `:'';
  const score=`${ws}-${ls}`;
  const seed=gHash(w,g.aid,g.hid);
  const pick=a=>a[seed%a.length];
  const otTxt=g.ot>1?g.ot+'OT':'OT';
  let head, tag=null;
  const upset = lr && (!wr || wr>lr+8);
  // v1.51 — largest deficit the winner faced at any quarter break
  const wEnt=wT.sched[w];
  let maxDef=0, cbAt=0;
  if(wEnt && wEnt.q && wEnt.oq && wEnt.q.length>=4){
    let mw=0,mo=0;
    for(let i=0;i<3;i++){
      mw+=wEnt.q[i]; mo+=wEnt.oq[i];
      if(mo-mw>maxDef){ maxDef=mo-mw; cbAt=i+1; }
    }
  }
  if(maxDef>=14){
    tag = upset ? 'UPSET' : 'COMEBACK';
    head=pick([
      `${rk(wT)}${wT.name} storm back from ${maxDef} down, ${upset?'stun':'beat'} ${rk(lT)}${lT.name} ${score}`,
      `Down ${maxDef}, ${rk(wT)}${wT.name} roar all the way back on ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} erase a ${maxDef}-point hole${g.ot?` and win in ${otTxt}`:''}, ${score} over ${rk(lT)}${lT.name}`]);
  }else if(upset){
    tag='UPSET';
    head=pick([
      `${rk(wT)}${wT.name} stuns ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} shocks ${rk(lT)}${lT.name} ${score}`,
      `${rk(wT)}${wT.name} topples ${rk(lT)}${lT.name}, ${score}`]);
  }else if(g.ot){
    head=pick([
      `${rk(wT)}${wT.name} outlasts ${rk(lT)}${lT.name} in ${otTxt}, ${score}`,
      `${rk(wT)}${wT.name} survives ${rk(lT)}${lT.name} in ${otTxt} classic, ${score}`]);
  }else if(ls===0){
    head=pick([
      `${rk(wT)}${wT.name} blanks ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} pitches a shutout of ${rk(lT)}${lT.name}, ${score}`]);
  }else if(margin>=24){
    head=pick([
      `${rk(wT)}${wT.name} rolls past ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} routs ${rk(lT)}${lT.name} ${score}`,
      `${rk(wT)}${wT.name} buries ${rk(lT)}${lT.name}, ${score}`]);
  }else if(margin<=3){
    head=pick([
      `${rk(wT)}${wT.name} edges ${rk(lT)}${lT.name} ${score}`,
      `${rk(wT)}${wT.name} escapes ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} holds off ${rk(lT)}${lT.name}, ${score}`]);
  }else if(total>=70){
    head=pick([
      `${rk(wT)}${wT.name} wins a shootout with ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} outguns ${rk(lT)}${lT.name} ${score}`]);
  }else{
    head=pick([
      `${rk(wT)}${wT.name} handles ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} takes care of ${rk(lT)}${lT.name}, ${score}`,
      `${rk(wT)}${wT.name} beats ${rk(lT)}${lT.name} ${score}`]);
  }
  // dek from the quarter data of the winner's own sched entry
  let dek=null;
  const we=wT.sched[w];
  if(we && we.q && we.oq && we.q.length>=4){
    const h1=we.q[0]+we.q[1], oh1=we.oq[0]+we.oq[1];
    const h2=we.q[2]+we.q[3], oh2=we.oq[2]+we.oq[3];
    if(g.ot) dek=`${lT.ab} forced ${g.ot>1?'multiple overtimes':'overtime'} but couldn't finish the job.`;
    else if(oh1-h1>=7) dek=`Down ${oh1}-${h1} at the break, ${wT.ab} stormed back after halftime.`;
    else if(h2-oh2>=14) dek=`${wT.ab} pulled away with a ${h2}-${oh2} second half.`;
    else if(h1>=oh1 && we.q[0]>=we.oq[0]) dek=`${wT.ab} led wire to wire.`;
  }
  if(maxDef>=14)
    dek=`Down ${maxDef} ${cbAt===1?'after one':cbAt===2?'at the half':'entering the fourth'}, ${wT.ab} took the game back by force. ${lT.ab} fall to ${recOf(lT)}.`;
  else if(maxDef>=8 && dek && !/stormed back|storm back/.test(dek))
    dek=`Trailed by ${maxDef} ${cbAt===1?'after one':cbAt===2?'at the half':'entering the fourth'} — ${dek}`;
  if(!dek) dek=`${wT.ab} moves to ${recOf(wT)}; ${lT.ab} falls to ${recOf(lT)}.`;
  const ri=roundInfo(w);
  if(ri){
    if(ri.natty){
      tag='CHAMPS';
      head=pick([
        `${wT.name} win it all — ${rk(lT)}${lT.name} fall ${score} in the title game`,
        `National champions: ${wT.name} top ${rk(lT)}${lT.name} ${score}`,
        `${wT.name} claim the crown, beating ${rk(lT)}${lT.name} ${score}`]);
      dek=`The ${S.year} season belongs to ${wT.ab}. ${lT.ab}'s run ends one win short at ${recOf(lT)}.`;
    }else if(ri.ccg && A.conf===H.conf){
      head=pick([
        `${rk(wT)}${wT.name} claim the ${CONF[wT.conf].n} crown, ${score} over ${rk(lT)}${lT.name}`,
        `${rk(wT)}${wT.name} capture the ${CONF[wT.conf].n} title, beating ${rk(lT)}${lT.name} ${score}`,
        `${CONF[wT.conf].n} champs: ${rk(wT)}${wT.name} take down ${rk(lT)}${lT.name} ${score}`]);
      dek=`${wT.ab} lift the ${CONF[wT.conf].n} trophy at ${recOf(wT)}; both sides now wait on the bracket.`;
    }else if(ri.next){
      dek=`${wT.ab} advance to the ${ri.next}; ${lT.ab}'s season ends at ${recOf(lT)}. (${ri.name})`;
    }
  }
  return {g, wT, lT, head, dek, tag,
          pow: strength(A)+strength(H),
          mine: A.user||H.user};
}
function weekHeadlines(w){
  const res=weekResults(w);
  if(!res.length) return [];
  const stories=res.map(g=>storyFor(g,w));
  const mine=stories.find(s=>s.mine);
  let rest=stories.filter(s=>!s.mine && (s.wT.rank<=25 || s.lT.rank<=25));
  if(rest.length<(mine?4:5))
    rest=rest.concat(stories.filter(s=>!s.mine && !rest.includes(s)));
  rest.sort((x,y)=>y.pow-x.pow);
  const out=mine?[mine,...rest]:rest;
  return out.slice(0,5);
}
let NEWS_WEEK=null;
function latestNewsWeek(){
  for(let w=Math.min(S.week, REG_WEEKS+9); w>=1; w--)
    if(weekResults(w).length) return w;
  return 0;
}
/* the generic play-by-play recap, rebuilt from the stored quarters */
/* v1.48 — scoring-play color. Real rolls when the sp log exists,
   plausible fabrication from the quarter scores when it doesn't. */
function decodeSp(str){
  const PTS={f:3,t:7,d:2,e:8,s:6};
  const out=[];
  if(!str) return out;
  for(let i=0;i+4<=str.length;i+=4)
    out.push({side:str[i], period:parseInt(str[i+1],36),
              sum:parseInt(str[i+2],36), pts:PTS[str[i+3]]||3});
  return out;
}
function split763(pts){
  for(let a=Math.floor(pts/7);a>=0;a--)
    if((pts-7*a)%3===0) return {t:a,f:(pts-7*a)/3,e:0,d:0};
  if(pts>=8){ const r=split763(pts-8); if(r) return {t:r.t,f:r.f,e:r.e+1,d:r.d}; }
  if(pts>=2){ const r=split763(pts-2); if(r) return {t:r.t,f:r.f,e:r.e,d:r.d+1}; }
  return {t:0,f:0,e:0,d:0};
}
function fabricatePlays(we,seed){
  // winner-relative fabrication: 'h' = winner's plays, 'a' = loser's
  const TD_SUMS=[4,5,5,10,10,4,3,11,2,12,5,10,4,11,3,10,5,4];
  const FG_SUMS=[6,6,9,9,5,10,6,9,6,5,10,9];
  const plays=[];
  const emit=(side,qi,pts,k)=>{
    const s=(seed ^ (qi*97 + k*131 + (side==='h'?7:13)))>>>0;
    const sum = pts>=6 ? TD_SUMS[s%TD_SUMS.length] : FG_SUMS[s%FG_SUMS.length];
    plays.push({side,period:qi,sum,pts});
  };
  const run=(side,arr)=>{ if(arr) arr.forEach((pts,qi)=>{
    if(!pts) return;
    const sp=split763(pts); let k=0;
    for(let i=0;i<sp.e;i++) emit(side,qi,8,k++);
    for(let i=0;i<sp.t;i++) emit(side,qi,7,k++);
    for(let i=0;i<sp.f;i++) emit(side,qi,3,k++);
    for(let i=0;i<sp.d;i++) emit(side,qi,2,k++);
  });};
  run('h',we.q); run('a',we.oq);
  return plays;
}
function excite(p){
  return ({2:5,12:5,3:3,11:3,4:1,10:1}[p.sum]||0)
       + ({8:6,7:3,2:4,3:1,6:2}[p.pts]||0)
       + (p.period>=4?3 : p.period===3?2 : 0);
}
function playColor(p,T,seed){
  const pick=(a,off)=>a[(seed>>>(off||0))%a.length];
  if(p.pts===3){
    const fg=22+(seed%33);
    return pick([`${T.ab} tacked on a ${fg}-yard field goal`,
                 `${T.ab} banked a ${fg}-yarder through the uprights`,
                 `${T.ab} settled for three from ${fg} out`],2);
  }
  if(p.pts===2) return `${T.ab} converted the do-or-die two-point try`;
  const yd=8+(seed%73);
  const how = yd<15 ? pick([
      `a goal-line punch-in`,
      `a quick slant that snuck through`,
      `a ${yd}-yard toss to the flat`,
      `a ${yd}-yard keeper up the gut`],3)
    : yd<40 ? pick([
      `a ${yd}-yard catch-and-run`,
      `a ${yd}-yard strike off play-action`,
      `a ${yd}-yard corner route`,
      `a ${yd}-yard screen with room to run`,
      `an off-tackle run from ${yd} out`,
      `a ${yd}-yard burst up the middle`],3)
    : pick([
      `a ${yd}-yard bomb over the top`,
      `a ${yd}-yard house call off the edge`,
      `a ${yd}-yard breakaway down the sideline`,
      `a ${yd}-yard post over the safeties`,
      `a flea-flicker that went ${yd} yards`,
      `a ${yd}-yard sprint down the seam`],3);
  let s;
  if(p.sum===2)       s=`${T.ab} rolled snake eyes and cashed it — ${how} that emptied the bench`;
  else if(p.sum===12) s=`${T.ab} came up boxcars on ${how}`;
  else if(p.sum===3||p.sum===11) s=`${T.ab} beat the long odds with ${how}`;
  else s=`${T.ab} scored on ${how}`;
  if(p.pts===8) s+= p.period<4
    ? `, then squared it up with a do-or-die two-point conversion at the gun`
    : `, and cashed the mandatory two on top`;
  if(p.pts===6) s+=`, but the two-point try came up empty`;
  return s;
}
/* v1.50 — drive conversion + dice-luck paragraph. The numeric luck
   figure reverse-engineers expected points, so the gambler only gets
   the narrative version. */
function statsPara(s,w){
  const {wT,lT}=s;
  const we=wT.sched[w];
  if(!we || !we.st || we.st.length<10) return null;
  const st=we.st;
  const wHome=!!we.home;
  const W = wHome ? st.slice(5,10) : st.slice(0,5);
  const L = wHome ? st.slice(0,5)  : st.slice(5,10);
  const pct=(sc,d)=> d? Math.round(sc/d*100) : 0;
  let p=`${wT.ab} cashed ${W[1]} of ${W[0]} drives (${pct(W[1],W[0])}%); ${
    lT.ab} converted ${L[1]} of ${L[0]} (${pct(L[1],L[0])}%).`;
  const wl=W[2]/10, ll=L[2]/10;
  const swing = wl - ll;
  const hotT = swing>=0 ? wT : lT, hotV = Math.abs(swing);
  const numeric = S.mode!=='gambler';
  if(hotV>=2){
    const fk=v=>(v>=0?'+':'')+v.toFixed(1);
    p += numeric
      ? ` The dice leaned ${hotT.ab}'s way — ${fk(wl)} points over expectation for ${wT.ab} against ${fk(ll)} for ${lT.ab}.`
      : ` The dice ${hotV>=6?`ran hot for ${hotT.ab}`:`leaned ${hotT.ab}'s way`} on the night.`;
  }else{
    p += ` The dice played it straight — no side could claim a bad beat.`;
  }
  const bits=[];
  if(W[3]) bits.push(`${W[3]} long-odds strike${W[3]>1?'s':''} for ${wT.ab}`);
  if(L[3]) bits.push(`${L[3]} long-odds strike${L[3]>1?'s':''} for ${lT.ab}`);
  if(L[4]>=2) bits.push(`${L[4]} whisker-misses left on the table by ${lT.ab}`);
  else if(W[4]>=2) bits.push(`${W[4]} whisker-misses by ${wT.ab}`);
  if(bits.length) p+=` Of note: ${bits.join(', ')}.`;
  return p;
}

  else                  p3=`The second half played out ${h2}-${oh2}, and ${wT.ab} kept ${lT.ab} at arm's length the rest of the way.`;
  if(we.ot){
    const wot=q[4]||0, oot=oq[4]||0;
    p3+=` Regulation ended tied at ${ws-wot}, and ${wT.ab} finished it in ${we.ot>1?we.ot+' overtimes':'overtime'}, ${wot}-${oot} in the extra period${we.ot>1?'s':''}.`;
  }
  p3 += colorLine(b2,2, !b2 ? ''
        : b2.period>=4 ? pick(['In the extra frame, ','When it mattered most, '],7)
        : b2.T===wT    ? pick(['The dagger: ','The back-breaker: ','The knockout blow: '],7)
        :                pick([`${lT.ab}'s best counterpunch: `,'The bright spot in defeat: '],7));
  paras.push(p3);
  const sp4=statsPara(s,w);
  if(sp4) paras.push(sp4);
  // closer — postseason weeks say what the result *means*
  const ri=roundInfo(w);
  let p4;
  if(ri && ri.natty){
    return nattyParas(s,w,paras,plays);
  }else if(ri && ri.ccg && wT.conf===lT.conf){
    p4=`The win crowns ${wT.name} ${CONF[wT.conf].n} champions at ${recOf(wT)}. ${
      lT.name} close the regular slate ${recOf(lT)} — both sides now sweat the bracket reveal.`;
  }else if(ri && ri.next){
    p4=`${wT.name} (${recOf(wT)}) punch their ticket to the ${ri.next}. For ${
      lT.name}, the season ends here at ${recOf(lT)}.`;
  }else{
    p4=`The win moves ${wT.name} to ${recOf(wT)}${wT.streak>=3?` and runs their streak to ${wT.streak}`:''}; ${lT.name} ${pick(['falls to','drops to','slips to'],5)} ${recOf(lT)}.`;
    const ne=wT.sched[w+1];
    if(ne && !ne.played && S.teams[ne.opp])
      p4+=` Up next for ${wT.ab}: ${ne.home?'':'a trip to '}${S.teams[ne.opp].name}.`;
  }
  paras.push(p4);
  return paras;
}

/* v1.49 — the national championship gets the full treatment: season
   retrospective for the winner, then every scoring play narrated. */
function nattyParas(s,w,gameParas,plays){
  const {wT,lT,g}=s;
  const ws=Math.max(g.a,g.h), ls=Math.min(g.a,g.h);
  const seed=gHash(w,g.aid,g.hid);
  const pick=(a,off)=>a[(seed>>>(off||0))%a.length];
  const rk=t=> t.rank<=25?`No. ${t.rank} `:'';
  const paras=[];
  // crown lede
  paras.push(`${pick(['The confetti falls on','The mountain top belongs to','The season ends with one team standing:'],1)} ${
    wT.name.replace(/\.+$/,'')}. A ${ws}-${ls} win over ${rk(lT)}${lT.name} in the National Championship${
    s.tag==='UPSET'?', an upset for the ages,':''} seals the ${S.year} title.`);
  // season retrospective
  const losses=[];
  for(let i=1;i<=REG_WEEKS;i++){
    const e=wT.sched[i];
    if(e && e.played && !e.won && S.teams[e.opp]) losses.push(S.teams[e.opp].name);
  }
  const ccg=wT.sched[CCG_WEEK];
  const ccgLost = ccg && ccg.played && !ccg.won;
  let retro = losses.length===0
    ? (ccgLost ? `The regular season was perfect`
               : `The road there was spotless — an unbeaten regular season`)
    : `The regular season brought ${losses.length===1
        ?`one stumble (${losses[0]})`:`slips against ${losses.join(' and ')}`}`;
  if(ccg && ccg.played && S.teams[ccg.opp])
    retro += ccg.won
      ? `, plus a ${CONF[wT.conf].n} championship over ${S.teams[ccg.opp].name}`
      : ` — though a ${CONF[wT.conf].n} title-game loss to ${S.teams[ccg.opp].name} only sharpened them`;
  const path=[];
  for(let i=CCG_WEEK+1;i<w;i++){
    const e=wT.sched[i];
    if(e && e.played && e.won && S.teams[e.opp]){
      const rn=roundInfo(i);
      path.push(`${S.teams[e.opp].name} ${e.pf}-${e.pa}${rn?` in the ${rn.name}`:''}`);
    }
  }
  retro += path.length
    ? `. Then came the gauntlet: ${path.join(', then ')}, and finally tonight.`
    : `, and then tonight's finale.`;
  paras.push(retro);
  // the two game-shape paragraphs from the standard recap
  if(gameParas[1]) paras.push(gameParas[1]);
  if(gameParas[2]) paras.push(gameParas[2]);
  // full play-by-play, quarter by quarter, with running score
  let rw=0, rl=0;
  const QNAMES=['First quarter','Second quarter','Third quarter','Fourth quarter'];
  const byP={};
  plays.forEach((p,i)=>{ (byP[p.period]=byP[p.period]||[]).push([p,i]); });
  const periods=Object.keys(byP).map(Number).sort((a,b)=>a-b);
  for(const per of periods){
    const label = per<4 ? QNAMES[per] : (periods.filter(x=>x>=4).length>1?`Overtime ${per-3}`:'Overtime');
    const bits=byP[per].map(([p,i],j)=>{
      if(p.T===wT) rw+=p.pts; else rl+=p.pts;
      const ps=(seed ^ ((p.period*13+p.sum*7+i)*2654435761))>>>0;
      const lead = j===0?'':pick([`The answer came quickly: `,`Right back the other way: `,``],(ps%7)+1);
      return `${lead}${playColor(p,p.T,ps)} (${Math.max(rw,rl)===rw&&rw>=rl?rw+'-'+rl:rl+'-'+rw}${rw>=rl?(rw===rl?', tied':`, ${wT.ab}`):`, ${lT.ab}`})`;
    });
    paras.push(`${label}: ${bits.join('. ').replace(/\.\s*\./g,'.')}${bits.length?'.':' — scoreless.'}`);
  }
  const spN=statsPara(s,w);
  if(spN) paras.push(spN);
  // closer
  paras.push(`The final: ${ws}-${ls}. ${wT.name} finish ${recOf(wT)}${
    losses.length===0?' — a perfect season':''} — national champions.`);
  return paras;
}

function doOffseason(){
  // close the books on the season first — the market opens on the
  // ratings and records the season actually finished with
  const close = closeSeason();
  LAST_CLOSE = close;
  // forty seasons is forty seasons, sacked or not — the cap wins
  if(close.capped){
    retireCareer(close.fired
      ? 'Forty seasons on the sideline, and this one ended badly. Time to hang it up.'
      : 'You reached forty seasons on the sideline. Time to hang it up.');
    saveHighScore(); TAB='week'; render(); return;
  }
  if(close.fired){ S.phase='fired'; render(); return; }
  if(close.expiring){
    S.offers=buildJobOffers();
    if(!S.offers.length){
      if(S.me>=0) S.teams[S.me].user=false;
      S.me=-1;
      applyLeagueDrift();
      if(S.settings.confSwap!==false) swapAllConferences();
      resetSeason();
      S.phase='unemployed'; TAB='week'; render(); return;
    }
    S.phase='offers'; TAB='week'; render(); return;
  }
  continueOffseason();
}

      <span class="off-rat">${row.from.join('/')} <span style="color:var(--dim-2)">→</span> ${
        row.to.map((v,i)=>arrow(row.from[i],v)).join('/')}</span>
    </div>
    <div class="off-why">${row.rec} · ${esc(row.why)}</div>
  </div>`;

  const group=rep[OFF_GROUP]||[];
  sheet(`<h3>${r.report.year||S.year-1} offseason</h3>
    ${rep.boost?(()=>{
      const b=rep.boost;
      return `<div class="card" style="padding:10px 12px;margin-bottom:10px;border-color:${
        b.got?'var(--win)':'var(--dim-2)'}">
        <p class="eyebrow" style="margin:0 0 4px">Recruiting boost</p>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
          <span style="font-size:13.5px;font-weight:600;color:${b.got?'var(--win)':'var(--dim)'}">
            ${b.got?`Landed a ${STAT_LABEL[b.stat]}`:`No ${STAT_LABEL[b.stat]} this time`}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--dim-2)">
            rolled ${b.rolled.join(', ')}</span>
        </div>
        <p class="note" style="margin:3px 0 0">${b.got
          ? 'Two swings, and it hit. No decline risk this offseason either.'
          : b.maxed ? 'That rating was already at its ceiling.'
          : 'Both swings missed — but the boost still kept your roster from sliding.'}</p>
      </div>`;})():''}
    ${r.recruit?(()=>{
      const q=r.recruit;
      const col = q.outcome==='improved'?'var(--win)':q.outcome==='declined'?'var(--brick)':'var(--amber)';
      return `<div class="card" style="padding:10px 12px;margin-bottom:10px;border-color:${col}">
        <p class="eyebrow" style="margin:0 0 4px">Recruiting</p>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
          <span style="font-size:13.5px;font-weight:600;color:${col}">${
            q.outcome==='improved'?'Class signed':q.outcome==='declined'?'Roster slipped':'Roster held'}</span>
          <span style="font-family:var(--mono);font-size:13px;color:${
            q.paid?'var(--amber)':'var(--dim-2)'}">${q.paid?'−$'+q.paid:'no charge'}</span>
        </div>
        <p class="note" style="margin:3px 0 0">${esc(q.note)}${
          q.cost&&!q.paid?` — needed $${q.cost}, you had $${S.money}`:''}</p>
      </div>`;})():''}
    ${r.expMiss?`<div class="card" style="border-color:var(--brick);padding:10px 12px;margin-bottom:10px">
      <p class="eyebrow" style="margin:0 0 3px;color:var(--brick)">Championship expectation</p>
      <p class="note" style="margin:0">${esc(r.expMiss.why)}. <b>−${r.expMiss.hit.toLocaleString()}</b> coaching points.</p>
    </div>`:''}
    <p class="note">Season revenue $${r.rev}.${
      r.renewed?` Contract renewed — new fire line ${r.fireLine.toLocaleString()}.`:''}${
      r.swaps?` ${r.swaps} conference shuffles reordered next year's schedule.`:''}</p>

    ${rep.user?`<p class="eyebrow" style="margin:14px 0 6px">Your team</p>
      <div class="card" style="padding:4px 11px;border-color:var(--amber)">${line(rep.user)}</div>`:''}

    <div class="row2" style="margin-top:12px">
      <div class="stat"><div class="k">League avg rating</div>
        <div class="v" style="font-size:19px">${rep.avgBefore} → ${rep.avgAfter}</div></div>
      <div class="stat"><div class="k">Net change</div>
        <div class="v" style="font-size:19px;color:${
          rep.avgAfter-rep.avgBefore>=0?'var(--win)':'var(--brick)'}">${
          (rep.avgAfter-rep.avgBefore>=0?'+':'')+(rep.avgAfter-rep.avgBefore).toFixed(2)}</div></div>
    </div>

    <div class="speed" style="margin-top:12px">
      ${[['improved','Improved'],['unchanged','Unchanged'],['declined','Declined']].map(([k,l])=>
        `<button class="${OFF_GROUP===k?'on':''}" onclick="setOffGroup('${k}')">${l} ${rep.counts[k]}</button>`).join('')}
    </div>
    <div class="card" style="padding:4px 11px;margin-top:8px;max-height:38vh;overflow-y:auto">
      ${group.length?group.map(line).join(''):'<p class="note">Nobody in this group.</p>'}
    </div>

    <button class="btn" style="margin-top:14px" onclick="closeSheet();go('team')">Go spend money</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet();go('week')">Straight to Week 1</button>`);
}
function setOffGroup(k){ OFF_GROUP=k; showOffseasonReport(); }

function viewOffers(){
  const T=S.teams, offers=S.offers||[];
  const cur = S.me>=0 ? T[S.me] : null;
  return `
  <p class="eyebrow">Contract expired · ${S.year}</p>
  <div class="card">
    <h2 class="sec" style="margin-top:0">On the market</h2>
    <p class="note">Your deal is up. These are the jobs on the table now, judged on the
    season that just finished — before any roster movement. Coach rating
    <b>${S.coach.rating.toLocaleString()}</b> decides who calls at all.
    Signing anywhere new resets that rating to zero.</p>
    <p class="note" style="margin-top:7px;color:var(--dim-2)">Sorted by roster strength,
    then last season's wins${S.offers&&S.offers.some(o=>o.rehire)?', with your own school first':''}.</p>
  </div>
  ${offers.map((o,i)=>{
    const t=T[o.id];
    return `<button class="pick" onclick="takeOffer(${i})">
      ${badge(t)}
      <div class="pick-n">
        <div class="t">${esc(t.name)}${o.rehire?' <span class="pill a">Rehire</span>':''}</div>
        <div class="s">${o.w}-${o.l} · ${t.rolls}/${t.cal}/${t.def} · ${CONF[t.conf].n}</div>
        <div class="s" style="color:var(--amber)">${o.bonus?`$${o.bonus} bonus`:'No bonus'} · ${o.years} yrs</div>
      </div>
      <div class="stars">${'★'.repeat(clamp(Math.round(strength(t)/5),1,5))}</div>
    </button>`;
  }).join('')}
  <button class="btn ghost" style="margin-top:12px" onclick="confirmDecline()">Decline everything</button>`;
}

function confirmDecline(){
  sheet(`<h3>Decline all offers?</h3>
    <p class="note">You'll sit out next season unemployed, and your coach rating drops to
    zero. Offers come round again the following offseason.</p>
    <button class="btn" style="margin-top:14px;background:var(--brick);color:#fff"
      onclick="doDecline()">Sit it out</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Go back</button>`);
}
function doDecline(){
  declineOffers(); closeSheet();
  // the league still rolls forward even though you're out of a job
  applyLeagueDrift();
  if(S.settings.confSwap!==false) swapAllConferences();
  resetSeason();
  S.phase='unemployed';
  TAB='week'; render();
}

function takeOffer(i){
  const r=acceptOffer(i);
  if(!r) return;
  PENDING_SIGN=r; TAB='week'; render();
  sheet(`<h3>${esc(r.team)}</h3>
    <p class="note">${r.rehire?'Re-signed':'New contract'} — ${r.years} years.${
      r.reset?' Rating reset to zero at a new school.':''}</p>
    <div class="row2" style="margin-top:12px">
      <div class="stat"><div class="k">Signing bonus</div>
        <div class="v amber">$${r.bonus}</div></div>
      <div class="stat"><div class="k">Pep talks</div>
        <div class="v" style="font-size:19px">+${r.pep.roll}/${r.pep.cal}/${r.pep.def}</div></div>
    </div>
    <button class="btn" style="margin-top:14px" onclick="closeSheet();continueOffseason()">Get to work</button>`);
}
let PENDING_SIGN=null;

function viewRetired(){
  const c=S.coach;
  const pct=(w,l)=>{const n=w+l; return n?(w/n).toFixed(3).replace(/^0/,''):'—';};
  return `
  <p class="eyebrow">Career over · ${S.year}</p>
  <div class="card center" style="border-color:var(--amber)">
    <h2 class="sec" style="margin-top:0">${esc(c.name||'Coach')}</h2>
    <p class="note">${esc(S.retireReason||'Your career has ended.')}</p>
    <div style="font-family:var(--disp);font-size:34px;letter-spacing:.02em;
      color:var(--amber);margin-top:12px">${(S.finalScore||0).toLocaleString()}</div>
    <p class="eyebrow" style="margin:2px 0 0">Final run score</p>
  </div>
  <div class="row2">
    <div class="stat"><div class="k">Record</div><div class="v">${c.w}-${c.l}</div></div>
    <div class="stat"><div class="k">Win pct</div><div class="v">${pct(c.w,c.l)}</div></div>
    <div class="stat"><div class="k">Seasons</div><div class="v">${c.seasons}</div></div>
    <div class="stat"><div class="k">Playoffs</div><div class="v">${c.poApps||0}</div></div>
    <div class="stat"><div class="k">Conf titles</div><div class="v amber">${c.titles}</div></div>
    <div class="stat"><div class="k">Nat'l titles</div><div class="v amber">${c.natties}</div></div>
  </div>
  <h2 class="sec">Trophy case</h2>
  ${trophyCase()}
  ${c.resume.length?`<h2 class="sec">Every season</h2>
  <div class="card" style="padding:6px 13px"><table>
    <tr><th>Yr</th><th>Team</th><th class="num">Rec</th><th class="num">Fin</th></tr>
    ${c.resume.slice().reverse().map(r=>`<tr>
      <td class="rk">${String(r.year).slice(2)}</td>
      <td class="tname">${esc(r.team)}${r.natty?' <span class="pill a">Champs</span>':
        r.cc?' <span class="pill a">Conf</span>':''}</td>
      <td class="num">${r.w}-${r.l}</td>
      <td class="num">#${r.rank}</td></tr>`).join('')}
  </table></div>`:''}
  <button class="btn" style="margin-top:14px" onclick="openBoardFromRetire()">See the high scores</button>
  <button class="btn ghost" style="margin-top:8px" onclick="confirmReset()">Start a new career</button>
  <p class="verline">59-Second College Football · v${VERSION}</p>`;
}
function openBoardFromRetire(){ TAB='history'; HIST='board'; S.phase='retired'; openBoard(); }

function viewUnemployed(){
  return `
  <p class="eyebrow">${S.year}</p>
  <div class="card center">
    <h2 class="sec" style="margin-top:0">Out of work</h2>
    <p class="note">Nobody has a job for you. Sit the season out and see who's
    looking next offseason — but if the phone still doesn't ring, that's your career.</p>
  </div>
  <div class="row2">
    <div class="stat"><div class="k">Career</div><div class="v">${S.coach.w}-${S.coach.l}</div></div>
    <div class="stat"><div class="k">Coach rating</div><div class="v">${S.coach.rating}</div></div>
  </div>
  <button class="btn" style="margin-top:14px" onclick="sitOut()">Sit out ${S.year}</button>`;
}
function sitOut(){
  const n=sitOutSeason();
  if(!n) saveHighScore();
  TAB='week'; render();
}

function viewFired(){
  const c=S.coach;
  return `<div class="card center" style="border-color:var(--brick)">
    <p class="eyebrow">${S.resigned?'Resigned':'Relieved of duty'}</p>
    <h2 class="sec" style="margin-top:0">${S.resigned?'You walked':"You're out"}</h2>
    <p class="note">${S.resigned
      ? `You broke your contract at ${esc(S.teams[S.me].name)}. Rating halved to ${c.rating.toLocaleString()}.`
      : `Your rating fell to ${c.rating.toLocaleString()}, past the ${c.fireLine.toLocaleString()} line
         you signed against. ${esc(S.teams[S.me].name)} is going in a different direction.`}</p>
  </div>
  <div class="row2">
    <div class="stat"><div class="k">Career</div><div class="v">${c.w}-${c.l}</div></div>
    <div class="stat"><div class="k">Seasons</div><div class="v">${c.seasons}</div></div>
    <div class="stat"><div class="k">Conf titles</div><div class="v amber">${c.titles}</div></div>
    <div class="stat"><div class="k">Nat'l titles</div><div class="v amber">${c.natties}</div></div>
  </div>
  <button class="btn" style="margin-top:14px" onclick="goToMarket()">See who's hiring</button>`;
}
function goToMarket(){
  if(S.coach.seasons>=MAX_SEASONS){
    retireCareer('You reached forty seasons on the sideline. Time to hang it up.');
    saveHighScore(); TAB='week'; render(); return;
  }
  // offers are built against the rating you still hold; signing elsewhere
  // is what wipes it, exactly as btnAcceptOffer does
  S.offers=buildJobOffers();
  if(S.me>=0) S.teams[S.me].user=false;
  S.me=-1; S.resigned=false;
  // an empty market buys you one year on the sidelines, as in the original;
  // if it's still empty after that, sitOutSeason ends the career
  S.phase = S.offers.length ? 'offers' : 'unemployed';
  TAB='week'; render();
}

let SPLASH=true, SPLASH_T=null;
function paintSplash(){
  document.body.classList.add('splashon');
  $('view').innerHTML=`
  <div class="splash" onclick="dismissSplash()">
    <div class="sp-bg" style="background-image:url('${SPLASH_BG}')"></div>
    <div class="sp-x sp-blink">X</div>
    <div class="sp-mid">
      <div class="sp-title">59 Second<br>College Football</div>
      <div class="sp-rule"></div>
      <div class="sp-author">Created by Evan Graening</div>
    </div>
    <div class="sp-continue sp-blink">Click anywhere to continue...</div>
  </div>`;
}
function dismissSplash(){
  clearInterval(SPLASH_T); SPLASH_T=null;
  SPLASH=false;
  document.body.classList.remove('splashon');
  render();
}

(async function boot(){
  const saved=await load();
  S = saved || initState();
  if(S.pep) delete S.pep.timeout;
  if(S.pepOn) delete S.pepOn.timeout;
  S.settings = Object.assign({roll:'manual',autoMs:1100,stackCal:true,
                              stiffKnock:true,possTrim:true,confSwap:true,
                              randomNC:false, quarters:true,
                              recruitPay:true, board:'classic',
                              inflate:'flat'}, S.settings||{});
  if(S.coach && !S.coach.objBonus)
    S.coach.objBonus={w6:15,home3:8,p42:3,upset:3,top25:7,shut:10};
  S.teams.forEach(t=>{ if(t.logo==null) t.logo=t.id; });
  if(S.playoffFormat==null) S.playoffFormat=12;
  if(S.nextVote==null) S.nextVote=8;
  if(!S.voteHistory) S.voteHistory=[];
  S.teams.forEach(t=>{ if(t.sched && t.sched.length<FINAL_WEEK+1) t.sched.length=FINAL_WEEK+1; });
  if(saved && S.me>=0) toast('Dynasty loaded.');
  render();
})();
</script>
